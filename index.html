HELP.curl = `curl [OPTIONS] URL — transfère des données depuis ou vers un serveur.
  -I  en-têtes seulement     -s  mode silencieux
  -o FICHIER  écrit dans un fichier   -O  utilise le nom distant
  -L  suit les redirections  -X MÉTHODE  méthode HTTP
Le réseau est simulé : seuls quelques hôtes locaux répondent.`;
CMDS.curl = async (ctx, args) => {
  const g = getopt(args, {known:'IsSoOLXdHkvf', value:'oXdH'});
  if(g.error) return usageErr(ctx, 'curl', g.error);
  const url = g.rest[0];
  if(!url){ ctx.err('curl: try \'curl --help\' for more information\n'); return 2; }
  const key = url.replace(/\/$/,'');
  const fn = WEB[url] || WEB[key] || WEB[key + '/'];
  if(!fn){
    const host = (url.match(/^https?:\/\/([^\/]+)/) || [])[1] || url;
    ctx.err(`curl: (6) Could not resolve host: ${host}\n`);
    return 6;
  }
  const body = fn();
  if(body === null){
    ctx.err(`curl: (7) Failed to connect to localhost port 80 after 0 ms: Connexion refusée\n`);
    return 7;
  }
  if(g.opts.I){
    ctx.out(`HTTP/1.1 200 OK\r\nServer: nginx/1.22.1\r\nDate: ${now().toUTCString()}\r\nContent-Type: text/html\r\nContent-Length: ${bytelen(body)}\r\nConnection: keep-alive\r\n\r\n`);
    return 0;
  }
  if(g.opts.o || g.opts.O){
    const target = g.opts.o || basenameOf(url) || 'index.html';
    const w = writeFile(target, body, false);
    if(w.err){ ctx.err(`curl: (23) Failure writing output to destination\n`); return 23; }
    if(!g.opts.s) ctx.out(`  % Total    % Received % Xferd  Average Speed   Time    Time     Time  Current\n100  ${String(bytelen(body)).padStart(4)}  100  ${String(bytelen(body)).padStart(4)}    0     0  ${String(bytelen(body)*8).padStart(6)}      0 --:--:-- --:--:-- --:--:--  ${bytelen(body)*8}\n`);
    return 0;
  }
  ctx.out(body);
  return 0;
};
HELP.wget = `wget [OPTIONS] URL — télécharge un fichier (réseau simulé).
  -O FICHIER  enregistre sous ce nom          -q  mode silencieux
Sans -O, le nom est déduit de l'URL ; si l'URL ne désigne aucun fichier,
le contenu est enregistré dans index.html, comme le fait wget.`;
CMDS.wget = async (ctx, args) => {
  const g = getopt(args, {known:'OqcvnPt', value:'OPt', longs:['output-document','quiet','help']});
  if(g.error) return usageErr(ctx, 'wget', g.error);
  const url = g.rest[0];
  if(!url) return usageErr(ctx, 'wget', 'URL manquante');
  const quiet = g.opts.q || g.opts['--quiet'];
  const say = (t) => { if(!quiet) ctx.out(t); };
  const key = url.replace(/\/$/,'');
  const fn = WEB[url] || WEB[key] || WEB[key+'/'];
  const host = (url.match(/^https?:\/\/([^\/]+)/) || [])[1] || url;
  say(`--${now().toISOString().replace('T',' ').slice(0,19)}--  ${url}\nRésolution de ${host}... `);
  if(!fn){
    say('échec : Nom ou service inconnu.\n');
    ctx.err(`wget: impossible de résoudre l'adresse « ${host} »\n`);
    return 4;
  }
  const body = fn();
  if(body === null){
    say(`127.0.0.1\nConnexion à ${host}|127.0.0.1|:80... échec : Connexion refusée.\n`);
    return 4;
  }
  let name = g.opts.O || g.opts['--output-document'];
  if(!name){
    const path = url.replace(/^https?:\/\/[^\/]*/, '');
    name = path.replace(/\/+$/,'').split('/').pop();
    if(!name) name = 'index.html';
  }
  if(name === '-'){ ctx.out(body); return 0; }
  const w = writeFile(name, body, false);
  if(w.err){ ctx.err(`wget: ${name}: ${w.err.replace(/^.*?: /,'')}\n`); return 3; }
  say(`127.0.0.1\nConnexion à ${host}|127.0.0.1|:80... connecté.\nrequête HTTP transmise, en attente de la réponse... 200 OK\nTaille : ${bytelen(body)} [text/html]\nSauvegarde en : « ${name} »\n\n${name}    100%[==================>]  ${bytelen(body)}  --.-KB/s    ds 0s\n\n${now().toISOString().slice(0,19).replace('T',' ')} (${bytelen(body)} B/s) — « ${name} » sauvegardé [${bytelen(body)}]\n\n`);
  return 0;
};

HELP.ssh = "ssh [UTILISATEUR@]HÔTE — ouvre une session distante (réseau simulé).\n  -p PORT  port distant   -i CLÉ  clé privée à utiliser";
CMDS.ssh = async (ctx, args) => {
  if(args.includes('-V') || args.includes('--version')){
    ctx.err('OpenSSH_10.0p1 Ubuntu-2ubuntu1, OpenSSL 3.5.0 8 Apr 2025\n');
    return 0;
  }
  const g = getopt(args, {known:'pilvXYNqTt46AC', value:'pil', longs:['version','help']});
  if(g.error) return usageErr(ctx, 'ssh', g.error);
  const target = g.rest[0];
  if(!target) { ctx.err('usage: ssh [utilisateur@]hôte\n'); return 255; }
  const m = /^(?:([^@]+)@)?(.+)$/.exec(target);
  const who = m[1] || state.user, host = m[2];
  const ip = HOSTS[host];
  if(!ip){ ctx.err(`ssh: Could not resolve hostname ${host}: Name or service not known\n`); return 255; }
  if(!state.services.ssh.active && (host === 'localhost' || host === state.host)){
    ctx.err(`ssh: connect to host ${host} port 22: Connexion refusée\n`); return 255;
  }
  if(host !== 'localhost' && host !== '127.0.0.1' && host !== state.host){
    if(state.io.sleep) await state.io.sleep(700);
    ctx.err(`ssh: connect to host ${host} port 22: Aucune route vers l'hôte\n`);
    ctx.err(`(le simulateur ne dispose pas d'un vrai réseau : essayez « ssh ${who}@localhost »)\n`);
    return 255;
  }
  const kh = readFile(USERS[state.user].home + '/.ssh/known_hosts');
  if(kh.content !== undefined && !kh.content.includes(host)){
    ctx.out(`The authenticity of host '${host} (${ip})' can't be established.\nED25519 key fingerprint is SHA256:9pMk3vQ2LxT7bR4wYcN1sHjF8dA6uZ0eKgW5nXvBqTo.\n`);
    if(state.io.ask){
      const a = await state.io.ask("Are you sure you want to continue connecting (yes/no)? ");
      if(!/^(y|o)/i.test((a||'').trim())){ ctx.err('Host key verification failed.\n'); return 255; }
    }
    writeFile(USERS[state.user].home + '/.ssh/known_hosts', `${host} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL4kQq2mV\n`, true);
    ctx.out(`Warning: Permanently added '${host}' (ED25519) to the list of known hosts.\n`);
  }
  if(state.io.ask) await state.io.ask(`${who}@${host}'s password: `, {password:true});
  ctx.out(`Linux ${state.host} 7.0.0-8-generic #8-Ubuntu SMP PREEMPT_DYNAMIC x86_64\n\n` + (readFile('/etc/motd').content || '') + `Last login: ${timeString(now())} from ${state.net.ip}\n`);
  ctx.out(`(session simulée : vous êtes déjà sur cette machine, la session se referme)\nlogout\nConnection to ${host} closed.\n`);
  return 0;
};

HELP['ssh-keygen'] = "ssh-keygen [-t TYPE] [-f FICHIER] — génère une paire de clés SSH.\n  -t  type de clé (rsa, ed25519)   -f  chemin du fichier   -C  commentaire";
CMDS['ssh-keygen'] = async (ctx, args) => {
  const g = getopt(args, {known:'tfCbNylpq', value:'tfCbNy'});
  if(g.error) return usageErr(ctx, 'ssh-keygen', g.error);
  const type = g.opts.t || 'rsa';
  const home = USERS[state.user].home;
  let file = g.opts.f || `${home}/.ssh/id_${type}`;
  if(state.io.ask && !g.opts.f){
    const a = await state.io.ask(`Enter file in which to save the key (${file}): `);
    if(a && a.trim()) file = absPath(a.trim());
  }
  if(exists(file)){
    if(state.io.ask){
      const a = await state.io.ask(`${file} already exists.\nOverwrite (y/n)? `);
      if(!/^(y|o)/i.test((a||'').trim())) return 1;
    }
  }
  if(state.io.ask){
    await state.io.ask('Enter passphrase (empty for no passphrase): ', {password:true});
    await state.io.ask('Enter same passphrase again: ', {password:true});
  }
  await CMDS.mkdir({out:()=>{},err:()=>{},stdin:''}, ['-p', dirnameOf(file)]);
  const rnd = () => Math.random().toString(36).slice(2);
  const pub = `ssh-${type === 'rsa' ? 'rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQ' : 'ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI'}${rnd()}${rnd()}${rnd()} ${g.opts.C || state.user + '@' + state.host}\n`;
  const w1 = writeFile(file, `-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAB${rnd()}\n-----END OPENSSH PRIVATE KEY-----\n`, false);
  if(w1.err){ ctx.err(`Saving key "${file}" failed: ${w1.err}\n`); return 1; }
  if(w1.node) w1.node.mode = 0o600;
  writeFile(file + '.pub', pub, false);
  const fp = 'SHA256:' + rnd().toUpperCase() + rnd() + '/' + rnd();
  ctx.out(
`Generating public/private ${type} key pair.
Your identification has been saved in ${file}
Your public key has been saved in ${file}.pub
The key fingerprint is:
${fp} ${g.opts.C || state.user + '@' + state.host}
The key's randomart image is:
+---[${type.toUpperCase()} 3072]----+
|      .o+*=o.    |
|     . +oB=+     |
|      o *.Bo.    |
|     . = o.=     |
|      = S o o    |
|     o o + . E   |
|      . o o .    |
|       . . .     |
|        .        |
+----[SHA256]-----+
`);
  return 0;
};

HELP.scp = "scp SOURCE DESTINATION — copie des fichiers via SSH (réseau simulé).";
CMDS.scp = async (ctx, args) => {
  const g = getopt(args, {known:'rpqvPi', value:'Pi'});
  if(g.error) return usageErr(ctx, 'scp', g.error);
  if(g.rest.length < 2) { ctx.err('usage: scp [-r] source ... cible\n'); return 1; }
  const src = g.rest[0], dst = g.rest[1];
  const remote = [src, dst].find(x => x.includes(':'));
  if(!remote){ ctx.err('scp: aucune destination distante indiquée\n'); return 1; }
  const host = remote.split(':')[0].replace(/^.*@/,'');
  if(!HOSTS[host]){ ctx.err(`ssh: Could not resolve hostname ${host}: Name or service not known\nlost connection\n`); return 1; }
  const localPath = src.includes(':') ? dst : src;
  if(!src.includes(':')){
    const r = lookup(localPath);
    if(r.err){ ctx.err(`${localPath}: No such file or directory\n`); return 1; }
  }
  if(state.io.ask) await state.io.ask(`${state.user}@${host}'s password: `, {password:true});
  const name = basenameOf(localPath);
  const size = (()=>{ const r = lookup(localPath); return r.err ? 1024 : nodeSize(r.node); })();
  if(state.io.sleep) await state.io.sleep(400);
  ctx.out(`${name.padEnd(30,' ')} 100% ${String(size).padStart(6,' ')}     1.2MB/s   00:00\n`);
  if(src.includes(':')) writeFile(dst === '.' ? basenameOf(src) : dst, `(fichier récupéré depuis ${host} — contenu simulé)\n`, false);
  return 0;
};

HELP.ufw = `ufw SOUS-COMMANDE — pare-feu simplifié (nécessite sudo).
  status [verbose|numbered]   enable / disable / reload
  allow PORT|SERVICE          deny PORT|SERVICE
  delete NUMÉRO`;
CMDS.ufw = async (ctx, args) => {
  const f = state.net.ufw;
  const sub = args[0];
  if(sub === 'status'){
    if(state.user !== 'root'){ ctx.err('ERROR: You need to be root to run this script\n'); return 1; }
    if(!f.active){ ctx.out('État : inactif\n'); return 0; }
    ctx.out('État : actif\n\n');
    const numbered = args[1] === 'numbered';
    ctx.out(`Vers                       Action      Depuis\n----                       ------      ------\n`);
    f.rules.forEach((r,i)=>{
      const to = (numbered ? `[${String(i+1).padStart(2,' ')}] ` : '') + r.to;
      ctx.out(`${to.padEnd(26,' ')} ${r.action.padEnd(11,' ')} ${r.from}\n`);
    });
    return 0;
  }
  if(state.user !== 'root'){ ctx.err('ERROR: You need to be root to run this script\n'); return 1; }
  if(sub === 'enable'){ f.active = true; state.services.ufw.active = true; ctx.out('Le pare-feu est actif et lancé au démarrage du système\n'); return 0; }
  if(sub === 'disable'){ f.active = false; state.services.ufw.active = false; ctx.out('Le pare-feu a été arrêté et désactivé au démarrage du système\n'); return 0; }
  if(sub === 'reload'){ ctx.out('Pare-feu rechargé\n'); return 0; }
  if(sub === 'allow' || sub === 'deny'){
    const spec = args[1];
    if(!spec){ ctx.err('ERROR: Wrong number of arguments\n'); return 1; }
    const ports = {ssh:'22/tcp', http:'80/tcp', https:'443/tcp'};
    const to = ports[spec] || (/^\d+$/.test(spec) ? spec : spec);
    f.rules.push({n:f.rules.length+1, to, action:sub === 'allow' ? 'ALLOW' : 'DENY', from:'Anywhere'});
    ctx.out('Règle ajoutée\nRègle ajoutée (v6)\n');
    return 0;
  }
  if(sub === 'delete'){
    const n = parseInt(args[1],10);
    if(isNaN(n) || !f.rules[n-1]){ ctx.err('ERROR: Could not delete non-existent rule\n'); return 1; }
    const r = f.rules.splice(n-1,1)[0];
    ctx.out(`Suppression :\n ${r.action.toLowerCase()} ${r.to}\nProcéder à l'opération (o|n) ? o\nRègle supprimée\n`);
    return 0;
  }
  ctx.err(`ERROR: Invalid syntax\n`);
  return 1;
};

   Partie 9 : git et docker
   ===================================================================== */
function findRepo(){
  let p = state.cwd;
  for(;;){
    if(isDir(p + (p === '/' ? '' : '') + '/.git')) return p === '' ? '/' : p;
    if(p === '/') return null;
    p = dirnameOf(p);
  }
}
function repoState(root){
  if(!state.gitRepos[root]) state.gitRepos[root] = {branch:'main', commits:[], staged:{}, tracked:{}, remote:null, cfg:{}};
  return state.gitRepos[root];
}
function repoFiles(root){
  const out = [];
  const walk = (p) => {
    const r = lookup(p);
    if(r.err || r.node.type !== 'dir') return;
    for(const k of Object.keys(r.node.children).sort()){
      if(k === '.git') continue;
      const child = r.node.children[k];
      const full = (p === '/' ? '' : p) + '/' + k;
      if(child.type === 'dir') walk(full);
      else out.push(full.slice(root.length + (root === '/' ? 0 : 1)));
    }
  };
  walk(root);
  return out;
}
HELP.git = `git SOUS-COMMANDE — gestionnaire de versions.
  init                  crée un dépôt          status        état du dépôt
  add FICHIER|.         indexe des fichiers    commit -m MSG enregistre
  log [--oneline]       historique             diff          modifications
  branch [NOM]          liste ou crée          checkout [-b] change de branche
  remote add NOM URL    ajoute un dépôt distant   push / pull  (simulés)
  clone URL             clone un dépôt         config user.name "..."
  rm / mv / reset / show`;
CMDS.git = async (ctx, args) => {
  const sub = args[0];
  if(!sub){
    ctx.out('usage: git [--version] [--help] <commande> [<args>]\n\nCommandes courantes : init, add, commit, status, log, diff, branch, checkout, remote, push, clone\n');
    return 1;
  }
  if(sub === '--version' || sub === 'version'){ ctx.out('git version 2.39.2\n'); return 0; }
  if(sub === 'clone'){
    const url = args[1];
    if(!url){ ctx.err('fatal: Vous devez indiquer un dépôt à cloner.\n'); return 129; }
    const name = args[2] || basenameOf(url).replace(/\.git$/,'');
    if(exists(name)){ ctx.err(`fatal: le chemin de destination '${name}' existe déjà et n'est pas un répertoire vide.\n`); return 128; }
    ctx.out(`Clonage dans '${name}'...\n`);
    if(state.io.sleep) await state.io.sleep(400);
    await CMDS.mkdir({out:()=>{},err:()=>{},stdin:''}, ['-p', name + '/.git']);
    writeFile(name + '/README.md', `# ${name}\n\nDépôt cloné depuis ${url} (contenu simulé).\n`, false);
    const root = absPath(name);
    const rs = repoState(root);
    rs.remote = url;
    rs.tracked = {'README.md': `# ${name}\n\nDépôt cloné depuis ${url} (contenu simulé).\n`};
    rs.commits = [{hash:'a1b2c3d', msg:'Commit initial', author:'Auteur <auteur@example.com>', date:now(), files:['README.md']}];
    ctx.out(`remote: Enumerating objects: 3, done.\nremote: Total 3 (delta 0), reused 0 (delta 0)\nRéception d'objets: 100% (3/3), fait.\n`);
    return 0;
  }
  if(sub === 'init'){
    const dir = args[1] ? absPath(args[1]) : state.cwd;
    if(args[1]) await CMDS.mkdir({out:()=>{},err:()=>{},stdin:''}, ['-p', dir]);
    if(isDir(dir + '/.git')){ ctx.out(`Dépôt Git existant réinitialisé dans ${dir}/.git/\n`); return 0; }
    await CMDS.mkdir({out:()=>{},err:()=>{},stdin:''}, ['-p', dir + '/.git']);
    writeFile(dir + '/.git/HEAD', 'ref: refs/heads/main\n', false);
    repoState(dir);
    ctx.out(`Dépôt Git vide initialisé dans ${dir}/.git/\n`);
    return 0;
  }
  const root = findRepo();
  if(!root){ ctx.err('fatal: ce n\'est pas un dépôt git (ni aucun des répertoires parents) : .git\n'); return 128; }
  const rs = repoState(root);
  const rel = (p) => absPath(p).slice(root.length + (root === '/' ? 0 : 1));
  const contentOf = (relPath) => { const r = readFile(root + '/' + relPath); return r.err ? null : r.content; };

  switch(sub){
    case 'config': {
      if(args[1] === '--list'){ for(const k of Object.keys(rs.cfg)) ctx.out(`${k}=${rs.cfg[k]}\n`); return 0; }
      const key = args.filter(a=>!a.startsWith('-'))[1];
      const val = args.filter(a=>!a.startsWith('-'))[2];
      if(val === undefined){ ctx.out((rs.cfg[key] || '') + '\n'); return rs.cfg[key] ? 0 : 1; }
      rs.cfg[key] = val;
      return 0;
    }
    case 'status': {
      const short = args.includes('-s') || args.includes('--short');
      const all = repoFiles(root);
      const staged = Object.keys(rs.staged);
      const modified = all.filter(f => rs.tracked[f] !== undefined && contentOf(f) !== rs.tracked[f] && rs.staged[f] === undefined);
      const untracked = all.filter(f => rs.tracked[f] === undefined && rs.staged[f] === undefined);
      const deleted = Object.keys(rs.tracked).filter(f => !all.includes(f));
      if(short){
        for(const f of staged) ctx.out(`A  ${f}\n`);
        for(const f of modified) ctx.out(` M ${f}\n`);
        for(const f of untracked) ctx.out(`?? ${f}\n`);
        return 0;
      }
      ctx.out(`Sur la branche ${rs.branch}\n`);
      if(!rs.commits.length) ctx.out('\nAucun commit\n');
      if(staged.length){
        ctx.out('\nModifications qui seront validées :\n  (utilisez "git restore --staged <fichier>..." pour désindexer)\n');
        for(const f of staged) ctx.out(`\tnouveau fichier : ${f}\n`);
      }
      if(modified.length || deleted.length){
        ctx.out('\nModifications qui ne seront pas validées :\n  (utilisez "git add <fichier>..." pour mettre à jour ce qui sera validé)\n');
        for(const f of modified) ctx.out(`\tmodifié :         ${f}\n`);
        for(const f of deleted) ctx.out(`\tsupprimé :        ${f}\n`);
      }
      if(untracked.length){
        ctx.out('\nFichiers non suivis :\n  (utilisez "git add <fichier>..." pour inclure dans ce qui sera validé)\n');
        for(const f of untracked) ctx.out(`\t${f}\n`);
      }
      if(!staged.length && !modified.length && !untracked.length && !deleted.length){
        ctx.out(rs.commits.length ? '\nrien à valider, la copie de travail est propre\n' : '\nrien à valider (créez/copiez des fichiers et utilisez "git add" pour les suivre)\n');
      } else if(!staged.length){
        ctx.out(untracked.length ? '\naucune modification ajoutée à la validation mais des fichiers non suivis sont présents\n' : '\naucune modification ajoutée à la validation\n');
      }
      return 0;
    }
    case 'add': {
      const targets = args.slice(1).filter(a=>!a.startsWith('-'));
      if(!targets.length){ ctx.err('Rien de spécifié, rien n\'a été ajouté.\n'); return 1; }
      const all = repoFiles(root);
      for(const t of targets){
        if(t === '.' || t === '-A' || t === '*'){
          for(const f of all) rs.staged[f] = contentOf(f);
          continue;
        }
        const r = rel(t);
        const rr = lookup(t);
        if(rr.err){ ctx.err(`fatal: le chemin '${t}' ne correspond à aucun fichier\n`); return 128; }
        if(rr.node.type === 'dir'){ for(const f of all) if(f.startsWith(r + '/')) rs.staged[f] = contentOf(f); }
        else rs.staged[r] = contentOf(r);
      }
      return 0;
    }
    case 'rm': {
      const t = args.filter(a=>!a.startsWith('-'))[1];
      if(!t) return 1;
      const r = rel(t);
      delete rs.tracked[r]; delete rs.staged[r];
      const look = lookup(t);
      if(!look.err && look.parent) delete look.parent.children[look.name];
      ctx.out(`rm '${r}'\n`);
      return 0;
    }
    case 'commit': {
      const mi = args.findIndex(a => a === '-m' || a === '--message');
      let msg = mi >= 0 ? args[mi+1] : null;
      if(args.includes('-am') || (args.includes('-a') && mi >= 0)){
        for(const f of repoFiles(root)) if(rs.tracked[f] !== undefined) rs.staged[f] = contentOf(f);
      }
      if(!Object.keys(rs.staged).length){
        ctx.out(`Sur la branche ${rs.branch}\nrien à valider, la copie de travail est propre\n`);
        return 1;
      }
      if(!msg){
        if(state.io.editor){
          const tpl = '\n# Veuillez saisir le message de validation.\n# Les lignes commençant par « # » seront ignorées.\n';
          const res = await state.io.editor('COMMIT_EDITMSG', tpl, 'nano');
          if(res != null) msg = lines(res).filter(l=>!l.trim().startsWith('#')).join('\n').trim();
        }
        if(!msg){ ctx.err('Abandon de la validation dû à un message de validation vide.\n'); return 1; }
      }
      const files = Object.keys(rs.staged);
      for(const f of files) rs.tracked[f] = rs.staged[f];
      rs.staged = {};
      const hash = Math.random().toString(16).slice(2,9);
      rs.commits.unshift({hash, msg, author:`${rs.cfg['user.name'] || state.user} <${rs.cfg['user.email'] || state.user + '@' + state.host}>`, date:now(), files});
      ctx.out(`[${rs.branch} ${hash}] ${msg}\n ${files.length} fichier${files.length>1?'s':''} modifié${files.length>1?'s':''}\n`);
      for(const f of files) ctx.out(` create mode 100644 ${f}\n`);
      return 0;
    }
    case 'log': {
      if(!rs.commits.length){ ctx.err(`fatal: votre branche actuelle '${rs.branch}' n'a encore aucun commit\n`); return 128; }
      const oneline = args.includes('--oneline');
      const n = args.includes('-n') ? parseInt(args[args.indexOf('-n')+1],10) : rs.commits.length;
      for(const c of rs.commits.slice(0, n)){
        if(oneline){ ctx.out(`${c.hash} ${c.msg}\n`); continue; }
        ctx.out(`commit ${c.hash}${c === rs.commits[0] ? ' (HEAD -> ' + rs.branch + ')' : ''}\nAuteur : ${c.author}\nDate :  ${c.date.toString().slice(0,24)}\n\n    ${c.msg}\n\n`);
      }
      return 0;
    }
    case 'show': {
      const c = rs.commits[0];
      if(!c){ ctx.err('fatal: aucun commit\n'); return 128; }
      ctx.out(`commit ${c.hash}\nAuteur : ${c.author}\nDate :  ${c.date.toString().slice(0,24)}\n\n    ${c.msg}\n\n`);
      for(const f of c.files) ctx.out(`diff --git a/${f} b/${f}\n--- a/${f}\n+++ b/${f}\n`);
      return 0;
    }
    case 'diff': {
      const all = repoFiles(root);
      let any = false;
      for(const f of all){
        if(rs.tracked[f] === undefined) continue;
        const cur = contentOf(f);
        if(cur === rs.tracked[f]) continue;
        any = true;
        ctx.out(`diff --git a/${f} b/${f}\nindex 1a2b3c4..5d6e7f8 100644\n--- a/${f}\n+++ b/${f}\n`);
        const oldL = lines(rs.tracked[f]), newL = lines(cur);
        ctx.out(`@@ -1,${oldL.length} +1,${newL.length} @@\n`);
        for(const l of oldL) if(!newL.includes(l)) ctx.out(`-${l}\n`);
        for(const l of newL) if(!oldL.includes(l)) ctx.out(`+${l}\n`);
      }
      if(!any) return 0;
      return 0;
    }
    case 'branch': {
      const name = args.filter(a=>!a.startsWith('-'))[1];
      if(!name){ ctx.out(`* ${rs.branch}\n`); return 0; }
      if(args.includes('-d') || args.includes('-D')){ ctx.out(`Branche ${name} supprimée\n`); return 0; }
      ctx.out('');
      return 0;
    }
    case 'checkout': case 'switch': {
      const isNew = args.includes('-b') || args.includes('-c');
      const name = args.filter(a=>!a.startsWith('-'))[1];
      if(!name){ ctx.err('fatal: nom de branche manquant\n'); return 1; }
      rs.branch = name;
      ctx.out(isNew ? `Basculement sur la nouvelle branche '${name}'\n` : `Basculement sur la branche '${name}'\n`);
      return 0;
    }
    case 'remote': {
      if(args[1] === 'add'){ rs.remote = args[3]; ctx.out(''); return 0; }
      if(args[1] === '-v' || !args[1]){
        if(!rs.remote) return 0;
        ctx.out(`origin\t${rs.remote} (fetch)\norigin\t${rs.remote} (push)\n`);
        return 0;
      }
      return 0;
    }
    case 'push': {
      if(!rs.remote){ ctx.err(`fatal: Aucune destination de push configurée.\nIndiquez une URL depuis la ligne de commande ou configurez un dépôt distant avec\n\n    git remote add <nom> <url>\n`); return 128; }
      if(state.io.sleep) await state.io.sleep(400);
      ctx.out(`Énumération des objets: ${rs.commits.length*3}, fait.\nDécompte des objets: 100% (${rs.commits.length*3}/${rs.commits.length*3}), fait.\nÉcriture des objets: 100% (${rs.commits.length*3}/${rs.commits.length*3}), 1.24 Kio | 1.24 Mio/s, fait.\nTo ${rs.remote}\n * [new branch]      ${rs.branch} -> ${rs.branch}\n`);
      return 0;
    }
    case 'pull': case 'fetch': {
      if(!rs.remote){ ctx.err('fatal: Aucun dépôt distant configuré.\n'); return 1; }
      ctx.out('Déjà à jour.\n');
      return 0;
    }
    case 'reset': {
      if(args.includes('--hard')){
        for(const f of Object.keys(rs.tracked)) writeFile(root + '/' + f, rs.tracked[f], false);
        rs.staged = {};
        ctx.out(`HEAD est maintenant à ${rs.commits[0] ? rs.commits[0].hash : '0000000'}\n`);
      } else rs.staged = {};
      return 0;
    }
    case 'restore': {
      if(args.includes('--staged')){ for(const f of args.filter(a=>!a.startsWith('-')).slice(1)) delete rs.staged[rel(f)]; return 0; }
      for(const f of args.filter(a=>!a.startsWith('-')).slice(1)){
        const r = rel(f);
        if(rs.tracked[r] !== undefined) writeFile(root + '/' + r, rs.tracked[r], false);
      }
      return 0;
    }
    default:
      ctx.err(`git: '${sub}' n'est pas une commande git. Voir 'git --help'.\n`);
      return 1;
  }
};

/* ---------------- docker ---------------- */
function dockerReady(ctx){
  if(!state.docker.installed){
    ctx.err('docker : commande introuvable\nInstallez-le avec : sudo apt install docker.io\n');
    return false;
  }
  if(!state.services.docker.active){
    ctx.err(`Cannot connect to the Docker daemon at unix:///var/run/docker.sock. Is the docker daemon running?\nDémarrez-le avec : sudo systemctl start docker\n`);
    return false;
  }
  return true;
}
HELP.docker = `docker SOUS-COMMANDE — gestion de conteneurs.
  ps [-a]        liste les conteneurs      images        liste les images
  pull IMAGE     télécharge une image      run [-d] [-p] IMAGE  lance un conteneur
  stop / start / rm NOM                    rmi IMAGE     supprime une image
  logs NOM       journaux d'un conteneur   exec -it NOM CMD
  compose up|down|ps                       version / info
Nécessite : sudo apt install docker.io puis sudo systemctl start docker`;
CMDS.docker = async (ctx, args) => {
  const d = state.docker;
  const sub = args[0];
  if(sub === 'version' || sub === '--version'){
    if(!d.installed){ ctx.err('docker : commande introuvable\nInstallez-le avec : sudo apt install docker.io\n'); return 127; }
    ctx.out('Docker version 20.10.24+dfsg1, build 297e128\n');
    return 0;
  }
  if(!dockerReady(ctx)) return 127;
  const rnd = () => Math.random().toString(16).slice(2,14);
  switch(sub){
    case 'info':
      ctx.out(`Client:\n Version:    20.10.24\n\nServer:\n Containers: ${d.containers.length}\n  Running: ${d.containers.filter(c=>c.status==='running').length}\n  Stopped: ${d.containers.filter(c=>c.status!=='running').length}\n Images: ${d.images.length}\n Server Version: 20.10.24\n Storage Driver: overlay2\n`);
      return 0;
    case 'images':
      ctx.out('REPOSITORY   TAG        IMAGE ID       CREATED         SIZE\n');
      for(const i of d.images) ctx.out(`${i.repo.padEnd(12,' ')} ${i.tag.padEnd(10,' ')} ${i.id.slice(0,12)}   ${i.created.padEnd(15,' ')} ${i.size}\n`);
      return 0;
    case 'pull': {
      const spec = args[1];
      if(!spec){ ctx.err('"docker pull" requires exactly 1 argument.\n'); return 1; }
      const [repo, tag = 'latest'] = spec.split(':');
      if(d.images.some(i=>i.repo===repo && i.tag===tag)){ ctx.out(`${tag}: Pulling from library/${repo}\nStatus: Image is up to date for ${repo}:${tag}\n`); return 0; }
      ctx.out(`${tag}: Pulling from library/${repo}\n`);
      for(const l of ['a2abf6c4d29d: Pull complete','c2a5b0d3e912: Pull complete','Digest: sha256:' + rnd() + rnd()]){
        if(state.io.sleep) await state.io.sleep(200);
        ctx.out(l + '\n');
      }
      d.images.push({repo, tag, id:rnd(), created:'À l\'instant', size:'112MB'});
      ctx.out(`Status: Downloaded newer image for ${repo}:${tag}\ndocker.io/library/${repo}:${tag}\n`);
      return 0;
    }
    case 'run': {
      const raw = args.slice(1);
      let forcedName = null;
      for(let k=0;k<raw.length;k++){
        if(raw[k] === '--name'){ forcedName = raw[k+1]; raw.splice(k,2); k--; }
        else if(raw[k].startsWith('--name=')){ forcedName = raw[k].slice(7); raw.splice(k,1); k--; }
      }
      const g = getopt(raw, {known:'dpitnverm', value:'pnve'});
      const spec = g.rest[0];
      if(!spec){ ctx.err('"docker run" requires at least 1 argument.\n'); return 1; }
      const [repo, tag = 'latest'] = spec.split(':');
      if(!d.images.some(i=>i.repo===repo && i.tag===tag)){
        ctx.out(`Unable to find image '${repo}:${tag}' locally\n`);
        await CMDS.docker(ctx, ['pull', spec]);
      }
      const names = ['brave_tesla','vigilant_curie','eager_hopper','nifty_bardeen','zen_lovelace'];
      const name = forcedName || g.opts.n || names[Math.floor(Math.random()*names.length)];
      const id = rnd();
      const cmd = g.rest.slice(1).join(' ') || (repo === 'nginx' ? 'nginx -g daemon off;' : 'bash');
      const detached = g.opts.d;
      const c = {id, name, image:`${repo}:${tag}`, cmd, status: detached ? 'running' : 'exited', ports:g.opts.p ? `0.0.0.0:${g.opts.p.split(':')[0]}->${g.opts.p.split(':')[1] || '80'}/tcp` : '', created:'À l\'instant'};
      d.containers.push(c);
      if(detached){ ctx.out(id + '\n'); return 0; }
      ctx.out(`(conteneur ${name} exécuté puis arrêté — utilisez -d pour le laisser tourner)\n`);
      return 0;
    }
    case 'ps': {
      const all = args.includes('-a') || args.includes('--all');
      const list = all ? d.containers : d.containers.filter(c=>c.status === 'running');
      ctx.out('CONTAINER ID   IMAGE          COMMAND                  CREATED         STATUS         PORTS                  NAMES\n');
      for(const c of list){
        ctx.out(`${c.id.slice(0,12)}   ${c.image.padEnd(14,' ')} ${('"'+c.cmd+'"').slice(0,24).padEnd(24,' ')} ${c.created.padEnd(15,' ')} ${(c.status === 'running' ? 'Up 2 minutes' : 'Exited (0) 1 min').padEnd(14,' ')} ${c.ports.padEnd(22,' ')} ${c.name}\n`);
      }
      return 0;
    }
    case 'stop': case 'start': case 'restart': {
      const nm = args[1];
      const c = d.containers.find(x=>x.name === nm || x.id.startsWith(nm || '__'));
      if(!c){ ctx.err(`Error response from daemon: No such container: ${nm}\n`); return 1; }
      c.status = sub === 'stop' ? 'exited' : 'running';
      ctx.out(nm + '\n');
      return 0;
    }
    case 'rm': {
      const nm = args.filter(a=>!a.startsWith('-'))[1];
      const idx = d.containers.findIndex(x=>x.name === nm || x.id.startsWith(nm || '__'));
      if(idx < 0){ ctx.err(`Error response from daemon: No such container: ${nm}\n`); return 1; }
      if(d.containers[idx].status === 'running' && !args.includes('-f')){
        ctx.err(`Error response from daemon: You cannot remove a running container. Stop the container before attempting removal or force remove\n`);
        return 1;
      }
      d.containers.splice(idx,1);
      ctx.out(nm + '\n');
      return 0;
    }
    case 'rmi': {
      const spec = args[1];
      const [repo, tag = 'latest'] = (spec || '').split(':');
      const idx = d.images.findIndex(i=>i.repo === repo && i.tag === tag);
      if(idx < 0){ ctx.err(`Error response from daemon: No such image: ${spec}\n`); return 1; }
      d.images.splice(idx,1);
      ctx.out(`Untagged: ${spec}\n`);
      return 0;
    }
    case 'logs': {
      const c = d.containers.find(x=>x.name === args[1] || x.id.startsWith(args[1] || '__'));
      if(!c){ ctx.err(`Error response from daemon: No such container: ${args[1]}\n`); return 1; }
      ctx.out(`/docker-entrypoint.sh: Configuration complete; ready for start up\n${now().toUTCString()} [notice] 1#1: start worker processes\n`);
      return 0;
    }
    case 'exec': {
      const c = d.containers.find(x=>!x.startsWith || true);
      ctx.out('(exécution dans le conteneur simulée — la session interactive n\'est pas disponible)\n');
      return 0;
    }
    case 'compose': {
      const act = args[1];
      if(!exists('docker-compose.yml') && !exists('compose.yml')){
        ctx.err('no configuration file provided: not found\n');
        return 1;
      }
      if(act === 'up'){
        ctx.out('[+] Running 2/2\n ✔ Network app_default   Created\n ✔ Container app-web-1   Started\n');
        d.containers.push({id:rnd(), name:'app-web-1', image:'nginx:alpine', cmd:'nginx -g daemon off;', status:'running', ports:'0.0.0.0:8080->80/tcp', created:'À l\'instant'});
        return 0;
      }
      if(act === 'down'){
        ctx.out('[+] Running 2/2\n ✔ Container app-web-1   Removed\n ✔ Network app_default   Removed\n');
        d.containers = d.containers.filter(c=>c.name !== 'app-web-1');
        return 0;
      }
      if(act === 'ps') return CMDS.docker(ctx, ['ps']);
      ctx.err(`unknown docker command: compose ${act}\n`);
      return 1;
    }
    default:
      ctx.err(`docker: '${sub}' is not a docker command.\nSee 'docker --help'\n`);
      return 1;
  }
};
CMDS['docker-compose'] = async (ctx, args) => CMDS.docker(ctx, ['compose'].concat(args));

HELP.export = "export NOM=VALEUR — définit une variable d'environnement transmise aux commandes.\n  export NOM   exporte une variable shell existante\n  export -p    liste les variables exportées";
CMDS.export = async (ctx, args) => {
  if(!args.length || args[0] === '-p'){
    for(const k of Object.keys(state.env).sort()) ctx.out(`declare -x ${k}="${state.env[k]}"\n`);
    return 0;
  }
  for(const a of args){
    const eq = a.indexOf('=');
    if(eq < 0){
      const v = state.vars[a];
      state.env[a] = v === undefined ? (state.env[a] || '') : v;
      delete state.vars[a];
      continue;
    }
    const name = a.slice(0, eq);
    if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)){ ctx.err(`bash: export: « ${a} » : identifiant non valable\n`); return 1; }
    state.env[name] = a.slice(eq+1);
    delete state.vars[name];
    if(name === 'PWD') state.cwd = state.env.PWD;
  }
  return 0;
};
HELP.unset = "unset NOM... — supprime une variable ou une fonction.";
CMDS.unset = async (ctx, args) => {
  for(const a of args){ delete state.env[a]; delete state.vars[a]; delete state.funcs[a]; }
  return 0;
};
HELP.env = "env — affiche les variables d'environnement.\n  env NOM=VAL COMMANDE  exécute une commande avec un environnement modifié";
CMDS.env = async (ctx, args) => {
  const assigns = [];
  let i = 0;
  while(i < args.length && /^[A-Za-z_][A-Za-z0-9_]*=/.test(args[i])) assigns.push(args[i++]);
  if(i < args.length){
    const saved = {};
    for(const a of assigns){ const eq = a.indexOf('='); saved[a.slice(0,eq)] = state.env[a.slice(0,eq)]; state.env[a.slice(0,eq)] = a.slice(eq+1); }
    const code = await dispatch(args.slice(i), ctx);
    for(const k of Object.keys(saved)){ if(saved[k] === undefined) delete state.env[k]; else state.env[k] = saved[k]; }
    return code;
  }
  for(const k of Object.keys(state.env)) ctx.out(`${k}=${state.env[k]}\n`);
  return 0;
};
CMDS.printenv = async (ctx, args) => {
  if(args.length){ const v = state.env[args[0]]; if(v === undefined) return 1; ctx.out(v + '\n'); return 0; }
  return CMDS.env(ctx, []);
};
HELP.printenv = "printenv [NOM] — affiche une ou toutes les variables d'environnement.";
HELP.set = "set — affiche toutes les variables du shell.";
CMDS.set = async (ctx, args) => {
  if(args.length) return 0;
  const all = Object.assign({}, state.env, state.vars);
  for(const k of Object.keys(all).sort()) ctx.out(`${k}=${all[k]}\n`);
  for(const k of Object.keys(state.funcs)) ctx.out(`${k} ()\n{\n    ...\n}\n`);
  return 0;
};
HELP.declare = "declare [-p] [-x] [NOM=VALEUR] — déclare une variable ou affiche sa déclaration.\n  -p  affiche la déclaration d'une variable   -x  exporte   -f  fonctions";
CMDS.declare = async (ctx, args) => {
  const rest = args.filter(a=>!a.startsWith('-'));
  if(args.includes('-p')){
    const names = rest.length ? rest : Object.keys(Object.assign({}, state.vars, state.env)).sort();
    let code = 0;
    for(const n of names){
      if(Object.prototype.hasOwnProperty.call(state.env, n)) ctx.out(`declare -x ${n}="${state.env[n]}"\n`);
      else if(Object.prototype.hasOwnProperty.call(state.vars, n)) ctx.out(`declare -- ${n}="${state.vars[n]}"\n`);
      else if(state.funcs[n]) ctx.out(`${n} ()\n{\n    ...\n}\n`);
      else { ctx.err(`bash: declare: ${n} : non trouvé\n`); code = 1; }
    }
    return code;
  }
  if(args.includes('-x') && rest.length) return CMDS.export(ctx, rest);
  if(args.includes('-f')){ for(const k of Object.keys(state.funcs)) ctx.out(`${k} ()\n{\n    ...\n}\n`); return 0; }
  if(!rest.length) return CMDS.set(ctx, []);
  for(const a of rest){ const eq = a.indexOf('='); if(eq > 0) setVar(a.slice(0,eq), a.slice(eq+1)); }
  return 0;
};
HELP.alias = "alias [NOM='COMMANDE'] — crée ou liste des raccourcis de commandes.";
CMDS.alias = async (ctx, args) => {
  if(!args.length){
    for(const k of Object.keys(state.aliases).sort()) ctx.out(`alias ${k}='${state.aliases[k]}'\n`);
    return 0;
  }
  for(const a of args){
    const eq = a.indexOf('=');
    if(eq < 0){
      if(state.aliases[a]) ctx.out(`alias ${a}='${state.aliases[a]}'\n`);
      else { ctx.err(`bash: alias: ${a} : non trouvé\n`); return 1; }
      continue;
    }
    state.aliases[a.slice(0,eq)] = a.slice(eq+1).replace(/^['"]|['"]$/g,'');
  }
  return 0;
};
HELP.unalias = "unalias NOM — supprime un alias.";
CMDS.unalias = async (ctx, args) => {
  if(args[0] === '-a'){ state.aliases = {}; return 0; }
  for(const a of args){ if(!state.aliases[a]){ ctx.err(`bash: unalias: ${a} : non trouvé\n`); return 1; } delete state.aliases[a]; }
  return 0;
};
HELP.history = "history [N] — affiche l'historique des commandes.\n  -c  efface l'historique";
CMDS.history = async (ctx, args) => {
  if(args[0] === '-c'){ state.history = []; return 0; }
  let list = state.history.map((h,i)=>({n:i+1, h}));

HELP.test = `test EXPRESSION  (ou [ EXPRESSION ])
Évalue une condition ; renvoie 0 si vraie, 1 sinon.
  Fichiers : -e existe, -f fichier, -d dossier, -r lisible, -w modifiable,
             -x exécutable, -s non vide, -L lien
  Chaînes  : -z vide, -n non vide, = égales, != différentes
  Nombres  : -eq -ne -lt -le -gt -ge
  Logique  : ! négation, -a et, -o ou`;
function matchPattern(str, pat){
  try{ return globToRegex(pat, new Array(pat.length).fill(false)).test(str); }
  catch(e){ return str === pat; }
}
function testEval(args, ctx, patterns){
  const one = (a) => {
    const r = lookup(a, {noFollowLast:true});
    return r;
  };
  const evalSimple = (t) => {
    if(t.length === 0) return false;
    if(t.length === 1) return t[0] !== '';
    if(t.length === 2){
      const [op, a] = t;
      const r = lookup(a);
      const rl = lookup(a, {noFollowLast:true});
      switch(op){
        case '-e': return !r.err;
        case '-f': return !r.err && r.node.type === 'file';
        case '-d': return !r.err && r.node.type === 'dir';
        case '-L': case '-h': return !rl.err && rl.node.type === 'link';
        case '-s': return !r.err && nodeSize(r.node) > 0;
        case '-r': return !r.err && canRead(r.node);
        case '-w': return !r.err && canWrite(r.node);
        case '-x': return !r.err && canExec(r.node);
        case '-z': return a === '';
        case '-n': return a !== '';
        case '!': return !(a !== '');
        default: return a !== '';
      }
    }
    if(t.length === 3){
      const [a, op, b] = t;
      switch(op){
        case '=': case '==': return patterns ? matchPattern(a, b) : a === b;
        case '!=': return patterns ? !matchPattern(a, b) : a !== b;
        case '<': return a < b;
        case '>': return a > b;
        case '=~': try{ return new RegExp(b).test(a); }catch(e){ return false; }
        case '-eq': return parseInt(a,10) === parseInt(b,10);
        case '-ne': return parseInt(a,10) !== parseInt(b,10);
        case '-lt': return parseInt(a,10) < parseInt(b,10);
        case '-le': return parseInt(a,10) <= parseInt(b,10);
        case '-gt': return parseInt(a,10) > parseInt(b,10);
        case '-ge': return parseInt(a,10) >= parseInt(b,10);
        case '-nt': { const x = lookup(a), y = lookup(b); return !x.err && (!y.err ? x.node.mtime > y.node.mtime : true); }
        case '-ot': { const x = lookup(a), y = lookup(b); return !y.err && (!x.err ? x.node.mtime < y.node.mtime : true); }
        default:
          if(t[0] === '!') return !evalSimple(t.slice(1));
          return false;
      }
    }
    return false;
  };
  const evalList = (t) => {
    if(t[0] === '!') return !evalList(t.slice(1));
    const oi = t.findIndex(x => x === '-o');
    if(oi > 0) return evalList(t.slice(0, oi)) || evalList(t.slice(oi+1));
    const ai = t.findIndex(x => x === '-a');
    if(ai > 0) return evalList(t.slice(0, ai)) && evalList(t.slice(ai+1));
    if(t[0] === '(' && t[t.length-1] === ')') return evalList(t.slice(1,-1));
    if(t.length > 3 && t[0] === '!') return !evalSimple(t.slice(1));
    return evalSimple(t);
  };
  return evalList(args);
}

HELP.tree = "tree [-a] [-L N] [CHEMIN] — affiche l'arborescence sous forme graphique.";
CMDS.tree = async (ctx, args) => {
  const g = getopt(args, {known:'aLdf', value:'L'});
  if(g.error) return usageErr(ctx, 'tree', g.error);
  const maxd = g.opts.L ? parseInt(g.opts.L,10) : Infinity;
  const rootPath = g.rest[0] || '.';
  const r = lookup(rootPath);
  if(r.err){ ctx.err(`${rootPath} [error opening dir]\n\n0 directories, 0 files\n`); return 1; }
  let nd = 0, nf = 0;
  ctx.out(rootPath + '\n');
  const walk = (node, prefix, depth) => {
    if(depth > maxd) return;
    let keys = Object.keys(node.children).sort();
    if(!g.opts.a) keys = keys.filter(k=>!k.startsWith('.'));
    keys.forEach((k,i)=>{
      const last = i === keys.length-1;
      const child = node.children[k];
      ctx.out(prefix + (last ? '└── ' : '├── ') + k + (child.type === 'dir' ? '' : '') + '\n');
      if(child.type === 'dir'){ nd++; walk(child, prefix + (last ? '    ' : '│   '), depth+1); }
      else nf++;
    });
  };
  if(r.node.type === 'dir') walk(r.node, '', 1);
  ctx.out(`\n${nd} répertoire${nd>1?'s':''}, ${nf} fichier${nf>1?'s':''}\n`);
  return 0;
};

HELP.diff = "diff FICHIER1 FICHIER2 — compare deux fichiers ligne à ligne.\n  -u  format unifié";
CMDS.diff = async (ctx, args) => {
  const g = getopt(args, {known:'uiwqrbN', longs:['unified','brief','recursive','help']});
  if(g.error) return usageErr(ctx, 'diff', g.error);
  if(g.rest.length < 2) return usageErr(ctx, 'diff', 'opérande manquant');
  const a = readFile(g.rest[0]), b = readFile(g.rest[1]);
  if(a.err){ ctx.err(`diff: ${g.rest[0]}: Aucun fichier ou dossier de ce type\n`); return 2; }
  if(b.err){ ctx.err(`diff: ${g.rest[1]}: Aucun fichier ou dossier de ce type\n`); return 2; }
  if(a.content === b.content) return 0;
  if(g.opts.q){ ctx.out(`Les fichiers ${g.rest[0]} et ${g.rest[1]} sont différents\n`); return 1; }
  const A = lines(a.content), B = lines(b.content);
  if(g.opts.u){
    ctx.out(`--- ${g.rest[0]}\n+++ ${g.rest[1]}\n@@ -1,${A.length} +1,${B.length} @@\n`);
    for(const l of A) if(!B.includes(l)) ctx.out('-' + l + '\n');
    for(const l of B) if(!A.includes(l)) ctx.out('+' + l + '\n');
    return 1;
  }
  const maxn = Math.max(A.length, B.length);
  for(let i=0;i<maxn;i++){
    if(A[i] === B[i]) continue;
    if(A[i] !== undefined && B[i] !== undefined) ctx.out(`${i+1}c${i+1}\n< ${A[i]}\n---\n> ${B[i]}\n`);
    else if(A[i] !== undefined) ctx.out(`${i+1}d${i}\n< ${A[i]}\n`);
    else ctx.out(`${i}a${i+1}\n> ${B[i]}\n`);
  }
  return 1;
};

CMDS.clear = async (ctx) => { if(state.io.clear) state.io.clear(); return 0; };
HELP.exit = "exit [CODE] — quitte le shell.";
CMDS.exit = async (ctx, args) => {
  const code = args.length ? (parseInt(args[0],10) || 0) : state.lastExit;
  state.exited = true;
  throw Flow('exit', code);
};
CMDS.logout = CMDS.exit;
HELP.logout = HELP.exit;
CMDS.return = async (ctx, args) => {
  if(funcDepth === 0){
    ctx.err("bash: return : « return » n'est possible que depuis une fonction ou un script sourcé\n");
    return 1;
  }
  throw Flow('return', args.length ? (parseInt(args[0],10)||0) : state.lastExit);
};
HELP.return = "return [CODE] — sort d'une fonction en renvoyant un code.";
CMDS.break = async (ctx, args) => { throw Flow('break', 0, args.length ? parseInt(args[0],10) : 1); };
HELP.break = "break [N] — sort d'une boucle.";
CMDS.continue = async (ctx, args) => { throw Flow('continue', 0, args.length ? parseInt(args[0],10) : 1); };
HELP.continue = "continue [N] — passe à l'itération suivante d'une boucle.";

HELP.reset = "reset — réinitialise complètement le simulateur (fichiers, variables, paquets).";
CMDS.reset = async (ctx, args) => {
  resetAll();
  if(state.io.clear) state.io.clear();
  ctx.out('Le simulateur a été réinitialisé dans son état d\'origine.\n');
  return 0;
};

HELP.shutdown = "shutdown [now] — arrête le système (nécessite les droits root).\n  -r  redémarre au lieu d'arrêter\n  -c  annule un arrêt programmé";
CMDS.shutdown = async (ctx, args) => {
  if(state.user !== 'root'){
    ctx.err('Failed to set wall message, ignoring: Interactive authentication required.\nFailed to power off system via logind: Interactive authentication required.\nEssayez : sudo shutdown now\n');
    return 1;
  }
  const reboot = args.includes('-r');
  state.rebootRequested = reboot ? 'reboot' : 'poweroff';
  if(state.io.power) await state.io.power(reboot ? 'reboot' : 'poweroff');
  return 0;
};
CMDS.poweroff = async (ctx, args) => CMDS.shutdown(ctx, ['now']);
CMDS.halt = async (ctx, args) => CMDS.shutdown(ctx, ['now']);
CMDS.reboot = async (ctx, args) => CMDS.shutdown(ctx, ['-r','now']);
HELP.poweroff = "poweroff — arrête immédiatement le système (root).";
HELP.halt = "halt — arrête immédiatement le système (root).";
HELP.reboot = "reboot — redémarre le système et réinitialise l'environnement (root).";

/* =====================================================================
   Point d'entrée : exécution d'une ligne saisie
   ===================================================================== */
async function runLine(src, io){
  if(io) Object.assign(state.io, io);
  if(src.trim() !== '' && state.history[state.history.length-1] !== src) state.history.push(src);
  let ast;
  try{
    ast = parse(src);
  }catch(e){
    if(e.incomplete) return {incomplete:true, want:e.want};
    state.io.write && state.io.write('bash : ' + e.message + '\n', 'err');
    state.lastExit = 2;
    return {code:2};
  }
  const ctx = {
    stdin: '',
    depth: 0,
    out: (t) => state.io.write && state.io.write(t, 'out'),
    err: (t) => state.io.write && state.io.write(t, 'err')
  };
  try{
    const code = await execNode(ast, ctx);
    state.lastExit = code;
    return {code};
  }catch(e){
    if(e && e.flow === 'exit'){
      state.exited = false;
      state.lastExit = e.code;
      return {code:e.code, exit:true};
    }
    if(e && e.flow){ state.lastExit = 0; return {code:0}; }
    state.io.write && state.io.write('bash : erreur interne : ' + (e && e.message ? e.message : String(e)) + '\n', 'err');
    state.lastExit = 1;
    return {code:1};
  }
}

resetAll();

const SIM = {state, resetAll, runLine, parse, tokenize, execNode, CMDS, HELP, lookup, readFile, writeFile, absPath, CATEGORIES, SHELL_BUILTINS, buildFS, USERS};
if(typeof module !== 'undefined' && module.exports) module.exports = SIM;
if(typeof window !== 'undefined') window.SIM = SIM;

<script>
/* =====================================================================
   INTERFACE DU SIMULATEUR — rendu, clavier, éditeurs, persistance
   ===================================================================== */
(function(){
'use strict';

const $ = (id) => document.getElementById(id);
const out = $('out'), screenEl = $('screen'), kb = $('kb');
const lineEl = $('line'), promptEl = $('prompt');
const beforeEl = $('before'), curEl = $('cursor'), afterEl = $('after');
const overlay = $('overlay');

let buffer = '';          // lignes accumulées pour une saisie multiligne
let busy = false;         // une commande est en cours
let askResolve = null;    // question en attente (sudo, rm -i, ssh...)
let askPassword = false;
let interrupt = null;     // fonction appelée par Ctrl+C pendant une attente
let histIndex = -1;
let histDraft = '';
let powered = true;

/* ---------------- écriture à l'écran ---------------- */
const MAX_NODES = 4000;
function write(text, cls){
  if(text === '' || text == null) return;
  const span = document.createElement('span');
  if(cls) span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  while(out.childNodes.length > MAX_NODES) out.removeChild(out.firstChild);
  scrollDown();
}
function scrollDown(){ screenEl.scrollTop = screenEl.scrollHeight; }
function clearScreen(){ out.textContent = ''; }

/* ---------------- invite de commande ---------------- */
function promptText(){
  const s = SIM.state;
  const home = SIM.USERS[s.user].home;
  let path = s.cwd;
  if(path === home) path = '~';
  else if(path.startsWith(home + '/')) path = '~' + path.slice(home.length);
  return {user: s.user + '@' + s.host, path: path, mark: s.user === 'root' ? '#' : '$'};
}
function updateTitle(){
  const t = document.getElementById('title');
  if(!t) return;
  const p = promptText();
  t.textContent = '';
  const a = document.createElement('span'); a.className = 't-who';  a.textContent = p.user + ': ';
  const b = document.createElement('span'); b.className = 't-path'; b.textContent = p.path;
  t.append(a, b);
  document.title = p.user + ': ' + p.path;
}
function drawPrompt(){
  updateTitle();
  promptEl.textContent = '';
  if(askResolve !== null) return;             // l'invite est remplacée par la question
  if(buffer !== ''){ promptEl.textContent = '> '; return; }
  const p = promptText();
  const a = document.createElement('span'); a.className = 'p-user'; a.textContent = p.user;
  const b = document.createElement('span'); b.className = 'p-sep';  b.textContent = ':';
  const c = document.createElement('span'); c.className = 'p-path'; c.textContent = p.path;
  const d = document.createElement('span'); d.className = 'p-mark'; d.textContent = p.mark + ' ';
  promptEl.append(a,b,c,d);
}
function promptPlain(){
  if(askResolve !== null) return '';
  if(buffer !== '') return '> ';
  const p = promptText();
  return `${p.user}:${p.path}${p.mark} `;
}

/* ---------------- ligne de saisie ---------------- */
function renderLine(){
  let v = kb.value;
  const pos = kb.selectionStart == null ? v.length : kb.selectionStart;
  if(askPassword) v = '';
  beforeEl.textContent = askPassword ? '' : v.slice(0, pos);
  curEl.textContent = askPassword ? ' ' : (v[pos] || ' ');
  afterEl.textContent = askPassword ? '' : v.slice(pos + 1);
  scrollDown();
}
function setLine(v, pos){
  kb.value = v;
  const p = pos == null ? v.length : pos;
  try{ kb.setSelectionRange(p, p); }catch(e){}
  renderLine();
}
function showInput(on){ lineEl.style.display = on ? 'flex' : 'none'; }
function focusKb(){ if(powered && !overlay.classList.contains('on')) kb.focus({preventScroll:true}); }

/* ---------------- branchement du moteur ---------------- */
SIM.state.io.write = (t, cls) => write(t, cls === 'err' ? 'err' : null);
SIM.state.io.clear = clearScreen;
SIM.state.io.sleep = (ms) => new Promise(r => setTimeout(r, ms));

SIM.state.io.ask = (question, opt) => new Promise(resolve => {
  write(question, 'ask');
  askResolve = resolve;
  askPassword = !!(opt && opt.password);
  drawPrompt(); setLine(''); showInput(true); focusKb();
});

SIM.state.io.follow = (file) => new Promise(resolve => {
  write('\n');
  const msgs = [
    'Jul 21 ' + hhmm() + ' simulateur-linux systemd[1]: Started Session c2 of user user.',
    'Jul 21 ' + hhmm() + ' simulateur-linux cron[688]: (root) CMD (run-parts /etc/cron.hourly)',
    'Jul 21 ' + hhmm() + ' simulateur-linux kernel: [  842.113] EXT4-fs (nvme0n1p2): re-mounted.',
    'Jul 21 ' + hhmm() + ' simulateur-linux sshd[712]: Received disconnect from 192.168.1.42'
  ];
  let i = 0;
  const timer = setInterval(() => { write(msgs[i++ % msgs.length] + '\n'); }, 2200);
  write('(tail -f : Ctrl+C pour revenir à l\'invite)\n', 'dim');
  interrupt = () => { clearInterval(timer); interrupt = null; resolve(); };
});

SIM.state.io.fullscreen = (render, title) => new Promise(resolve => {
  openOverlay('plein');
  overlay.innerHTML = '';
  const pre = document.createElement('pre');
  pre.className = 'ov-body';
  const foot = document.createElement('div');
  foot.className = 'ov-foot';
  foot.textContent = 'q : quitter — mise à jour toutes les 2 secondes';
  overlay.append(pre, foot);
  const tick = () => { pre.textContent = render(); };
  tick();
  const timer = setInterval(tick, 2000);
  const onKey = (e) => {
    if(e.key === 'q' || e.key === 'Q' || e.key === 'Escape' || (e.ctrlKey && e.key === 'c')){
      e.preventDefault();
      clearInterval(timer);
      document.removeEventListener('keydown', onKey, true);
      closeOverlay();
      resolve();
    }
  };
  document.addEventListener('keydown', onKey, true);
  overlay.focus();
});

SIM.state.io.pager = (text, title) => new Promise(resolve => {
  openOverlay('pager');
  overlay.innerHTML = '';
  const pre = document.createElement('pre');
  pre.className = 'ov-body';
  pre.textContent = text;
  const foot = document.createElement('div');
  foot.className = 'ov-foot';
  overlay.append(pre, foot);
  const status = () => {
    const max = pre.scrollHeight - pre.clientHeight;
    const pct = max <= 0 ? 100 : Math.round(pre.scrollTop / max * 100);
    foot.textContent = `${title || ''}   ${pct >= 100 ? '(FIN)' : pct + '%'}   —   Espace : page suivante · b : précédente · g/G : début/fin · q : quitter`;
  };
  pre.addEventListener('scroll', status);
  const onKey = (e) => {
    const page = pre.clientHeight - 40;
    if(e.key === 'q' || e.key === 'Q' || e.key === 'Escape'){
      e.preventDefault();
      document.removeEventListener('keydown', onKey, true);
      closeOverlay(); resolve(); return;
    }
    if(e.key === ' ' || e.key === 'PageDown' || e.key === 'f'){ e.preventDefault(); pre.scrollTop += page; }
    else if(e.key === 'b' || e.key === 'PageUp'){ e.preventDefault(); pre.scrollTop -= page; }
    else if(e.key === 'ArrowDown' || e.key === 'j' || e.key === 'Enter'){ e.preventDefault(); pre.scrollTop += 22; }
    else if(e.key === 'ArrowUp' || e.key === 'k'){ e.preventDefault(); pre.scrollTop -= 22; }
    else if(e.key === 'g'){ e.preventDefault(); pre.scrollTop = 0; }
    else if(e.key === 'G'){ e.preventDefault(); pre.scrollTop = pre.scrollHeight; }
    status();
  };
  document.addEventListener('keydown', onKey, true);
  overlay.tabIndex = 0; overlay.focus();
  status();
});

/* ---------------- éditeurs nano et vim ---------------- */
SIM.state.io.editor = (name, content, mode, onSave) => new Promise(resolve => {
  openOverlay('editeur');
  overlay.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'ed-head';
  const ta = document.createElement('textarea');
  ta.className = 'ed-body';
  ta.value = content || '';
  ta.spellcheck = false;
  ta.setAttribute('aria-label', 'Contenu du fichier ' + (name || 'sans nom'));
  const foot = document.createElement('div');
  foot.className = 'ed-foot';
  overlay.append(head, ta, foot);

  let saved = content || '';
  let savedAny = false;
  let vimMode = 'normal';
  let cmdLine = null;             // saisie « : » de vim ou question de nano
  let pending = null;             // 'exit-save' pour nano

  const doSave = (data) => {
    if(onSave){
      const err = onSave(data);
      if(err) return err;
    }
    saved = data; savedAny = true;
    return null;
  };
  const finish = () => {
    document.removeEventListener('keydown', onKey, true);
    closeOverlay();
    resolve(onSave ? null : (savedAny ? saved : null));
  };
  const drawHead = () => {
    head.textContent = mode === 'nano'
      ? `  GNU nano 7.2` + ' '.repeat(6) + (name || 'Nouveau tampon') + (ta.value !== saved ? '   (modifié)' : '')
      : `  ${name || '[Sans nom]'} — ${vimMode === 'insert' ? '-- INSERTION --' : 'mode normal'}`;
  };
  const drawFoot = () => {
    if(cmdLine !== null){ foot.textContent = cmdLine; foot.className = 'ed-foot ask'; return; }
    foot.className = 'ed-foot';
    foot.textContent = mode === 'nano'
      ? '^O Écrire   ^X Quitter   ^K Couper la ligne   ^W Chercher   ^G Aide'
      : 'i insertion · Échap normal · :w écrire · :q quitter · :wq écrire et quitter · :q! forcer';
  };
  const refresh = () => { drawHead(); drawFoot(); };

  const onKey = (e) => {
    /* ligne de commande active (question nano ou « : » vim) */
    if(cmdLine !== null){
      if(mode === 'nano' && pending === 'exit-save'){
        if(/^[oOyY]$/.test(e.key)){
          e.preventDefault();
          const err = doSave(ta.value);
          cmdLine = null; pending = null;
          if(err){ cmdLine = '[ ' + err + ' ]'; refresh(); return; }
          finish(); return;
        }
        if(/^[nN]$/.test(e.key)){ e.preventDefault(); cmdLine = null; pending = null; finish(); return; }
        if(e.key === 'Escape' || (e.ctrlKey && e.key === 'c')){ e.preventDefault(); cmdLine = null; pending = null; refresh(); return; }
        e.preventDefault(); return;
      }
      if(mode === 'nano' && pending === 'write'){
        if(e.key === 'Enter'){
          e.preventDefault();
          const err = doSave(ta.value);
          cmdLine = err ? '[ ' + err + ' ]' : '[ ' + ta.value.split('\n').length + ' lignes écrites ]';
          pending = null;
          setTimeout(()=>{ if(pending === null){ cmdLine = null; refresh(); } }, 1400);
          refresh(); return;
        }
        if(e.key === 'Escape' || (e.ctrlKey && e.key === 'c')){ e.preventDefault(); cmdLine = null; pending = null; refresh(); return; }
        if(e.key === 'Backspace'){ e.preventDefault(); cmdLine = cmdLine.slice(0,-1); refresh(); return; }
        if(e.key.length === 1){ e.preventDefault(); cmdLine += e.key; refresh(); return; }
        return;
      }
      /* vim : ligne « : » */
      if(e.key === 'Escape'){ e.preventDefault(); cmdLine = null; refresh(); return; }
      if(e.key === 'Backspace'){ e.preventDefault(); cmdLine = cmdLine.slice(0,-1); if(cmdLine === ''){ cmdLine = null; } refresh(); return; }
      if(e.key === 'Enter'){
        e.preventDefault();
        const c = cmdLine.slice(1).trim();
        cmdLine = null;
        if(c === 'w'){ const err = doSave(ta.value); cmdLine = err ? '[ ' + err + ' ]' : `"${name}" ${ta.value.split('\n').length}L écrites`; refresh(); return; }
        if(c === 'wq' || c === 'x' || c === 'wq!'){ const err = doSave(ta.value); if(err){ cmdLine = '[ ' + err + ' ]'; refresh(); return; } finish(); return; }
        if(c === 'q'){
          if(ta.value !== saved){ cmdLine = 'E37: Pas d\'écriture depuis le dernier changement (ajoutez ! pour passer outre)'; refresh(); return; }
          finish(); return;
        }
        if(c === 'q!'){ finish(); return; }
        cmdLine = 'E492: Ce n\'est pas une commande de l\'éditeur : ' + c;
        refresh(); return;
      }
      if(e.key.length === 1){ e.preventDefault(); cmdLine += e.key; refresh(); return; }
      return;
    }

    if(mode === 'nano'){
      if(e.ctrlKey && (e.key === 'o' || e.key === 'O')){
        e.preventDefault();
        pending = 'write';
        cmdLine = 'Nom du fichier à écrire : ' + (name || '');
        cmdLine = 'Nom du fichier à écrire : ' + (name || '');
        refresh(); return;
      }
      if(e.ctrlKey && (e.key === 'x' || e.key === 'X')){
        e.preventDefault();
        if(ta.value === saved){ finish(); return; }
        pending = 'exit-save';
        cmdLine = 'Enregistrer le tampon modifié ?  O Oui   N Non   ^C Annuler';
        refresh(); return;
      }
      if(e.ctrlKey && (e.key === 'k' || e.key === 'K')){
        e.preventDefault();
        const v = ta.value, pos = ta.selectionStart;
        const start = v.lastIndexOf('\n', pos - 1) + 1;
        let end = v.indexOf('\n', pos);
        if(end < 0) end = v.length; else end += 1;
        ta.value = v.slice(0, start) + v.slice(end);
        ta.selectionStart = ta.selectionEnd = start;
        refresh(); return;
      }
      if(e.ctrlKey && (e.key === 'w' || e.key === 'W')){
        e.preventDefault();
        const q = window.prompt('Chercher :');
        if(q){
          const i = ta.value.indexOf(q, ta.selectionStart + 1);
          const j = i < 0 ? ta.value.indexOf(q) : i;
          if(j >= 0){ ta.focus(); ta.setSelectionRange(j, j + q.length); }
        }
        return;
      }
      if(e.ctrlKey && (e.key === 'g' || e.key === 'G')){
        e.preventDefault();
        cmdLine = 'Aide : ^O écrire le fichier · ^X quitter · ^K couper · ^W chercher';
        refresh();
        setTimeout(()=>{ if(pending === null){ cmdLine = null; refresh(); } }, 2600);
        return;
      }
      if(e.ctrlKey && (e.key === 'c')){ e.preventDefault(); return; }
      setTimeout(refresh, 0);
      return;
    }

    /* ---- vim ---- */
    if(vimMode === 'insert'){
      if(e.key === 'Escape'){ e.preventDefault(); vimMode = 'normal'; ta.readOnly = true; refresh(); return; }
      setTimeout(refresh, 0);
      return;
    }
    /* mode normal */
    if(e.key === 'i'){ e.preventDefault(); vimMode = 'insert'; ta.readOnly = false; ta.focus(); refresh(); return; }
    if(e.key === 'a'){ e.preventDefault(); vimMode = 'insert'; ta.readOnly = false; ta.focus(); ta.selectionStart = ta.selectionEnd = Math.min(ta.value.length, ta.selectionStart + 1); refresh(); return; }
    if(e.key === 'o'){
      e.preventDefault();
      const v = ta.value, pos = ta.selectionStart;
      let end = v.indexOf('\n', pos); if(end < 0) end = v.length;
      ta.value = v.slice(0, end) + '\n' + v.slice(end);
      ta.selectionStart = ta.selectionEnd = end + 1;
      vimMode = 'insert'; ta.readOnly = false; ta.focus(); refresh(); return;
    }
    if(e.key === ':'){ e.preventDefault(); cmdLine = ':'; refresh(); return; }
    if(e.key === 'x'){
      e.preventDefault();
      const v = ta.value, pos = ta.selectionStart;
      ta.value = v.slice(0, pos) + v.slice(pos + 1);
      ta.selectionStart = ta.selectionEnd = pos; refresh(); return;
    }
    if(e.key === 'h' || e.key === 'ArrowLeft'){ e.preventDefault(); ta.selectionStart = ta.selectionEnd = Math.max(0, ta.selectionStart - 1); return; }
    if(e.key === 'l' || e.key === 'ArrowRight'){ e.preventDefault(); ta.selectionStart = ta.selectionEnd = Math.min(ta.value.length, ta.selectionStart + 1); return; }
    if(e.key === 'j' || e.key === 'ArrowDown' || e.key === 'k' || e.key === 'ArrowUp') return;
    if(e.key.length === 1){ e.preventDefault(); return; }
  };

  document.addEventListener('keydown', onKey, true);
  if(mode === 'vim'){ ta.readOnly = true; }
  refresh();
  setTimeout(()=>{ ta.focus(); ta.setSelectionRange(0,0); }, 20);
});

SIM.state.io.power = (kind) => new Promise(resolve => {
  const steps = kind === 'reboot'
    ? ['Broadcast message from root@' + SIM.state.host + ':', '', 'The system is going down for reboot NOW!', '',
       '[  OK  ] Stopped target Graphical Interface.', '[  OK  ] Stopped Docker Application Container Engine.',
       '[  OK  ] Stopped OpenBSD Secure Shell server.', '[  OK  ] Unmounted /home.', '[  OK  ] Reached target Reboot.']
    : ['Broadcast message from root@' + SIM.state.host + ':', '', 'The system is going down for poweroff NOW!', '',
       '[  OK  ] Stopped target Multi-User System.', '[  OK  ] Stopped OpenBSD Secure Shell server.',
       '[  OK  ] Unmounted /home.', '[  OK  ] Reached target Power-Off.'];
  showInput(false);
  let i = 0;
  const timer = setInterval(() => {
    if(i < steps.length){ write(steps[i++] + '\n', i <= 4 ? 'warn' : null); return; }
    clearInterval(timer);
    if(kind === 'reboot'){
      setTimeout(() => { clearScreen(); SIM.resetAll(); boot(); resolve(); }, 700);
    } else {
      powered = false;
      setTimeout(() => {
        clearScreen();
        write('\n\n  Le système est arrêté.\n\n', 'dim');
        const btn = document.createElement('button');
        btn.className = 'power-btn';
        btn.textContent = 'Rallumer la machine';
        btn.onclick = () => { powered = true; clearScreen(); SIM.resetAll(); boot(); };
        out.appendChild(btn);
        scrollDown();
        resolve();
      }, 700);
    }
  }, 260);
});

/* ---------------- démarrage ---------------- */
function hhmm(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}
function boot(){
  buffer = '';
  write('Ubuntu 26.04 LTS (Resolute Raccoon) \u2014 simulateur p\u00e9dagogique. Rien n\'est install\u00e9, rien n\'est envoy\u00e9.\n', 'dim');
  write('Tapez ', 'dim'); write('help', 'kw'); write(' pour les commandes, ', 'dim');
  write('man <commande>', 'kw'); write(' pour le manuel, ', 'dim');
  write('cat README.txt', 'kw'); write(' pour d\u00e9marrer.\n\n', 'dim');
  showInput(true);
  drawPrompt(); setLine('');
  focusKb();
}

/* ---------------- persistance ---------------- */
const STORE_KEY = 'simulateur-linux-v2';
let storageOK = true;
function encode(v){
  if(v instanceof Date) return {__d: v.toISOString()};
  if(Array.isArray(v)) return v.map(encode);
  if(v && typeof v === 'object'){
    const o = {};
    for(const k of Object.keys(v)){ if(k === '_ino') continue; o[k] = encode(v[k]); }
    return o;
  }
  return v;
}
function decode(v){
  if(v && typeof v === 'object'){
    if(v.__d) return new Date(v.__d);
    if(Array.isArray(v)) return v.map(decode);
    const o = {};
    for(const k of Object.keys(v)) o[k] = decode(v[k]);
    return o;
  }
  return v;
}
let saveTimer = null;
function saveState(){
  if(!storageOK) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      const s = SIM.state;
      localStorage.setItem(STORE_KEY, JSON.stringify(encode({
        v:3, root:s.root, cwd:s.cwd, user:s.user, loginUser:s.loginUser, host:s.host,
        env:s.env, vars:s.vars, aliases:s.aliases, history:s.history.slice(-200),
        packages:s.packages, snaps:s.snaps, services:s.services, docker:s.docker, mounts:s.mounts, umask:s.umask,
        net:s.net, cron:s.cron, gitRepos:s.gitRepos
      })));
    }catch(e){ storageOK = false; }
  }, 400);
}
function loadState(){
  if(!storageOK) return false;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const d = decode(JSON.parse(raw));
    if(!d || d.v !== 3 || !d.root) return false;
    const s = SIM.state;
    s.root = d.root; s.cwd = d.cwd; s.user = d.user; s.loginUser = d.loginUser || 'user';
    s.host = d.host; s.env = d.env; s.vars = d.vars || {}; s.aliases = d.aliases || {};
    s.history = d.history || []; s.packages = d.packages; s.services = d.services;
    s.docker = d.docker; s.mounts = d.mounts; s.net = d.net; s.cron = d.cron || [];
    if(d.snaps) s.snaps = d.snaps;
    if(typeof d.umask === 'number') s.umask = d.umask;
    s.gitRepos = d.gitRepos || {};
    return true;
  }catch(e){ storageOK = false; return false; }
}
function wipeState(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
}

/* ---------------- complétion Tab ---------------- */
function completion(){
  const v = kb.value;
  const pos = kb.selectionStart;
  const left = v.slice(0, pos);
  const m = /(^|[\s|;&(])([^\s|;&(]*)$/.exec(left);
  const token = m ? m[2] : '';
  const start = pos - token.length;
  const isFirst = /^\s*$/.test(left.slice(0, start).replace(/.*[|;&]\s*/, ''));

  let candidates = [];
  if(isFirst && !token.includes('/')){
    const names = Object.keys(SIM.CMDS)
      .concat(Object.keys(SIM.state.aliases))
      .concat(Object.keys(SIM.state.funcs));
    candidates = [...new Set(names)].filter(n => n.startsWith(token)).sort();
  } else {
    const slash = token.lastIndexOf('/');
    const dirPart = slash < 0 ? '' : token.slice(0, slash + 1);
    const namePart = slash < 0 ? token : token.slice(slash + 1);
    const dirPath = dirPart === '' ? '.' : dirPart;
    const r = SIM.lookup(dirPath);
    if(r.err || r.node.type !== 'dir') return;
    candidates = Object.keys(r.node.children)
      .filter(n => n.startsWith(namePart) && (namePart.startsWith('.') || !n.startsWith('.')))
      .sort()
      .map(n => dirPart + n + (r.node.children[n].type === 'dir' ? '/' : ''));
  }
  if(!candidates.length) return;
  if(candidates.length === 1){
    const c = candidates[0];
    const add = c.endsWith('/') ? c : c + ' ';
    setLine(v.slice(0, start) + add + v.slice(pos), start + add.length);
    return;
  }
  /* préfixe commun */
  let common = candidates[0];
  for(const c of candidates) while(!c.startsWith(common)) common = common.slice(0, -1);
  if(common.length > token.length){
    setLine(v.slice(0, start) + common + v.slice(pos), start + common.length);
    return;
  }
  echoLine();
  const cols = Math.max(1, Math.floor(78 / (Math.max(...candidates.map(c=>c.length)) + 2)));
  let line = '';
  const w = Math.max(...candidates.map(c=>c.length)) + 2;
  candidates.forEach((c, i) => {
    line += c.padEnd(w, ' ');
    if((i + 1) % cols === 0){ write(line.replace(/\s+$/,'') + '\n', 'dim'); line = ''; }
  });
  if(line.trim()) write(line.replace(/\s+$/,'') + '\n', 'dim');
  drawPrompt();
  renderLine();
}

/* ---------------- boucle de saisie ---------------- */
function echoLine(masked){
  write(promptPlain(), 'echo-prompt');
  write((masked ? '' : kb.value) + '\n', 'echo-cmd');
}
async function submit(){
  const value = kb.value;

  if(askResolve){
    const r = askResolve;
    const wasPw = askPassword;
    askResolve = null; askPassword = false;
    write((wasPw ? '' : value) + '\n', 'echo-cmd');
    setLine('');
    showInput(false);          /* la commande reprend la main */
    r(value);
    return;
  }

  echoLine();
  setLine('');
  histIndex = -1;

  const src = buffer === '' ? value : buffer + '\n' + value;
  if(src.trim() === ''){ buffer = ''; drawPrompt(); return; }

  busy = true;
  showInput(false);
  let res;
  try{
    res = await SIM.runLine(src);
  }catch(e){
    write('bash : erreur inattendue : ' + (e && e.message ? e.message : String(e)) + '\n', 'err');
    res = {code:1};
  }
  busy = false;

  if(res && res.incomplete){
    buffer = src;
  } else {
    buffer = '';
    saveState();
  }
  if(powered){
    showInput(true);
    drawPrompt();
    renderLine();
    focusKb();
  }
}

/* ---------------- clavier du terminal ---------------- */
kb.addEventListener('keydown', (e) => {
  if(!powered) return;

  if(e.key === 'Enter'){
    e.preventDefault();
    /* pendant une question (rm -i, sudo, read...) la commande est encore en
       cours d'exécution : busy vaut true, mais la réponse doit passer */
    if(askResolve !== null || !busy) submit();
    return;
  }

  if(e.ctrlKey || e.metaKey){
    const k = e.key.toLowerCase();
    if(k === 'c'){
      e.preventDefault();
      if(interrupt){ write('^C\n'); interrupt(); return; }
      if(askResolve){ const r = askResolve; askResolve = null; askPassword = false; write('^C\n'); setLine(''); drawPrompt(); r(null); return; }
      write(promptPlain() + kb.value + '^C\n', 'echo-cmd');
      buffer = ''; setLine(''); drawPrompt(); return;
    }
    if(k === 'l'){ e.preventDefault(); clearScreen(); drawPrompt(); renderLine(); return; }
    if(k === 'u'){ e.preventDefault(); setLine(kb.value.slice(kb.selectionStart), 0); return; }
    if(k === 'k'){ e.preventDefault(); setLine(kb.value.slice(0, kb.selectionStart), kb.selectionStart); return; }
    if(k === 'a'){ e.preventDefault(); setLine(kb.value, 0); return; }
    if(k === 'e'){ e.preventDefault(); setLine(kb.value, kb.value.length); return; }
    if(k === 'w'){
      e.preventDefault();
      const pos = kb.selectionStart;
      const left = kb.value.slice(0, pos).replace(/\S+\s*$/, '');
      setLine(left + kb.value.slice(pos), left.length);
      return;
    }
    if(k === 'd'){
      e.preventDefault();
      if(kb.value === '' && !askResolve){ echoLine(); write('déconnexion\n', 'dim'); SIM.runLine('exit'); }
      return;
    }
    return;
  }

  if(e.key === 'Tab'){ e.preventDefault(); if(!askResolve) completion(); return; }

  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    if(askResolve) return;
    e.preventDefault();
    const h = SIM.state.history;
    if(!h.length) return;
    if(e.key === 'ArrowUp'){
      if(histIndex === -1){ histDraft = kb.value; histIndex = h.length - 1; }
      else if(histIndex > 0) histIndex--;
      setLine(h[histIndex]);
    } else {
      if(histIndex === -1) return;
      if(histIndex < h.length - 1){ histIndex++; setLine(h[histIndex]); }
      else { histIndex = -1; setLine(histDraft); }
    }
    return;
  }
  setTimeout(renderLine, 0);
});
kb.addEventListener('input', renderLine);
kb.addEventListener('click', renderLine);
kb.addEventListener('select', renderLine);
kb.addEventListener('blur', () => curEl.classList.add('off'));
kb.addEventListener('focus', () => curEl.classList.remove('off'));
screenEl.addEventListener('mousedown', (e) => {
  if(window.getSelection().toString()) return;
  setTimeout(focusKb, 0);
});

/* ---------------- barre d'outils ---------------- */
function openOverlay(kind){
  overlay.className = 'on ' + kind;
  overlay.setAttribute('aria-hidden', 'false');
  kb.blur();
}
function closeOverlay(){
  overlay.className = '';
  overlay.innerHTML = '';
  overlay.setAttribute('aria-hidden', 'true');
  focusKb();
}
$('btn-aide').addEventListener('click', () => { if(!busy){ setLine('help'); submit(); } });
$('btn-reset').addEventListener('click', () => {
  if(!window.confirm('Remettre le simulateur dans son état d\'origine ? Tous vos fichiers créés seront perdus.')) return;
  wipeState();
  SIM.resetAll();
  clearScreen();
  boot();
});
let fontStep = 0;
function applyFont(){
  document.documentElement.style.setProperty('--fs', (14 + fontStep) + 'px');
  try{ localStorage.setItem(STORE_KEY + ':fs', String(fontStep)); }catch(e){}
}
$('btn-plus').addEventListener('click', () => { fontStep = Math.min(10, fontStep + 1); applyFont(); });
$('btn-moins').addEventListener('click', () => { fontStep = Math.max(-3, fontStep - 1); applyFont(); });

/* ---------------- initialisation ---------------- */
try{
  const fs = localStorage.getItem(STORE_KEY + ':fs');
  if(fs !== null){ fontStep = parseInt(fs, 10) || 0; applyFont(); }
}catch(e){ storageOK = false; }

const restored = loadState();
boot();
if(restored) write('(session précédente restaurée — « reset » pour repartir de zéro)\n\n', 'dim');
window.addEventListener('beforeunload', saveState);

})();

</script>
