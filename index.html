/* ---------------- cat / file / du / stat ---------------- */
HELP.cat = "cat [-n] [-A] [FICHIER]... — affiche le contenu.\n  -n  numérote les lignes\n  -b  numérote les lignes non vides\n  -A  montre les fins de ligne ($) et les tabulations";
CMDS.cat = async (ctx, args) => {
  const g = getopt(args, {known:'nbAeEsTv'});
  if(g.error) return usageErr(ctx, 'cat', g.error);
  const o = g.opts;
  let text = '';
  let code = 0;
  if(!g.rest.length || g.rest.every(a=>a === '-')) text = ctx.stdin || '';
  else {
    const parts = [];
    for(const f of g.rest){
      if(f === '-'){ parts.push(ctx.stdin || ''); continue; }
      const r = lookup(f);
      if(r.err){
        if(r.code === 'EACCES') ctx.err(`cat: ${f}: Permission non accordée\n`);
        else ctx.err(`cat: ${f}: Aucun fichier ou dossier de ce type\n`);
        code = 1; continue;
      }
      if(r.node.type === 'dir'){ ctx.err(`cat: ${f}: est un dossier\n`); code = 1; continue; }
      if(!canRead(r.node)){ ctx.err(`cat: ${f}: Permission non accordée\n`); code = 1; continue; }
      parts.push(r.node.content);
    }
    text = parts.join('');
  }
  if(o.n || o.b){
    const ls = text.split('\n');
    const hadTrail = ls[ls.length-1] === '';
    if(hadTrail) ls.pop();
    let no = 0;
    const out = ls.map(l => (o.b && l === '') ? '      \t' + l : String(++no).padStart(6,' ') + '\t' + l);
    text = out.join('\n') + (hadTrail ? '\n' : '');
  }
  if(o.A || o.E) text = text.split('\n').map((l,i,a)=> i === a.length-1 ? l : l + '$').join('\n');
  if(o.A || o.T) text = text.replace(/\t/g,'^I');
  ctx.out(text);
  return code;
};

HELP.file = "file FICHIER... — devine le type d'un fichier.";
CMDS.file = async (ctx, args) => {
  if(!args.length) return usageErr(ctx, 'file', 'opérande manquant');
  for(const f of args){
    const r = lookup(f, {noFollowLast:true});
    if(r.err){ ctx.out(`${f}: cannot open (No such file or directory)\n`); continue; }
    const n = r.node;
    if(n.type === 'dir'){ ctx.out(`${f}: directory\n`); continue; }
    if(n.type === 'link'){ ctx.out(`${f}: symbolic link to ${n.target}\n`); continue; }
    const c = n.content;
    let d;
    if(c === '') d = 'empty';
    else if(c.startsWith('#!')) d = c.split('\n')[0].replace('#!','') + ' script, ASCII text executable';
    else if(f.endsWith('.gz') || n.gz) d = 'gzip compressed data';
    else if(n.tar || f.endsWith('.tar')) d = 'POSIX tar archive';
    else if(f.endsWith('.csv')) d = 'CSV text';
    else if(f.endsWith('.html')) d = 'HTML document, ASCII text';
    else if(f.endsWith('.json')) d = 'JSON data';
    else if(/[\u0080-\uffff]/.test(c)) d = 'UTF-8 Unicode text';
    else d = 'ASCII text';
    ctx.out(`${f}: ${d}\n`);
  }
  return 0;
};

HELP.du = "du [-h] [-s] [-a] [CHEMIN]... — affiche l'espace occupé.\n  -h  tailles lisibles\n  -s  total seulement\n  -a  inclut les fichiers\n  -c  affiche un total général";
CMDS.du = async (ctx, args) => {
  const g = getopt(args, {known:'hsackd'});
  if(g.error) return usageErr(ctx, 'du', g.error);
  const o = g.opts;
  const targets = g.rest.length ? g.rest : ['.'];
  const rows = [];
  let grand = 0;
  const walk = (path, node) => {
    let total = node.type === 'dir' ? 4 : Math.ceil(nodeSize(node)/1024) || 4;
    if(node.type === 'dir'){
      for(const k of Object.keys(node.children).sort()){
        const child = node.children[k];
        const p = (path === '/' ? '' : path) + '/' + k;
        const sub = walk(p, child);
        total += sub;
      }
    }
    if(node.type === 'dir' || o.a){
      if(!o.s || path === null) rows.push({size:total, path});
    }
    return total;
  };
  for(const t of targets){
    const r = lookup(t);
    if(r.err){ ctx.err(`du: impossible d'accéder à '${t}': Aucun fichier ou dossier de ce type\n`); continue; }
    const before = rows.length;
    const tot = walk(t === '.' ? '.' : t, r.node);
    grand += tot;
    if(o.s){ rows.length = before; rows.push({size:tot, path:t}); }
  }
  if(o.c) rows.push({size:grand, path:'total'});
  ctx.out(rows.map(r => (o.h ? humanSize(r.size*1024) : String(r.size)) + '\t' + r.path).join('\n') + (rows.length ? '\n' : ''));
  return 0;
};

HELP.stat = "stat FICHIER — affiche les métadonnées détaillées d'un fichier.";
CMDS.stat = async (ctx, args) => {
  if(!args.length) return usageErr(ctx, 'stat', 'opérande manquant');
  for(const f of args){
    const r = lookup(f, {noFollowLast:true});
    if(r.err){ ctx.err(`stat: impossible d'évaluer '${f}': Aucun fichier ou dossier de ce type\n`); continue; }
    const n = r.node;
    const oct = (n.mode & 0o7777).toString(8).padStart(4,'0');
    ctx.out(
`  Fichier : ${f}
    Taille : ${nodeSize(n)}\tBlocs : ${Math.ceil(nodeSize(n)/512)}\tBloc d'E/S : 4096\t${n.type === 'dir' ? 'répertoire' : n.type === 'link' ? 'lien symbolique' : 'fichier ordinaire'}
Périphérique : 803h/2051d\tInode : ${inodeOf(n)}\tLiens : 1
     Accès : (${oct}/${modeString(n)})\tUID : ( ${USERS[n.owner] ? USERS[n.owner].uid : 1000}/${n.owner})\tGID : ( ${USERS[n.group] ? USERS[n.group].gid : 1000}/${n.group})
Modification : ${n.mtime.toISOString().replace('T',' ').slice(0,19)}
`);
  }
  return 0;
};

/* =====================================================================
   Partie 6 : traitement de texte
   ===================================================================== */
function inputText(ctx, files, cmdName, opts){
  const out = [];
  let code = 0;
  if(!files.length) return {text: ctx.stdin || '', code:0, single:true};
  for(const f of files){
    if(f === '-'){ out.push({name:'-', text:ctx.stdin || ''}); continue; }
    const r = lookup(f);
    if(r.err){ ctx.err(`${cmdName}: ${f}: Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    if(r.node.type === 'dir'){
      if(opts && opts.dirOk){ out.push({name:f, dir:true, node:r.node}); continue; }
      ctx.err(`${cmdName}: ${f}: est un dossier\n`); code = 1; continue;
    }
    if(!canRead(r.node)){ ctx.err(`${cmdName}: ${f}: Permission non accordée\n`); code = 1; continue; }
    out.push({name:f, text:r.node.content});
  }
  return {files:out, code, single: out.length <= 1};
}

HELP.echo = "echo [-n] [-e] TEXTE... — affiche du texte.\n  -n  sans saut de ligne final\n  -e  interprète \\n, \\t, \\\\ etc.";
CMDS.echo = async (ctx, args) => {
  let noNl = false, esc = false, i = 0;
  while(i < args.length && /^-[neE]+$/.test(args[i])){
    if(args[i].includes('n')) noNl = true;
    if(args[i].includes('e')) esc = true;
    if(args[i].includes('E')) esc = false;
    i++;
  }
  let s = args.slice(i).join(' ');
  if(esc) s = s.replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\r/g,'\r').replace(/\\\\/g,'\\').replace(/\\a/g,'').replace(/\\0/g,'\0');
  ctx.out(s + (noNl ? '' : '\n'));
  return 0;
};

HELP.printf = "printf FORMAT [ARGUMENT]... — affiche selon un format (%s, %d, %f, \\n).";
CMDS.printf = async (ctx, args) => {
  if(!args.length) return usageErr(ctx, 'printf', 'opérande manquant');
  const fmt = args[0];
  const rest = args.slice(1);
  let ai = 0;
  const render = () => fmt
    .replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\\\/g,'\\')
    .replace(/%(-?\d+)?(\.\d+)?([sdifxX%])/g, (m, w, prec, conv) => {
      if(conv === '%') return '%';
      let v = rest[ai++];
      if(v === undefined) v = '';
      if(conv === 'd' || conv === 'i') v = String(parseInt(v,10) || 0);
      else if(conv === 'f'){ const p = prec ? parseInt(prec.slice(1),10) : 6; v = (parseFloat(v)||0).toFixed(p); }
      else if(conv === 'x') v = (parseInt(v,10)||0).toString(16);
      else if(conv === 'X') v = (parseInt(v,10)||0).toString(16).toUpperCase();
      else if(prec) v = String(v).slice(0, parseInt(prec.slice(1),10));
      if(w){ const n = parseInt(w,10); v = n < 0 ? String(v).padEnd(-n,' ') : String(v).padStart(n,' '); }
      return v;
    });
  let s = render();
  while(ai < rest.length && /%[-\d.]*[sdifxX]/.test(fmt)) s += render();
  ctx.out(s);
  return 0;
};

HELP.grep = `grep [OPTION]... MOTIF [FICHIER]...
Filtre les lignes correspondant à un motif. Renvoie 0 si trouvé, 1 sinon.
  -i  ignore la casse            -n  affiche les numéros de ligne
  -v  inverse la sélection       -c  compte les lignes correspondantes
  -l  n'affiche que les noms de fichiers   -w  mot entier
  -r  parcours récursif          -E  expressions régulières étendues
  -o  n'affiche que la partie correspondante   -q  silencieux (code de retour seul)
  -A N / -B N  affiche N lignes après / avant`;
CMDS.grep = async (ctx, args) => {
  const g = getopt(args, {known:'inveclwroqEFhsAB', value:'AB', longs:['color','ignore-case','line-number','invert-match','recursive','help']});
  if(g.error) return usageErr(ctx, 'grep', g.error);
  const o = g.opts;
  if(o['--ignore-case']) o.i = true;
  if(o['--line-number']) o.n = true;
  if(o['--invert-match']) o.v = true;
  if(o['--recursive']) o.r = true;
  if(!g.rest.length) return usageErr(ctx, 'grep', 'motif manquant');
  const patternRaw = g.rest[0];
  let files = g.rest.slice(1);
  let re;
  try{
    let p = o.F ? patternRaw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') : patternRaw;
    if(o.w) p = '\\b(?:' + p + ')\\b';
    re = new RegExp(p, o.i ? 'gi' : 'g');
  }catch(e){ ctx.err(`grep: ${patternRaw}: expression régulière non valide\n`); return 2; }

  const collected = [];
  if(o.r){
    const roots = files.length ? files : ['.'];
    files = [];
    const walk = (p) => {
      const r = lookup(p);
      if(r.err) return;
      if(r.node.type === 'dir'){
        for(const k of Object.keys(r.node.children).sort()) walk((p === '/' ? '' : p) + '/' + k);
      } else files.push(p.replace(/^\.\//,''));
    };
    for(const rt of roots) walk(rt);
  }
  const inp = inputText(ctx, files, 'grep');
  let code = inp.code;
  const list = inp.files || [{name:null, text:inp.text}];
  const many = list.length > 1;
  let found = false;
  const after = o.A ? parseInt(o.A,10) : 0;
  const before = o.B ? parseInt(o.B,10) : 0;

  for(const f of list){
    const ls = lines(f.text);
    const hits = [];
    ls.forEach((l, idx) => {
      re.lastIndex = 0;
      const m = re.test(l);
      if(m !== !!o.v) hits.push(idx);
    });
    if(hits.length) found = true;
    if(o.q) continue;
    if(o.l){ if(hits.length) collected.push(f.name); continue; }
    if(o.c){ collected.push((many ? f.name + ':' : '') + hits.length); continue; }
    const show = new Set();
    for(const h of hits){
      for(let k = Math.max(0, h-before); k <= Math.min(ls.length-1, h+after); k++) show.add(k);
    }
    const ordered = [...show].sort((a,b)=>a-b);
    for(const idx of ordered){
      const prefix = (many && f.name ? f.name + ':' : '') + (o.n ? (idx+1) + ':' : '');
      if(o.o){
        re.lastIndex = 0;
        let m;
        while((m = re.exec(ls[idx])) !== null){ if(m[0] !== '') collected.push(prefix + m[0]); if(m.index === re.lastIndex) re.lastIndex++; }
      } else collected.push(prefix + ls[idx]);
    }
  }
  if(collected.length) ctx.out(collected.join('\n') + '\n');
  if(code === 0) code = found ? 0 : 1;
  return code;
};

HELP.find = `find [CHEMIN] [EXPRESSION]
Recherche récursive de fichiers.
  -name MOTIF     nom correspondant au motif (jokers acceptés)
  -iname MOTIF    identique, insensible à la casse
  -type f|d|l     type : fichier, dossier, lien
  -maxdepth N     profondeur maximale
  -size +N / -N   taille en blocs de 512 octets (k, M acceptés)
  -user NOM       propriétaire
  -perm MODE      permissions exactes (ex. 644)
  -empty          fichiers ou dossiers vides
  -delete         supprime les résultats
  -exec CMD {} \\; exécute une commande sur chaque résultat`;
CMDS.find = async (ctx, args) => {
  const paths = [];
  let i = 0;
  while(i < args.length && !args[i].startsWith('-')) paths.push(args[i++]);
  if(!paths.length) paths.push('.');
  const tests = [];
  let maxdepth = Infinity, action = null, execCmd = null;
  for(; i < args.length; i++){
    const a = args[i];
    if(a === '-name' || a === '-iname'){
      const pat = args[++i];
      const re = globToRegex(pat, new Array(pat.length).fill(false));
      const reI = new RegExp(re.source, 'i');
      tests.push(e => (a === '-iname' ? reI : re).test(basenameOf(e.path)));
    }
    else if(a === '-type'){ const t = args[++i]; tests.push(e => (t === 'f' && e.node.type === 'file') || (t === 'd' && e.node.type === 'dir') || (t === 'l' && e.node.type === 'link')); }
    else if(a === '-maxdepth') maxdepth = parseInt(args[++i],10);
    else if(a === '-mindepth'){ const md = parseInt(args[++i],10); tests.push(e => e.depth >= md); }
    else if(a === '-user'){ const u = args[++i]; tests.push(e => e.node.owner === u); }
    else if(a === '-group'){ const u = args[++i]; tests.push(e => e.node.group === u); }
    else if(a === '-perm'){ const m = args[++i].replace(/^0/,''); tests.push(e => (e.node.mode & 0o777).toString(8) === m); }
    else if(a === '-empty') tests.push(e => e.node.type === 'dir' ? Object.keys(e.node.children).length === 0 : e.node.content === '');
    else if(a === '-size'){
      const spec = args[++i];
      const m = /^([+-]?)(\d+)([ckMG]?)$/.exec(spec);
      if(m){
        const mult = m[3] === 'c' ? 1 : m[3] === 'k' ? 1024 : m[3] === 'M' ? 1048576 : m[3] === 'G' ? 1073741824 : 512;
        const want = parseInt(m[2],10) * mult;
        tests.push(e => { const s = nodeSize(e.node); return m[1] === '+' ? s > want : m[1] === '-' ? s < want : Math.ceil(s/mult)*mult === want; });
      }
    }
    else if(a === '-delete') action = 'delete';
    else if(a === '-exec'){
      const cmd = [];
      i++;
      while(i < args.length && args[i] !== ';' && args[i] !== '\\;') cmd.push(args[i++]);
      execCmd = cmd; action = 'exec';
    }
    else if(a === '-print') action = null;
    else { ctx.err(`find: prédicat inconnu « ${a} »\n`); return 1; }
  }
  const results = [];
  let code = 0;
  const walk = (p, node, depth) => {
    const entry = {path:p, node, depth};
    if(tests.every(t => t(entry))) results.push(entry);
    if(node.type === 'dir' && depth < maxdepth){
      if(!canRead(node)){ ctx.err(`find: '${p}': Permission non accordée\n`); code = 1; return; }
      for(const k of Object.keys(node.children).sort()){
        walk((p === '/' ? '' : p) + '/' + k, node.children[k], depth+1);
      }
    }
  };
  for(const p of paths){
    const r = lookup(p);
    if(r.err){ ctx.err(`find: '${p}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    walk(p.replace(/\/$/,'') || '/', r.node, 0);
  }
  if(action === 'delete'){
    for(const e of results.slice().reverse()){
      const r = lookup(e.path, {noFollowLast:true});
      if(!r.err && r.parent) delete r.parent.children[r.name];
    }
    return code;
  }
  if(action === 'exec'){
    for(const e of results){
      const line = execCmd.map(c => c === '{}' ? shellQuote(e.path) : c).join(' ');
      await execNode(parse(line), ctx);
    }
    return code;
  }
  if(results.length) ctx.out(results.map(e=>e.path).join('\n') + '\n');
  return code;
};

function shortCount(args){
  return args.map(a => /^-\d+$/.test(a) ? ['-n', a.slice(1)] : [a]).reduce((x,y)=>x.concat(y), []);
}

CMDS.sort = async (ctx, args) => {
  const g = getopt(args, {known:'nrufktbhcV', value:'kt', longs:['numeric-sort','reverse','unique','help']});
  if(g.error) return usageErr(ctx, 'sort', g.error);
  const o = g.opts;
  const inp = inputText(ctx, g.rest, 'sort');
  const list = inp.files || [{name:null, text:inp.text}];
  let ls = [];
  for(const f of list) ls.push(...lines(f.text));
  const sep = o.t || null;
  const keyIdx = o.k ? parseInt(String(o.k).split(',')[0],10) : null;
  const keyOf = (l) => {
    if(!keyIdx) return l;
    const parts = sep ? l.split(sep) : l.trim().split(/\s+/);
    return parts.slice(keyIdx-1).join(sep || ' ');
  };
  const hval = (s) => {
    const m = /^\s*([\d.]+)\s*([KMGT]?)/i.exec(s);
    if(!m) return 0;
    const mult = {'':1,'K':1024,'M':1048576,'G':1073741824,'T':1099511627776}[m[2].toUpperCase()] || 1;
    return parseFloat(m[1]) * mult;
  };
  ls.sort((a,b) => {
    let x = keyOf(a), y = keyOf(b);
    if(o.f || o['--ignore-case']){ x = x.toLowerCase(); y = y.toLowerCase(); }
    if(o.n || o['--numeric-sort']) return (parseFloat(x) || 0) - (parseFloat(y) || 0);
    if(o.h) return hval(x) - hval(y);
    return x.localeCompare(y, 'en');
  });
  if(o.r || o['--reverse']) ls.reverse();
  if(o.u || o['--unique']){
    const seen = new Set(), out = [];
    for(const l of ls){ const k = (o.f ? l.toLowerCase() : l); if(!seen.has(k)){ seen.add(k); out.push(l); } }
    ls = out;
  }
  if(ls.length) ctx.out(ls.join('\n') + '\n');
  return inp.code;
};

Éditeur de flux.
  s/motif/remplacement/[g][i]   substitution
  Nd / $d / /motif/d            suppression de lignes
  Np / $p / /motif/p            affichage (avec -n)
  -n  n'affiche que ce qui est demandé par p

  -e  ajoute une expression (plusieurs -e possibles)`;
CMDS.sed = async (ctx, args) => {
  const g = getopt(args, {known:'nier', value:'e', longs:['quiet','in-place','expression','help']});
  if(g.error) return usageErr(ctx, 'sed', g.error);
  const o = g.opts;
  let scripts = [];
  let rest = g.rest.slice();
  if(o.e) scripts.push(o.e);
  else if(rest.length) scripts.push(rest.shift());
  if(!scripts.length) return usageErr(ctx, 'sed', 'expression manquante');
  const cmds = [];
  for(const sc of scripts){
    for(const piece of sc.split(';')){
      const p = piece.trim();
      if(!p) continue;
      let m = /^(?:(\d+|\$|\/(?:[^\/\\]|\\.)*\/)\s*)?s(.)((?:[^\\]|\\.)*?)\2((?:[^\\]|\\.)*?)\2([gip]*)$/.exec(p);
      if(m){ cmds.push({t:'s', addr:m[1], sep:m[2], pat:m[3], rep:m[4], flags:m[5]}); continue; }
      m = /^(\d+|\$|\/(?:[^\/\\]|\\.)*\/)?\s*([dp=])$/.exec(p);
      if(m){ cmds.push({t:m[2], addr:m[1]}); continue; }
      ctx.err(`sed: -e expression #1, caractère ${p.length}: commande inconnue: « ${p[0]} »\n`);
      return 1;
    }
  }
  const matchAddr = (addr, idx, total, line) => {
    if(!addr) return true;
    if(addr === '$') return idx === total-1;
    if(/^\d+$/.test(addr)) return idx+1 === parseInt(addr,10);
    const m = /^\/(.*)\/$/.exec(addr);
    if(m){ try{ return new RegExp(m[1]).test(line); }catch(e){ return false; } }
    return true;
  };
  const inp = inputText(ctx, rest, 'sed');
  const list = inp.files || [{name:null, text:inp.text}];
  let code = inp.code;
  for(const f of list){
    const ls = lines(f.text);
    const out = [];
    for(let idx=0; idx<ls.length; idx++){
      let line = ls[idx];
      let deleted = false, printed = false;
      for(const c of cmds){
        if(!matchAddr(c.addr, idx, ls.length, line)) continue;
        if(c.t === 's'){
          try{
            const re = new RegExp(c.pat, (c.flags.includes('g') ? 'g' : '') + (c.flags.includes('i') ? 'i' : ''));
            line = line.replace(re, c.rep.replace(/\\(\d)/g,'$$$1'));
            if(c.flags.includes('p')) printed = true;
          }catch(e){ ctx.err('sed: expression régulière non valide\n'); return 1; }
        }
        else if(c.t === 'd'){ deleted = true; break; }
        else if(c.t === 'p') printed = true;
        else if(c.t === '=') out.push(String(idx+1));
      }
      if(deleted) continue;
      if(o.n || o['--quiet']){ if(printed) out.push(line); }
      else { out.push(line); if(printed) out.push(line); }
    }
    const result = out.length ? out.join('\n') + '\n' : '';
    if((o.i || o['--in-place']) && f.name){
      const w = writeFile(f.name, result, false);
      if(w.err){ ctx.err(`sed: ${f.name}: ${w.err}\n`); code = 1; }
    } else ctx.out(result);
  }
  return code;
};

/* ---------------- awk ---------------- */
function awkEval(expr, rec){
  let i = 0;
  const s = expr;
  const ws = () => { while(i < s.length && /\s/.test(s[i])) i++; };
  const field = (n) => n === 0 ? rec.line : (rec.fields[n-1] == null ? '' : rec.fields[n-1]);
  const num = (v) => typeof v === 'number' ? v : (parseFloat(v) || 0);
  function prim(){
    ws();
    if(s[i] === '('){ i++; const v = orx(); ws(); if(s[i] === ')') i++; return v; }
    if(s[i] === '!'){ i++; return truthy(prim()) ? 0 : 1; }
    if(s[i] === '-'){ i++; return -num(prim()); }
    if(s[i] === '$'){ i++; const v = prim(); return field(num(v)); }
    if(s[i] === '"'){ i++; let t = ''; while(i < s.length && s[i] !== '"'){ if(s[i] === '\\') i++; t += s[i++]; } i++; return t; }
    if(s[i] === '/'){ i++; let t = ''; while(i < s.length && s[i] !== '/'){ if(s[i] === '\\'){ t += s[i++]; } t += s[i++]; } i++;
      try{ return new RegExp(t).test(rec.line) ? 1 : 0; }catch(e){ return 0; } }
    const m = /^([A-Za-z_][A-Za-z0-9_]*|\d+\.?\d*)/.exec(s.slice(i));
    if(!m) { i++; return ''; }
    i += m[0].length;
    const t = m[0];
    if(/^\d/.test(t)) return parseFloat(t);
    if(t === 'NR') return rec.nr;
    if(t === 'NF') return rec.fields.length;
    if(t === 'FS') return rec.fs;
    if(t === 'FILENAME') return rec.filename || '';
    return rec.vars[t] == null ? '' : rec.vars[t];
  }
  function cat(){ let v = prim(); for(;;){ const save = i; ws();
    if(i < s.length && !/[)\],;}]/.test(s[i]) && !/^(&&|\|\||==|!=|<=|>=|[<>+\-*\/%~])/.test(s.slice(i))){
      const r = prim(); v = String(v) + String(r); continue;
    } i = save; return v; } }
  function mul(){ let v = cat(); for(;;){ ws();
    if(s[i] === '*' && s[i+1] !== '*'){ i++; v = num(v) * num(cat()); }
    else if(s[i] === '/' && s[i+1] !== '/'){ i++; const d = num(cat()); v = d ? num(v)/d : 0; }
    else if(s[i] === '%'){ i++; const d = num(cat()); v = d ? num(v)%d : 0; }
    else return v; } }
  function add(){ let v = mul(); for(;;){ ws();
    if(s[i] === '+'){ i++; v = num(v) + num(mul()); }
    else if(s[i] === '-'){ i++; v = num(v) - num(mul()); }
    else return v; } }
  function cmp(){ let v = add(); for(;;){ ws();
    const two = s.slice(i, i+2);
    if(two === '=='){ i+=2; const r = add(); v = (String(v) === String(r)) ? 1:0; }
    else if(two === '!='){ i+=2; const r = add(); v = (String(v) !== String(r)) ? 1:0; }
    else if(two === '<='){ i+=2; v = num(v) <= num(add()) ? 1:0; }
    else if(two === '>='){ i+=2; v = num(v) >= num(add()) ? 1:0; }
    else if(s[i] === '~'){ i++; const r = add(); try{ v = new RegExp(String(r)).test(String(v)) ? 1:0; }catch(e){ v = 0; } }
    else if(s[i] === '<'){ i++; v = num(v) < num(add()) ? 1:0; }
    else if(s[i] === '>'){ i++; v = num(v) > num(add()) ? 1:0; }
    else return v; } }
  function andx(){ let v = cmp(); for(;;){ ws(); if(s.slice(i,i+2) === '&&'){ i+=2; const r = cmp(); v = (truthy(v) && truthy(r)) ? 1:0; } else return v; } }
  function orx(){ let v = andx(); for(;;){ ws(); if(s.slice(i,i+2) === '||'){ i+=2; const r = andx(); v = (truthy(v) || truthy(r)) ? 1:0; } else return v; } }
  const m = /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=([^=].*)$/.exec(s);
  if(m){ const v = awkEval(m[2], rec); rec.vars[m[1]] = v; return v; }
  return orx();
}
function truthy(v){ if(v === '' || v === 0 || v === '0') return false; return !!v; }
function splitArgsAwk(s){
  const out = []; let cur = '', depth = 0, q = null;
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(q){ cur += c; if(c === q && s[i-1] !== '\\') q = null; continue; }
    if(c === '"'){ q = c; cur += c; continue; }
    if(c === '(') depth++;
    if(c === ')') depth--;
    if(c === ',' && depth === 0){ out.push(cur); cur = ''; continue; }
    cur += c;
  }
  if(cur.trim() !== '') out.push(cur);
  return out;
}
HELP.awk = `awk [-F SEP] [-v var=val] 'PROGRAMME' [FICHIER]...
Traitement de texte par champs.
  $0 ligne entière, $1 $2 ... champs, NR numéro de ligne, NF nombre de champs
  Exemples :
    awk '{print $1}' fichier
    awk -F';' '{print $2, $3}' ventes.csv
    awk 'NR>1 && $3>10 {print $1}' fichier
    awk 'END {print NR}' fichier`;
CMDS.awk = async (ctx, args) => {
  const g = getopt(args, {known:'Fv', value:'Fv'});
  if(g.error) return usageErr(ctx, 'awk', g.error);
  let fs = g.opts.F || null;
  if(fs === '\\t') fs = '\t';
  const vars = {};
  if(g.opts.v){ const m = /^([^=]+)=(.*)$/.exec(g.opts.v); if(m) vars[m[1]] = m[2]; }
  if(!g.rest.length) return usageErr(ctx, 'awk', 'programme manquant');
  const prog = g.rest[0];
  const files = g.rest.slice(1);
  const rules = [];
  {
    let i = 0;
    while(i < prog.length){
      while(i < prog.length && /[\s;]/.test(prog[i])) i++;
      if(i >= prog.length) break;
      let pat = '';
      while(i < prog.length && prog[i] !== '{'){
        if(prog[i] === '"'){ pat += prog[i++]; while(i < prog.length && prog[i] !== '"') pat += prog[i++]; pat += prog[i++]; continue; }
        if(prog[i] === '/'){ pat += prog[i++]; while(i < prog.length && prog[i] !== '/') pat += prog[i++]; pat += prog[i++]; continue; }
        pat += prog[i++];
      }
      let act = null;
      if(prog[i] === '{'){
        let depth = 0, body = '';
        for(; i < prog.length; i++){
          if(prog[i] === '{'){ depth++; if(depth === 1) continue; }
          if(prog[i] === '}'){ depth--; if(depth === 0){ i++; break; } }
          body += prog[i];
        }
        act = body;
      }
      rules.push({pat:pat.trim(), act});
    }
  }
  const inp = inputText(ctx, files, 'awk');
  const list = inp.files || [{name:null, text:inp.text}];
  let nr = 0;
  const runAction = (act, rec) => {
    if(act == null){ ctx.out(rec.line + '\n'); return; }
    for(const stmtRaw of act.split(';')){
      const stmt = stmtRaw.trim();
      if(!stmt) continue;
      const mp = /^print\b(.*)$/.exec(stmt);
      if(mp){
        const rest = mp[1].trim();
        if(!rest){ ctx.out(rec.line + '\n'); continue; }
        const parts = splitArgsAwk(rest).map(p => String(awkEval(p.trim(), rec)));
        ctx.out(parts.join(rec.vars.OFS || ' ') + '\n');
        continue;
      }
      const mpf = /^printf\s+(.*)$/.exec(stmt);
      if(mpf){
        const parts = splitArgsAwk(mpf[1]).map(p => awkEval(p.trim(), rec));
        let fmt = String(parts.shift() || '');
        let ai = 0;
        fmt = fmt.replace(/\\n/g,'\n').replace(/\\t/g,'\t')
          .replace(/%(-?\d+)?(\.\d+)?([sdif])/g, (m,w,pr,cv)=>{
            let v = parts[ai++];
            if(cv === 'd' || cv === 'i') v = String(Math.trunc(parseFloat(v)||0));
            else if(cv === 'f') v = (parseFloat(v)||0).toFixed(pr ? parseInt(pr.slice(1),10) : 6);
            else v = String(v == null ? '' : v);
            if(w){ const n2 = parseInt(w,10); v = n2 < 0 ? v.padEnd(-n2,' ') : v.padStart(n2,' '); }
            return v;
          });
        ctx.out(fmt);
        continue;
      }
      awkEval(stmt, rec);
    }
  };
  const mkRec = (line, filename) => ({
    line, nr,
    fields: fs === null ? (line.trim() === '' ? [] : line.trim().split(/\s+/)) : line.split(fs),
    vars, fs: fs || ' ', filename
  });
  for(const r of rules) if(r.pat === 'BEGIN') runAction(r.act, mkRec('', null));
  for(const f of list){
    for(const line of lines(f.text)){
      nr++;
      const rec = mkRec(line, f.name);
      for(const r of rules){
        if(r.pat === 'BEGIN' || r.pat === 'END') continue;
        if(r.pat === '' || truthy(awkEval(r.pat, rec))) runAction(r.act, rec);
      }
    }
  }
  for(const r of rules) if(r.pat === 'END') runAction(r.act, mkRec('', null));
  return inp.code;
};

HELP.tr = "tr [-d] [-s] ENS1 [ENS2] — remplace ou supprime des caractères.";
CMDS.tr = async (ctx, args) => {
  const g = getopt(args, {known:'dsc'});
  if(g.error) return usageErr(ctx, 'tr', g.error);
  const expand = (s) => {
    let out = '';
    for(let i=0;i<s.length;i++){
      if(s[i+1] === '-' && s[i+2]){
        for(let c = s.charCodeAt(i); c <= s.charCodeAt(i+2); c++) out += String.fromCharCode(c);
        i += 2;
      } else if(s.startsWith('[:alpha:]', i)){ out += 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'; i += 8; }
      else if(s.startsWith('[:digit:]', i)){ out += '0123456789'; i += 8; }
      else if(s.startsWith('[:space:]', i)){ out += ' \t\n'; i += 8; }
      else if(s.startsWith('[:upper:]', i)){ out += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; i += 8; }
      else if(s.startsWith('[:lower:]', i)){ out += 'abcdefghijklmnopqrstuvwxyz'; i += 8; }
      else out += s[i];
    }
    return out;
  };
  const a = expand(g.rest[0] || '');
  const b = expand(g.rest[1] || '');
  let text = ctx.stdin || '';
  if(g.opts.d) text = [...text].filter(c => !a.includes(c)).join('');
  else if(a && b) text = [...text].map(c => { const i = a.indexOf(c); return i >= 0 ? (b[i] || b[b.length-1]) : c; }).join('');
  if(g.opts.s) text = text.replace(new RegExp('([' + (b||a).replace(/[.*+?^${}()|[\]\\-]/g,'\\$&') + '])\\1+','g'), '$1');
  ctx.out(text);
  return 0;
};

HELP.cut = "cut -d SEP -f LISTE [FICHIER] — extrait des colonnes.\n  -c LISTE  extrait par position de caractères";
CMDS.cut = async (ctx, args) => {
  const g = getopt(args, {known:'dfc', value:'dfc'});
  if(g.error) return usageErr(ctx, 'cut', g.error);
  const sep = g.opts.d || '\t';
  const inp = inputText(ctx, g.rest, 'cut');
  const list = inp.files || [{name:null, text:inp.text}];
  const spec = g.opts.f || g.opts.c;
  if(!spec) return usageErr(ctx, 'cut', 'vous devez indiquer une liste de champs ou de caractères');
  const wanted = [];
  for(const p of String(spec).split(',')){
    const m = /^(\d*)-(\d*)$/.exec(p);
    if(m){ const a = parseInt(m[1]||'1',10), b = parseInt(m[2]||'999',10); for(let k=a;k<=b;k++) wanted.push(k); }
    else wanted.push(parseInt(p,10));
  }
  const out = [];
  for(const f of list){
    for(const l of lines(f.text)){
      if(g.opts.c) out.push(wanted.map(k=>l[k-1]||'').join(''));
      else { const parts = l.split(sep); out.push(wanted.map(k=>parts[k-1]).filter(x=>x!==undefined).join(sep)); }
    }
  }
  if(out.length) ctx.out(out.join('\n') + '\n');
  return inp.code;
};

HELP.xargs = "xargs [-n N] [-I REMPL] COMMANDE — construit des commandes à partir de l'entrée standard.";
CMDS.xargs = async (ctx, args) => {
  const g = getopt(args, {known:'nI0dr', value:'nId'});
  if(g.error) return usageErr(ctx, 'xargs', g.error);
  const items = (ctx.stdin || '').split(/\s+/).filter(Boolean);
  const cmd = g.rest.length ? g.rest : ['echo'];
  let code = 0;
  if(g.opts.I){
    for(const it of items){
      const line = cmd.map(c => c.split(g.opts.I).join(it)).map(shellQuote).join(' ');
      code = await execNode(parse(line), {stdin:'', out:ctx.out, err:ctx.err, depth:(ctx.depth||0)+1});
    }
    return code;
  }
  const n = g.opts.n ? parseInt(g.opts.n,10) : items.length || 1;
  for(let i=0; i<items.length || i === 0; i += n){
    const batch = items.slice(i, i+n);
    if(!batch.length && i > 0) break;
    const line = cmd.map(shellQuote).join(' ') + (batch.length ? ' ' + batch.map(shellQuote).join(' ') : '');
    code = await execNode(parse(line), {stdin:'', out:ctx.out, err:ctx.err, depth:(ctx.depth||0)+1});
    if(!items.length) break;
  }
  return code;
};

/* ---------------- tar / gzip ---------------- */
HELP.tar = `tar [-c|-x|-t] -f ARCHIVE [FICHIER]...
Archivage de fichiers.
  -c  crée une archive        -x  extrait une archive
  -t  liste le contenu        -f  nom de l'archive (obligatoire)
  -v  mode détaillé           -z  compression gzip (.tar.gz)
Exemples :
  tar -cvf sauvegarde.tar dossier/
  tar -tf sauvegarde.tar
  tar -xvf sauvegarde.tar`;
CMDS.tar = async (ctx, args) => {
  const g = getopt(args, {known:'cxtvfzjC', value:'fC'});
  if(g.error) return usageErr(ctx, 'tar', g.error);
  const o = g.opts;
  if(!o.f) { ctx.err('tar: Refus de lire une archive depuis le terminal\ntar: Erreur fatale, arrêt immédiat\n'); return 2; }
  const archive = o.f;
  if(o.c){
    const entries = [];
    let code = 0;
    const archivePath = absPath(archive);       /* -f est relatif au dossier de départ */
    const savedCwd = state.cwd;
    if(o.C){
      const d = lookup(o.C);
      if(d.err || d.node.type !== 'dir'){
        ctx.err(`tar: ${o.C} : Impossible de changer de répertoire : Aucun fichier ou dossier de ce type\ntar: Erreur fatale, arrêt immédiat\n`);
        return 2;
      }
      state.cwd = d.path;
    }
    const walk = (p) => {
      const r = lookup(p);
      if(r.err){ ctx.err(`tar: ${p}: Impossible d'ouvrir: Aucun fichier ou dossier de ce type\n`); code = 2; return; }
      const rel = p.replace(/^\//,'').replace(/^\.\//,'');
      if(r.node.type === 'dir'){
        entries.push({p:rel + '/', t:'d', m:r.node.mode, c:''});
        if(o.v) ctx.out(rel + '/\n');
        for(const k of Object.keys(r.node.children).sort()) walk((p === '/' ? '' : p) + '/' + k);
      } else {
        entries.push({p:rel, t:'f', m:r.node.mode, c:r.node.content});
        if(o.v) ctx.out(rel + '\n');
      }
    };
    try{ for(const p of g.rest) walk(p); }
    finally{ state.cwd = savedCwd; }
    const blob = 'TARSIM1\n' + JSON.stringify(entries);
    const w = writeFile(archivePath, blob, false);
    if(w.err){ ctx.err(`tar: ${archive}: ${w.err}\n`); return 2; }
    if(w.node){ w.node.tar = true; if(o.z) w.node.gz = true; }
    if(code) ctx.err("tar: Arrêt avec code d'erreur à cause des erreurs précédentes\n");
    return code;
  }
  const rf = readFile(archive);
  if(rf.err){ ctx.err(`tar: ${archive}: Impossible d'ouvrir: Aucun fichier ou dossier de ce type\ntar: Erreur fatale, arrêt immédiat\n`); return 2; }
  if(!rf.content.startsWith('TARSIM1')){ ctx.err(`tar: Ceci ne ressemble pas à une archive tar\n`); return 2; }
  let entries;
  try{ entries = JSON.parse(rf.content.slice(8)); }catch(e){ ctx.err('tar: archive corrompue\n'); return 2; }
  if(o.t){ ctx.out(entries.map(e=>e.p).join('\n') + '\n'); return 0; }
  if(o.x){
    const base = o.C ? absPath(o.C) : state.cwd;
    for(const e of entries){
      const target = base + '/' + e.p.replace(/\/$/,'');
      if(e.t === 'd'){
        await CMDS.mkdir({out:()=>{},err:()=>{},stdin:''}, ['-p', target]);
      } else {
        await CMDS.mkdir({out:()=>{},err:()=>{},stdin:''}, ['-p', dirnameOf(target)]);
        const w = writeFile(target, e.c, false);
        if(w.node) w.node.mode = e.m;
      }
      if(o.v) ctx.out(e.p + '\n');
    }
    return 0;
  }
  return usageErr(ctx, 'tar', 'vous devez indiquer une des options -c, -x ou -t');
};

HELP.gzip = "gzip FICHIER — compresse un fichier (ajoute .gz).\n  -d  décompresse (équivaut à gunzip)\n  -l  affiche le taux de compression";
CMDS.gzip = async (ctx, args) => {
  const g = getopt(args, {known:'dklrvf9'});
  if(g.error) return usageErr(ctx, 'gzip', g.error);
  if(!g.rest.length) return usageErr(ctx, 'gzip', 'opérande manquant');
  let code = 0;
  for(const f of g.rest){
    const r = lookup(f);
    if(r.err){ ctx.err(`gzip: ${f}: Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    if(g.opts.d){
      if(!f.endsWith('.gz')){ ctx.err(`gzip: ${f}: suffixe inconnu -- ignoré\n`); code = 1; continue; }
      const par = lookup(dirnameOf(f));
      const newName = basenameOf(f).replace(/\.gz$/,'');
      delete r.node.gz;
      par.node.children[newName] = r.node;
      delete par.node.children[basenameOf(f)];
      if(g.opts.v) ctx.out(`${f}:\t décompressé vers ${newName}\n`);
      continue;
    }
    if(f.endsWith('.gz')){ ctx.err(`gzip: ${f} porte déjà le suffixe .gz -- ignoré\n`); code = 1; continue; }
    const par = lookup(dirnameOf(f));
    r.node.gz = true;
    par.node.children[basenameOf(f) + '.gz'] = r.node;
    delete par.node.children[basenameOf(f)];
    if(g.opts.v) ctx.out(`${f}:\t 62.3% -- remplacé par ${f}.gz\n`);
  }
  return code;
};
CMDS.gunzip = async (ctx, args) => CMDS.gzip(ctx, ['-d'].concat(args));

  return 0;
};

CMDS.id = async (ctx, args) => {
  const g = getopt(args, {known:'ugGnr'});
  if(g.error) return usageErr(ctx, 'id', g.error);
  const who = g.rest[0] || state.user;
  const u = USERS[who];
  if(!u){ ctx.err(`id: « ${who} » : utilisateur inexistant\n`); return 1; }
  const grps = u.groups;
  if(g.opts.u) { ctx.out((g.opts.n ? who : u.uid) + '\n'); return 0; }
  if(g.opts.g) { ctx.out((g.opts.n ? grps[0] : u.gid) + '\n'); return 0; }
  if(g.opts.G) { ctx.out(grps.map(x => g.opts.n ? x : gidOf(x)).join(' ') + '\n'); return 0; }
  ctx.out(`uid=${u.uid}(${who}) gid=${u.gid}(${grps[0]}) groupes=${grps.map(x=>`${gidOf(x)}(${x})`).join(',')}\n`);
  return 0;
};
function gidOf(name){
  const map = {root:0, daemon:1, bin:2, adm:4, cdrom:24, sudo:27, 'www-data':33, plugdev:46, lpadmin:120, lxd:121, user:1000};
  return map[name] == null ? 1000 : map[name];
}

HELP.snap = `snap SOUS-COMMANDE — paquets universels, spécifiques à Ubuntu.
  list              snaps installés          find MOTIF   cherche dans le magasin
  install NOM       installe (sudo requis)   remove NOM   désinstalle (sudo requis)
  info NOM          détails d'un snap        refresh      met à jour
  version           versions des composants
Un snap embarque ses dépendances : plus lourd qu'un paquet apt, mais isolé
du reste du système et mis à jour automatiquement.`;
CMDS.snap = async (ctx, args) => {
  const sn = state.snaps;
  const sub = args[0];
  const names = args.slice(1).filter(a => !a.startsWith('-'));
  if(!sub || sub === 'help'){
    ctx.out('Usage : snap <commande> [<options>...]\n\nCommandes courantes : list, find, install, remove, info, refresh, version\n');
    return sub ? 0 : 1;
  }
  if(sub === 'version'){
    ctx.out(`snap    2.72\nsnapd   2.72\nseries  16\nubuntu  26.04\nkernel  7.0.0-8-generic\n`);
    return 0;
  }
  if(sub === 'list'){
    ctx.out('Nom' .padEnd(20,' ') + 'Version'.padEnd(12,' ') + 'Rév.'.padEnd(8,' ') + 'Suivi'.padEnd(30,' ') + 'Éditeur'.padEnd(14,' ') + 'Notes\n');
    for(const k of Object.keys(sn.installed).sort()){
      const s = sn.installed[k];
      ctx.out(k.padEnd(20,' ') + s.version.padEnd(12,' ') + s.rev.padEnd(8,' ') + s.tracking.padEnd(30,' ') + s.publisher.padEnd(14,' ') + s.notes + '\n');
    }
    return 0;
  }
  if(sub === 'find' || sub === 'search'){
    const q = (names[0] || '').toLowerCase();
    const all = Object.assign({}, sn.available);
    for(const k of Object.keys(sn.installed)) if(!all[k]) all[k] = {version:sn.installed[k].version, publisher:sn.installed[k].publisher, summary:'installé sur ce système'};
    const hits = Object.keys(all).filter(k => k.toLowerCase().includes(q)).sort();
    if(!hits.length){ ctx.err(`Aucun paquet correspondant ne contient « ${names[0] || ''} »\n`); return 1; }
    ctx.out('Nom'.padEnd(18,' ') + 'Version'.padEnd(12,' ') + 'Éditeur'.padEnd(16,' ') + 'Notes'.padEnd(8,' ') + 'Résumé\n');
    for(const h of hits) ctx.out(h.padEnd(18,' ') + all[h].version.padEnd(12,' ') + all[h].publisher.padEnd(16,' ') + '-'.padEnd(8,' ') + all[h].summary + '\n');
    return 0;
  }
  if(sub === 'info'){
    const n = names[0];
    const s = sn.installed[n] || sn.available[n];
    if(!s){ ctx.err(`erreur : le snap « ${n} » est introuvable\n`); return 1; }
    ctx.out(`name:      ${n}\nsummary:   ${s.summary || 'paquet snap'}\npublisher: ${s.publisher}\nlicense:   unset\nsnap-id:   ${Math.random().toString(36).slice(2,18)}\n` +
            (sn.installed[n] ? `installed: ${s.version} (${s.rev}) 142MB -\n` : `channels:\n  latest/stable: ${s.version}\n`));
    return 0;
  }
  if(sub === 'install' || sub === 'remove' || sub === 'refresh'){
    if(state.user !== 'root'){
      ctx.err(`erreur : accès refusé (essayez avec sudo)\n`);
      return 1;
    }
    if(sub === 'refresh'){ ctx.out('Tous les snaps sont à jour.\n'); return 0; }
    let code = 0;
    for(const n of names){
      if(sub === 'install'){
        if(sn.installed[n]){ ctx.out(`snap « ${n} » est déjà installé, voyez « snap help refresh »\n`); continue; }
        const a = sn.available[n];
        if(!a){ ctx.err(`erreur : le snap « ${n} » est introuvable dans le magasin\n`); code = 1; continue; }
        ctx.out(`Téléchargement de ${n}\n`);
        if(state.io.sleep) await state.io.sleep(300);
        ctx.out(`Extraction de ${n}\nMontage de ${n}\n`);
        if(state.io.sleep) await state.io.sleep(200);
        sn.installed[n] = {version:a.version, rev:String(1000 + Math.floor(Math.random()*900)), tracking:'latest/stable', publisher:a.publisher, notes:'-'};
        delete sn.available[n];
        ctx.out(`${n} ${sn.installed[n].version} de ${sn.installed[n].publisher} installé\n`);
      } else {
        if(!sn.installed[n]){ ctx.err(`snap « ${n} » n'est pas installé\n`); code = 1; continue; }
        ctx.out(`Suppression de ${n}\n`);
        if(state.io.sleep) await state.io.sleep(250);
        sn.available[n] = {version:sn.installed[n].version, publisher:sn.installed[n].publisher, summary:'paquet snap'};
        delete sn.installed[n];
        ctx.out(`${n} supprimé\n`);
      }
    }
    return code;
  }
  ctx.err(`erreur : commande « ${sub} » inconnue, voyez « snap help »\n`);
  return 1;
};

HELP.free = "free [-h] [-m] — affiche l'utilisation de la mémoire.\n  -h  lisible par un humain   -m  en mégaoctets   -g  en gigaoctets";
CMDS.free = async (ctx, args) => {
  const g = getopt(args, {known:'hmgbkts', longs:['human','mega','help']});
  if(g.error) return usageErr(ctx, 'free', g.error);
  const o = g.opts;
  const totalK = 4014080, usedK = 986420, freeK = 1240300, sharedK = 22160, buffK = 1787360, availK = 2764900;
  const swapT = 2097148, swapU = 0, swapF = 2097148;
  const conv = (k) => {
    if(o.h || o['--human']) return humanSize(k*1024).replace(/([KMGT])$/,'$1i');
    if(o.m) return String(Math.round(k/1024));
    if(o.g) return String(Math.round(k/1048576));
    if(o.b) return String(k*1024);

  };
  const pad = (s) => String(s).padStart(11,' ');
  ctx.out(

Mem :   ${pad(conv(totalK))} ${pad(conv(usedK))} ${pad(conv(freeK))} ${pad(conv(sharedK))} ${pad(conv(buffK))} ${pad(conv(availK))}
Partition d'échange : ${pad(conv(swapT))} ${pad(conv(swapU))} ${pad(conv(swapF))}

HELP.date = "date [+FORMAT] — affiche la date et l'heure.\n  Formats : %Y année, %m mois, %d jour, %H heures, %M minutes, %S secondes,\n            %F = %Y-%m-%d, %T = %H:%M:%S, %s horodatage Unix";
CMDS.date = async (ctx, args) => {
  const d = now();
  const fmtArg = args.find(a => a.startsWith('+'));
  const p2 = (x) => String(x).padStart(2,'0');
  if(fmtArg){
    const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const out = fmtArg.slice(1)
      .replace(/%F/g, `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`)
      .replace(/%T/g, `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`)
      .replace(/%Y/g, String(d.getFullYear()))
      .replace(/%y/g, String(d.getFullYear()).slice(2))
      .replace(/%m/g, p2(d.getMonth()+1))
      .replace(/%d/g, p2(d.getDate()))
      .replace(/%H/g, p2(d.getHours()))
      .replace(/%M/g, p2(d.getMinutes()))
      .replace(/%S/g, p2(d.getSeconds()))
      .replace(/%s/g, String(Math.floor(d.getTime()/1000)))
      .replace(/%A/g, JOURS[d.getDay()])
      .replace(/%B/g, MOIS[d.getMonth()])
      .replace(/%j/g, String(Math.ceil((d - new Date(d.getFullYear(),0,0))/86400000)))
      .replace(/%n/g, '\n').replace(/%%/g,'%');
    ctx.out(out + '\n');
    return 0;
  }
  ctx.out(d.toString().replace(/GMT.*$/,'CEST ' + d.getFullYear()) + '\n');
  return 0;
};

HELP.pgrep = "pgrep MOTIF — affiche les PID des processus dont le nom correspond.\n  -l  affiche aussi le nom   -a  affiche la ligne de commande complète";

  let re;

};

HELP.kill = "kill [-SIGNAL] PID... — envoie un signal à un processus.\n  -9 / -KILL  arrêt immédiat   -15 / -TERM  arrêt propre (défaut)\n  -l  liste les signaux\n  %N  désigne le job numéro N";
CMDS.kill = async (ctx, args) => {
  if(args[0] === '-l'){
    ctx.out(' 1) SIGHUP\t 2) SIGINT\t 3) SIGQUIT\t 9) SIGKILL\n15) SIGTERM\t18) SIGCONT\t19) SIGSTOP\n');
    return 0;
  }
  let sig = 'TERM';
  const targets = [];
  for(const a of args){
    if(a.startsWith('-')){ sig = a.replace(/^-/,'').replace(/^SIG/,''); continue; }
    targets.push(a);
  }
  if(!targets.length) return usageErr(ctx, 'kill', 'PID manquant');
  let code = 0;
  for(const t of targets){
    if(t.startsWith('%')){
      const j = state.jobs[parseInt(t.slice(1),10)-1];
      if(!j){ ctx.err(`bash: kill: ${t}: aucune tâche de ce type\n`); code = 1; continue; }
      j.cancel = true; j.status = 'killed';
      state.procs = state.procs.filter(p=>p.pid !== j.pid);
      ctx.out(`[${j.id}]+  Terminé (signal ${sig})     ${j.cmd}\n`);
      continue;
    }
    const pid = parseInt(t,10);
    const proc = state.procs.find(p=>p.pid === pid);
    if(!proc){ ctx.err(`kill: (${t}) - Aucun processus de ce type\n`); code = 1; continue; }
    if(proc.user !== state.user && state.user !== 'root'){ ctx.err(`kill: (${t}) - Opération non permise\n`); code = 1; continue; }
    if(pid === 1){ ctx.err('kill: (1) - Opération non permise\n'); code = 1; continue; }
    state.procs = state.procs.filter(p=>p.pid !== pid);
    const j = state.jobs.find(x=>x.pid === pid);
    if(j){ j.cancel = true; j.status = 'killed'; }
  }
  return code;
};
CMDS.pkill = async (ctx, args) => {
  const g = getopt(args, {known:'lafu9', value:'u'});
  if(g.error) return usageErr(ctx, 'pkill', g.error);
  const pat = g.rest[0];
  if(!pat) return usageErr(ctx, 'pkill', 'motif manquant');
  const re = new RegExp(pat);
  const hits = state.procs.filter(p => re.test(p.cmd) && p.pid !== 1);
  if(!hits.length) return 1;
  for(const p of hits){
    if(p.user !== state.user && state.user !== 'root') continue;
    state.procs = state.procs.filter(x=>x.pid !== p.pid);
  }
  return 0;
};

HELP.chmod = `chmod [-R] MODE FICHIER...
Modifie les droits d'accès.
  Numérique : chmod 644 fichier   (4=lecture, 2=écriture, 1=exécution)
  Symbolique : chmod u+x, g-w, o=r, a+r, ug+rw
  -R  applique récursivement
  -v  détaille les modifications`;
CMDS.chmod = async (ctx, args) => {
  const g = getopt(args, {known:'Rvcf', longs:['recursive','verbose','help']});
  if(g.error) return usageErr(ctx, 'chmod', g.error);
  if(g.rest.length < 2) return usageErr(ctx, 'chmod', 'opérande manquant');
  const spec = g.rest[0];
  const files = g.rest.slice(1);
  const applySpec = (mode, node) => {
    if(/^[0-7]{3,4}$/.test(spec)) return parseInt(spec, 8) & 0o7777;
    let m = mode;
    for(const clause of spec.split(',')){
      const mm = /^([ugoa]*)([+\-=])([rwxXst]*)$/.exec(clause);
      if(!mm) return null;
      let who = mm[1] || 'a';
      if(who === 'a') who = 'ugo';
      const op = mm[2];
      let bits = 0;
      if(mm[3].includes('r')) bits |= 4;
      if(mm[3].includes('w')) bits |= 2;
      if(mm[3].includes('x')) bits |= 1;
      if(mm[3].includes('X') && (node.type === 'dir' || (mode & 0o111))) bits |= 1;
      for(const w of who){
        const shift = w === 'u' ? 6 : w === 'g' ? 3 : 0;
        if(op === '+') m |= (bits << shift);
        else if(op === '-') m &= ~(bits << shift);
        else { m &= ~(7 << shift); m |= (bits << shift); }
      }
    }
    return m;
  };
  let code = 0;
  const apply = (path, node) => {
    if(node.owner !== state.user && state.user !== 'root'){
      ctx.err(`chmod: impossible d'accéder à '${path}': Opération non permise\n`); code = 1; return;
    }
    const nm = applySpec(node.mode & 0o7777, node);
    if(nm === null){ ctx.err(`chmod: mode non valide : « ${spec} »\n`); code = 1; return; }
    const old = node.mode;
    node.mode = nm;
    if(g.opts.v || g.opts['--verbose']){
      ctx.out(`le mode de '${path}' a été modifié de ${(old&0o777).toString(8).padStart(4,'0')} (${modeString({type:'file',mode:old}).slice(1)}) à ${(nm&0o777).toString(8).padStart(4,'0')} (${modeString({type:'file',mode:nm}).slice(1)})\n`);
    }
    if((g.opts.R || g.opts['--recursive']) && node.type === 'dir'){
      for(const k of Object.keys(node.children)) apply(path + '/' + k, node.children[k]);
    }
  };
  for(const f of files){
    const r = lookup(f);
    if(r.err){ ctx.err(`chmod: impossible d'accéder à '${f}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    apply(f, r.node);
  }
  return code;
};

HELP.chown = "chown [-R] UTILISATEUR[:GROUPE] FICHIER... — change le propriétaire (réservé à root).";
CMDS.chown = async (ctx, args) => {
  const g = getopt(args, {known:'Rvcfh', longs:['recursive','verbose','help']});
  if(g.error) return usageErr(ctx, 'chown', g.error);
  if(g.rest.length < 2) return usageErr(ctx, 'chown', 'opérande manquant');
  if(state.user !== 'root'){ ctx.err(`chown: modification du propriétaire de '${g.rest[1]}': Opération non permise\n`); return 1; }
  const [ownerSpec, ...files] = g.rest;
  const [ow, gr] = ownerSpec.split(':');
  if(ow && !USERS[ow] && !['www-data','daemon','nobody','bin'].includes(ow)){
    ctx.err(`chown: utilisateur non valide : « ${ownerSpec} »\n`); return 1;
  }
  let code = 0;
  const apply = (path, node) => {
    if(ow) node.owner = ow;
    if(gr) node.group = gr;
    if(g.opts.v) ctx.out(`le propriétaire de '${path}' a été modifié en ${ow}${gr?':'+gr:''}\n`);
    if((g.opts.R || g.opts['--recursive']) && node.type === 'dir'){
      for(const k of Object.keys(node.children)) apply(path + '/' + k, node.children[k]);
    }
  };
  for(const f of files){
    const r = lookup(f);
    if(r.err){ ctx.err(`chown: impossible d'accéder à '${f}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    apply(f, r.node);
  }
  return code;
};

  const apply = (path, node) => {

    node.group = grp;
    if(g.opts.R && node.type === 'dir') for(const k of Object.keys(node.children)) apply(path + '/' + k, node.children[k]);
  };
  for(const f of files){
    const r = lookup(f);
    if(r.err){ ctx.err(`chgrp: impossible d'accéder à '${f}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    apply(f, r.node);
  }
  return code;
};

HELP.umask = "umask [-S] [MASQUE] — affiche ou définit le masque de création de fichiers.\n  Le masque retire des droits aux fichiers créés ensuite :\n  fichiers 666 et dossiers 777, moins le masque.\n  -S  affichage symbolique (u=rwx,g=rx,o=rx)";
CMDS.umask = async (ctx, args) => {
  const g = getopt(args, {known:'Sp', longs:['help']});
  if(g.error) return usageErr(ctx, 'umask', g.error);
  if(!g.rest.length){
    if(g.opts.S){
      const parts = [];
      for(const [who, sh] of [['u',6],['g',3],['o',0]]){
        const b = 7 & ~((state.umask >> sh) & 7);
        parts.push(who + '=' + (b&4?'r':'') + (b&2?'w':'') + (b&1?'x':''));
      }
      ctx.out(parts.join(',') + '\n');
    } else {
      ctx.out((g.opts.p ? 'umask ' : '') + (state.umask & 0o777).toString(8).padStart(4,'0') + '\n');
    }
    return 0;
  }
  const spec = g.rest[0];
  if(/^[0-7]{1,4}$/.test(spec)){ state.umask = parseInt(spec, 8) & 0o777; return 0; }
  ctx.err(`bash: umask: ${spec} : nombre octal non valable\n`);
  return 1;
};

/* ---------------- sudo / su ---------------- */
HELP.sudo = `sudo COMMANDE — exécute une commande en tant que superutilisateur (root).
  -u UTILISATEUR  exécute en tant qu'un autre utilisateur
  -l              liste les droits sudo
  -k              oublie l'authentification mémorisée
Dans ce simulateur, l'utilisateur « user » appartient au groupe sudo.`;
CMDS.sudo = async (ctx, args) => {
  if(!args.length) return usageErr(ctx, 'sudo', 'commande manquante');
  /* sudo n'interprète que ses propres options : l'analyse s'arrête au premier
     argument qui n'en est pas une, tout le reste appartient à la commande appelée.
     Sans cela, « sudo apt install -y » verrait -y comme une option de sudo. */
  let i = 0, target = 'root', listOnly = false, forget = false, shellFlag = false;
  while(i < args.length){
    const a = args[i];
    if(a === '--'){ i++; break; }
    if(a === '-' || a[0] !== '-') break;
    if(a === '-u' || a === '--user'){
      if(args[i+1] === undefined) return usageErr(ctx, 'sudo', "l'option requiert un argument -- « u »");
      target = args[i+1]; i += 2; continue;
    }
    if(a.startsWith('-u') && a.length > 2){ target = a.slice(2); i++; continue; }
    if(a === '-l' || a === '--list'){ listOnly = true; i++; continue; }
    if(a === '-k' || a === '-K'){ forget = true; i++; continue; }
    if(a === '-i' || a === '-s'){ shellFlag = true; i++; continue; }
    if(/^-[HEnSbvA]+$/.test(a)){ i++; continue; }
    ctx.err(`sudo : option non valable -- « ${a.replace(/^-+/,'')} »\nusage : sudo [-u UTILISATEUR] COMMANDE [ARGUMENT]...\n`);
    return 1;
  }
  const rest = args.slice(i);
  if(forget){ state.sudoUntil = 0; if(!rest.length) return 0; }
  if(listOnly){
    ctx.out(`Entrées par défaut pour ${state.loginUser} sur ${state.host} :\n    env_reset, mail_badpass\n\nL'utilisateur ${state.loginUser} peut utiliser les commandes suivantes sur ${state.host} :\n    (ALL : ALL) ALL\n`);
    return 0;
  }
  if(!USERS[state.loginUser].groups.includes('sudo')){
    ctx.err(`${state.loginUser} n'apparaît pas dans le fichier sudoers. Cet incident sera rapporté.\n`);
    return 1;
  }
  if(!USERS[target]){ ctx.err(`sudo: utilisateur inconnu : ${target}\n`); return 1; }
  if(!rest.length && !shellFlag) return usageErr(ctx, 'sudo', 'commande manquante');
  /* authentification simulée, mémorisée quelques minutes */
  if(Date.now() > state.sudoUntil && state.io.ask){
    if(!state.sudoUntil){
      ctx.out('Nous espérons que vous avez reçu les instructions habituelles de\nl\'administrateur système local. Cela se résume généralement à ceci :\n\n    #1) Respectez la vie privée des autres.\n    #2) Réfléchissez avant d\'utiliser le clavier.\n    #3) De grands pouvoirs confèrent de grandes responsabilités.\n\n');
    }
    await state.io.ask(`[sudo] Mot de passe de ${state.loginUser} : `, {password:true});
  }
  state.sudoUntil = Date.now() + 15*60*1000;
  if(!rest.length && shellFlag){
    state.user = target; state.loginUser = target;
    state.env.USER = target; state.env.LOGNAME = target; state.env.HOME = USERS[target].home;
    state.cwd = USERS[target].home; state.env.PWD = state.cwd;
    return 0;
  }
  const saved = state.user;
  state.user = target;
  let code;
  try{
    code = await dispatch(rest, ctx);
  } finally { state.user = saved; }
  return code;
};

HELP.su = "su [-] [UTILISATEUR] — change d'utilisateur (root par défaut).";
CMDS.su = async (ctx, args) => {
  const target = args.filter(a=>a !== '-' && a !== '-l')[0] || 'root';

    if(target === 'root' && !USERS[state.loginUser].groups.includes('sudo')){
      ctx.err('su: Échec d\'authentification\n'); return 1;
    }
  }
  state.user = target;
  state.loginUser = target;
  state.env.USER = target; state.env.LOGNAME = target; state.env.HOME = USERS[target].home;
  state.cwd = USERS[target].home;
  state.env.PWD = state.cwd;
  return 0;
};

HELP.passwd = "passwd — change le mot de passe de l'utilisateur (simulé).";

HELP.df = "df [-h] [-T] — affiche l'espace disque utilisé par système de fichiers.\n  -h  tailles lisibles   -T  affiche le type de système de fichiers   -i  inodes";
CMDS.df = async (ctx, args) => {
  const g = getopt(args, {known:'hTia', longs:['human-readable','help']});
  if(g.error) return usageErr(ctx, 'df', g.error);
  const h = g.opts.h || g.opts['--human-readable'];
  const rows = [['Sys. de fichiers'].concat(g.opts.T ? ['Type'] : []).concat(['Taille','Utilisé','Dispo','Uti%','Monté sur'])];
  for(const m of state.mounts){
    const free = m.size - m.used;
    const pct = Math.round(m.used / m.size * 100);
    rows.push([m.dev].concat(g.opts.T ? [m.type] : []).concat([
      h ? humanSize(m.size*1024) : String(m.size),
      h ? humanSize(m.used*1024) : String(m.used),
      h ? humanSize(free*1024) : String(free),
      pct + '%', m.point
    ]));
  }
  const w = rows[0].map((_,i)=>Math.max(...rows.map(r=>String(r[i]).length)));
  for(const r of rows){
    ctx.out(r.map((c,i)=> i === 0 || i === r.length-1 ? String(c).padEnd(w[i],' ') : String(c).padStart(w[i],' ')).join(' ').replace(/\s+$/,'') + '\n');
  }
  return 0;
};

HELP.mount = "mount [PÉRIPHÉRIQUE POINT] — affiche ou effectue les montages (montage réservé à root).";
CMDS.mount = async (ctx, args) => {
  const g = getopt(args, {known:'atovr', value:'to', longs:['help']});
  if(g.error) return usageErr(ctx, 'mount', g.error);
  if(!g.rest.length){
    for(const m of state.mounts) ctx.out(`${m.dev} on ${m.point} type ${m.type} (${m.opts})\n`);
    return 0;
  }
  if(state.user !== 'root'){ ctx.err('mount: seul le superutilisateur peut effectuer cette opération\n'); return 1; }
  if(g.rest.length < 2) return usageErr(ctx, 'mount', 'point de montage manquant');
  const [dev, point] = g.rest;
  if(!isDir(point)){ ctx.err(`mount: point de montage ${point} inexistant\n`); return 32; }
  if(state.mounts.some(m=>m.point === absPath(point))){ ctx.err(`mount: ${point}: déjà monté\n`); return 32; }
  state.mounts.push({dev, point:absPath(point), type:g.opts.t || 'ext4', opts:'rw,relatime', size:1048576, used:0});
  return 0;
};

HELP.umount = "umount POINT — démonte un système de fichiers (réservé à root).";
CMDS.umount = async (ctx, args) => {
  if(!args.length) return usageErr(ctx, 'umount', 'opérande manquant');
  if(state.user !== 'root'){ ctx.err('umount: seul le superutilisateur peut effectuer cette opération\n'); return 1; }
  const p = absPath(args[0]);
  const idx = state.mounts.findIndex(m => m.point === p || m.dev === args[0]);
  if(idx < 0){ ctx.err(`umount: ${args[0]}: n'est pas monté\n`); return 32; }
  if(state.mounts[idx].point === '/'){ ctx.err('umount: /: la cible est occupée\n'); return 32; }
  state.mounts.splice(idx,1);
  return 0;
};

function needRoot(ctx, cmd){
  if(state.user !== 'root'){
    ctx.err(`${cmd} : impossible d'ouvrir le fichier de verrouillage : Permission non accordée\n${cmd} : êtes-vous root ? Essayez « sudo ${cmd} ... »\n`);
    return true;
  }
  return false;
}
async function fakeProgress(ctx, label, steps){
  for(const s of steps){
    ctx.out(s + '\n');
    if(state.io.sleep) await state.io.sleep(90);
  }
}

HELP.apt = `apt SOUS-COMMANDE [PAQUET...]
Gestionnaire de paquets Debian/Ubuntu.
  update            met à jour la liste des paquets disponibles
  upgrade           met à jour les paquets installés
  install PAQUET    installe un paquet
  remove PAQUET     désinstalle un paquet
  purge PAQUET      désinstalle et supprime la configuration
  search MOTIF      recherche un paquet
  show PAQUET       affiche les informations d'un paquet
  list --installed  liste les paquets installés
La plupart de ces opérations nécessitent sudo.`;
CMDS.apt = async (ctx, args) => {
  const pk = state.packages;
  const sub = args[0];
  const names = args.slice(1).filter(a=>!a.startsWith('-'));
  if(!sub){ ctx.err('apt : commande manquante. Essayez « apt --help ».\n'); return 1; }
  switch(sub){
    case 'update': {
      if(needRoot(ctx,'apt')) return 100;
      await fakeProgress(ctx, 'update', [
        'Atteint :1 http://fr.archive.ubuntu.com/ubuntu resolute InRelease',
        'Réception de :2 http://fr.archive.ubuntu.com/ubuntu resolute-updates InRelease [126 kB]',
        'Réception de :3 http://security.ubuntu.com/ubuntu resolute-security InRelease [110 kB]',
        'Réception de :4 http://fr.archive.ubuntu.com/ubuntu resolute-updates/main amd64 Packages [412 kB]',
        '648 ko réceptionnés en 1s (631 ko/s)',
        'Lecture des listes de paquets... Fait',
        'Construction de l\'arbre des dépendances... Fait',
        'Lecture des informations d\'état... Fait'
      ]);
      pk.updated = true;
      const n = Object.keys(pk.available).length;
      ctx.out(`${n} paquets peuvent être mis à jour. Exécutez « apt list --upgradable » pour les voir.\n`);
      return 0;
    }
    case 'upgrade': case 'full-upgrade': case 'dist-upgrade': {
      if(needRoot(ctx,'apt')) return 100;
      ctx.out('Lecture des listes de paquets... Fait\nConstruction de l\'arbre des dépendances... Fait\nLecture des informations d\'état... Fait\nCalcul de la mise à jour... Fait\n0 mis à jour, 0 nouvellement installés, 0 à enlever et 0 non mis à jour.\n');
      return 0;
    }
    case 'install': {
      if(needRoot(ctx,'apt')) return 100;
      if(!names.length){ ctx.err('apt : vous devez indiquer au moins un paquet\n'); return 1; }
      let code = 0;
      for(const p of names){
        if(pk.installed[p]){ ctx.out(`${p} est déjà la version la plus récente (${pk.installed[p]}).\n`); continue; }
        if(!pk.available[p]){ ctx.err(`E: Impossible de trouver le paquet ${p}\n`); code = 100; continue; }
        ctx.out('Lecture des listes de paquets... Fait\nConstruction de l\'arbre des dépendances... Fait\nLecture des informations d\'état... Fait\n');
        ctx.out(`Les NOUVEAUX paquets suivants seront installés :\n  ${p}\n0 mis à jour, 1 nouvellement installés, 0 à enlever et 0 non mis à jour.\n`);
        await fakeProgress(ctx, 'install', [
          `Réception de :1 http://fr.archive.ubuntu.com/ubuntu resolute/universe amd64 ${p} amd64 ${pk.available[p]} [1 204 kB]`,
          `Sélection du paquet ${p} précédemment désélectionné.`,
          `Dépaquetage de ${p} (${pk.available[p]}) ...`,
          `Paramétrage de ${p} (${pk.available[p]}) ...`,
          `Traitement des actions différées (« triggers ») pour man-db (2.11.2-2) ...`
        ]);
        pk.installed[p] = pk.available[p];
        delete pk.available[p];
        if(p === 'docker.io'){ state.docker.installed = true; state.services.docker.enabled = true; }
        if(p === 'nginx') state.services.nginx.enabled = true;
      }
      return code;
    }
    case 'remove': case 'purge': case 'autoremove': {
      if(needRoot(ctx,'apt')) return 100;
      if(sub === 'autoremove'){ ctx.out('Lecture des listes de paquets... Fait\n0 mis à jour, 0 nouvellement installés, 0 à enlever et 0 non mis à jour.\n'); return 0; }
      let code = 0;
      for(const p of names){
        if(!pk.installed[p]){ ctx.err(`E: Impossible de trouver le paquet ${p}\n`); code = 100; continue; }
        ctx.out(`Les paquets suivants seront ENLEVÉS :\n  ${p}\n0 mis à jour, 0 nouvellement installés, 1 à enlever et 0 non mis à jour.\n`);
        await fakeProgress(ctx, 'remove', [`Suppression de ${p} (${pk.installed[p]}) ...`]);
        pk.available[p] = pk.installed[p];
        delete pk.installed[p];
        if(p === 'docker.io') state.docker.installed = false;
      }
      return code;
    }
    case 'search': {
      const q = names[0] || '';
      const all = Object.assign({}, pk.installed, pk.available);
      const hits = Object.keys(all).filter(k => k.includes(q)).sort();
      if(!hits.length) return 0;
      ctx.out('En train de trier... Fait\nRecherche en texte intégral... Fait\n');
      for(const h of hits) ctx.out(`${h}/stable ${all[h]} amd64${pk.installed[h] ? ' [installé]' : ''}\n  Paquet ${h}\n\n`);
      return 0;
    }
    case 'show': {
      const p = names[0];
      const ver = pk.installed[p] || pk.available[p];
      if(!ver){ ctx.err(`E: Impossible de trouver le paquet ${p}\n`); return 100; }
      ctx.out(`Package: ${p}\nVersion: ${ver}\nPriority: optional\nSection: universe/utils\nOrigin: Ubuntu\nMaintainer: Ubuntu Developers <ubuntu-devel-discuss@lists.ubuntu.com>\nInstalled-Size: 1 204 kB\nHomepage: https://packages.ubuntu.com/${p}\nDescription: paquet ${p} (description simulée)\n`);
      return 0;
    }
    case 'list': {
      const inst = args.includes('--installed');
      const upg = args.includes('--upgradable');
      const src = upg ? pk.available : (inst ? pk.installed : Object.assign({}, pk.installed, pk.available));
      ctx.out('En train de lister... Fait\n');
      for(const k of Object.keys(src).sort()) ctx.out(`${k}/stable ${src[k]} amd64${pk.installed[k] ? ' [installé]' : ''}\n`);
      return 0;
    }
    default:
      ctx.err(`E: Commande « ${sub} » non valable\n`);
      return 100;
  }
};

HELP.pacman = "pacman -S|-R|-Syu|-Q|-Ss PAQUET — gestionnaire de paquets Arch Linux.";
CMDS.pacman = async (ctx, args) => {
  const flag = args[0] || '';
  const rest = args.slice(1);
  if(flag.startsWith('-S') && flag.includes('y')) { await CMDS.apt(ctx, ['update']); if(!rest.length) return 0; }
  if(flag.startsWith('-Ss')) return CMDS.apt(ctx, ['search'].concat(rest));
  if(flag.startsWith('-S')) return CMDS.apt(ctx, ['install'].concat(rest));
  if(flag.startsWith('-R')) return CMDS.apt(ctx, ['remove'].concat(rest));
  if(flag.startsWith('-Q')) return CMDS.apt(ctx, ['list','--installed']);
  ctx.err('erreur : aucune opération spécifiée (utilisez -h pour l\'aide)\n');
  return 1;
};

HELP.systemctl = `systemctl SOUS-COMMANDE [SERVICE]
Gestion des services système (systemd).
  status SERVICE     état détaillé          start SERVICE   démarre
  stop SERVICE       arrête                 restart SERVICE redémarre
  enable SERVICE     active au démarrage    disable SERVICE désactive
  is-active SERVICE  code de retour seul    list-units --type=service
Les actions de modification nécessitent sudo.`;
CMDS.systemctl = async (ctx, args) => {
  const sub = args[0];
  let name = (args[1] || '').replace(/\.service$/,'');
  const svcs = state.services;
  if(!sub || sub === 'list-units' || sub === 'list-unit-files'){
    ctx.out('UNIT                 LOAD   ACTIVE   SUB     DESCRIPTION\n');
    for(const k of Object.keys(svcs)){
      const s = svcs[k];
      ctx.out(`${(k+'.service').padEnd(20,' ')} loaded ${(s.active?'active':'inactive').padEnd(8,' ')} ${(s.active?'running':'dead').padEnd(7,' ')} ${s.desc}\n`);
    }
    ctx.out(`\n${Object.keys(svcs).length} unités listées.\n`);
    return 0;
  }
  if(sub === 'daemon-reload' || sub === 'daemon-reexec'){
    if(state.user !== 'root'){ ctx.err('Failed to reload daemon: Access denied\n'); return 1; }
    return 0;
  }
  if(!name){ ctx.err('systemctl : nom d\'unité manquant\n'); return 1; }
  const s = svcs[name];
  if(!s){ ctx.err(`Unit ${name}.service could not be found.\n`); return 4; }
  switch(sub){
    case 'status': {
      const dot = s.active ? '●' : '○';
      ctx.out(`${dot} ${name}.service - ${s.desc}\n`);
      ctx.out(`     Loaded: loaded (/lib/systemd/system/${name}.service; ${s.enabled?'enabled':'disabled'}; preset: enabled)\n`);
      if(s.active){
        ctx.out(`     Active: active (running) depuis ${s.since}\n`);
        ctx.out(`   Main PID: ${s.pid || 1000} (${name})\n      Tasks: 1 (limit: 4653)\n     Memory: 5.2M\n        CPU: 112ms\n     CGroup: /system.slice/${name}.service\n             └─${s.pid || 1000} /usr/sbin/${name}\n`);
      } else {
        ctx.out(`     Active: inactive (dead)\n`);
      }
      return s.active ? 0 : 3;
    }
    case 'is-active': ctx.out((s.active?'active':'inactive') + '\n'); return s.active ? 0 : 3;
    case 'is-enabled': ctx.out((s.enabled?'enabled':'disabled') + '\n'); return s.enabled ? 0 : 1;
    case 'start': case 'stop': case 'restart': case 'reload': case 'enable': case 'disable': {
      if(state.user !== 'root'){
        ctx.err(`Failed to ${sub} ${name}.service: Access denied\nSee system logs and 'systemctl status ${name}.service' for details.\n`);
        return 1;
      }
      if(sub === 'enable'){ s.enabled = true; ctx.out(`Created symlink /etc/systemd/system/multi-user.target.wants/${name}.service → /lib/systemd/system/${name}.service.\n`); return 0; }
      if(sub === 'disable'){ s.enabled = false; ctx.out(`Removed "/etc/systemd/system/multi-user.target.wants/${name}.service".\n`); return 0; }
      if(sub === 'stop'){
        s.active = false;
        state.procs = state.procs.filter(p=>p.pid !== s.pid);
        s.pid = null;
        return 0;
      }
      if(name === 'docker' && !state.docker.installed){
        ctx.err(`Failed to start docker.service: Unit docker.service not found.\nAvez-vous installé le paquet ? Essayez : sudo apt install docker.io\n`);
        return 5;
      }
      s.active = true;
      s.pid = state.nextPid++;
      s.since = 'aujourd\'hui ' + timeString(now()).slice(-5) + ' CEST';
      state.procs.push({pid:s.pid, user:'root', cmd:`/usr/sbin/${name}`, cpu:0.0, mem:0.3, stat:'Ss', tty:'?', time:'00:00:00'});
      return 0;
    }
    default:
      ctx.err(`Unknown command verb ${sub}.\n`);
      return 1;
  }
};
CMDS.service = async (ctx, args) => CMDS.systemctl(ctx, [args[1], args[0]]);

HELP.journalctl = `journalctl [OPTIONS] — consulte les journaux système.
  -u UNITÉ      filtre par service       -n N   N dernières lignes (10 par défaut)
  -f            suit le journal en direct  -r     ordre inverse
  -p err        filtre par priorité        -b     depuis le dernier démarrage
  --since HEURE filtre par date`;
CMDS.journalctl = async (ctx, args) => {
  const g = getopt(args, {known:'unfrpbex', value:'unp', longs:['unit','lines','follow','since','until','no-pager','help','priority']});
  if(g.error) return usageErr(ctx, 'journalctl', g.error);
  const rf = readFile('/var/log/syslog');
  let ls = lines(rf.content || '');
  const auth = readFile('/var/log/auth.log');
  ls = ls.concat(lines(auth.content || ''));
  const unit = g.opts.u || g.opts['--unit'];
  if(unit) ls = ls.filter(l => l.toLowerCase().includes(String(unit).replace(/\.service$/,'').toLowerCase()));
  if(g.opts.p || g.opts['--priority']){
    const p = String(g.opts.p || g.opts['--priority']);
    if(/err/.test(p)) ls = ls.filter(l => /error|fail|échec/i.test(l));
  }
  if(g.opts.r) ls.reverse();
  const n = g.opts.n ? parseInt(g.opts.n,10) : (g.opts['--lines'] ? parseInt(g.opts['--lines'],10) : 0);
  if(n) ls = ls.slice(-n);
  ctx.out('-- Journaux commençant à ' + timeString(state.bootTime) + ' --\n');
  if(ls.length) ctx.out(ls.join('\n') + '\n');
  if(g.opts.f || g.opts['--follow']) ctx.out('-- Suivi du journal en direct (Ctrl+C pour interrompre) --\n');
  return 0;
};

HELP.crontab = `crontab [-l|-e|-r] [FICHIER]
Gère les tâches planifiées de l'utilisateur.
  -l  liste les tâches        -e  ouvre l'éditeur
  -r  supprime tout           FICHIER  installe le contenu d'un fichier
  -   installe ce qui arrive sur l'entrée standard
Exemple : echo "0 3 * * * /home/user/sauvegarde.sh" | crontab -`;
CMDS.crontab = async (ctx, args) => {
  const g = getopt(args, {known:'lreu', value:'u'});
  if(g.error) return usageErr(ctx, 'crontab', g.error);
  if(g.opts.l){
    if(!state.cron.length){ ctx.err(`no crontab for ${state.user}\n`); return 1; }
    ctx.out(state.cron.join('\n') + '\n');
    return 0;
  }
  if(g.opts.r){ state.cron = []; return 0; }
  if(g.opts.e){
    const header = '# Éditez ce fichier pour planifier des tâches.\n# m h  dom mon dow   commande\n';
    const current = header + state.cron.join('\n') + (state.cron.length ? '\n' : '');
    if(state.io.editor){
      const res = await state.io.editor('crontab', current, 'nano');
      if(res == null){ ctx.out('crontab: aucune modification effectuée\n'); return 0; }
      state.cron = lines(res).filter(l => l.trim() && !l.trim().startsWith('#'));
      ctx.out('crontab: installation de la nouvelle crontab\n');
    } else ctx.out('crontab: éditeur indisponible dans ce contexte\n');
    return 0;
  }
  const src = g.rest[0];
  if(src){
    let data;
    if(src === '-') data = ctx.stdin || '';
    else {
      const r = readFile(src);
      if(r.err){ ctx.err(`crontab: ${src}: Aucun fichier ou dossier de ce type\n`); return 1; }
      data = r.content;
    }
    state.cron = lines(data).filter(l => l.trim() && !l.trim().startsWith('#'));
    return 0;
  }
  return usageErr(ctx, 'crontab', 'utilisez -l, -e, -r, un nom de fichier, ou « - » pour lire l\'entrée standard');
};

HELP.ip = "ip [addr|link|route] [show] — affiche la configuration réseau.\n  ip a       adresses    ip link    interfaces\n  ip route   table de routage   -br  format court";
CMDS.ip = async (ctx, args) => {

      return 0;
    }
    ctx.out(
`1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000
    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00
    inet 127.0.0.1/8 scope host lo
       valid_lft forever preferred_lft forever
2: ${n.iface}: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel state ${n.up?'UP':'DOWN'} group default qlen 1000
    link/ether ${n.mac} brd ff:ff:ff:ff:ff:ff
    inet ${n.ip}/${n.mask} brd 192.168.1.255 scope global dynamic ${n.iface}
       valid_lft 84302sec preferred_lft 84302sec
`);
    return 0;
  }
  if(sub.startsWith('l')){
    ctx.out(`1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN mode DEFAULT group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n2: ${n.iface}: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel state ${n.up?'UP':'DOWN'} mode DEFAULT group default qlen 1000\n    link/ether ${n.mac} brd ff:ff:ff:ff:ff:ff\n`);
    return 0;
  }
  if(sub.startsWith('r')){
    ctx.out(`default via ${n.gw} dev ${n.iface} proto dhcp src ${n.ip} metric 100\n192.168.1.0/24 dev ${n.iface} proto kernel scope link src ${n.ip} metric 100\n`);
    return 0;
  }
  ctx.err(`Object "${sub}" is unknown, try "ip help".\n`);
  return 1;
};

const HOSTS = {
  'localhost':'127.0.0.1', '127.0.0.1':'127.0.0.1',
  'simulateur-linux':'192.168.1.42', '192.168.1.1':'192.168.1.1',
  'passerelle':'192.168.1.1', 'serveur':'192.168.1.10', '192.168.1.10':'192.168.1.10',
  '8.8.8.8':'8.8.8.8', '1.1.1.1':'1.1.1.1',
  'archive.ubuntu.com':'185.125.190.83', 'fr.archive.ubuntu.com':'185.125.190.83',
  'security.ubuntu.com':'185.125.190.81', 'example.com':'93.184.216.34'
};
HELP.ping = "ping [-c N] HÔTE — teste la connectivité réseau.\n  -c N  nombre de paquets à envoyer (4 par défaut ici)";
CMDS.ping = async (ctx, args) => {
  const g = getopt(args, {known:'cinWst', value:'ciWst'});
  if(g.error) return usageErr(ctx, 'ping', g.error);
  const host = g.rest[0];
  if(!host) return usageErr(ctx, 'ping', 'destination manquante');
  const ip = HOSTS[host];
  if(!ip){ ctx.err(`ping: ${host}: Nom ou service inconnu\n`); return 2; }
  const count = g.opts.c ? parseInt(g.opts.c,10) : 4;
  ctx.out(`PING ${host} (${ip}) 56(84) bytes of data.\n`);
  let recv = 0;
  const times = [];
  for(let i=1;i<=count;i++){
    if(state.io.sleep) await state.io.sleep(i === 1 ? 120 : 900);
    const t = +(Math.random()*(ip.startsWith('127') ? 0.08 : 14) + (ip.startsWith('127') ? 0.02 : 0.6)).toFixed(3);
    times.push(t); recv++;
    ctx.out(`64 bytes from ${ip}: icmp_seq=${i} ttl=64 time=${t} ms\n`);
  }
  const min = Math.min(...times), max = Math.max(...times);
  const avg = times.reduce((a,b)=>a+b,0)/times.length;
  ctx.out(`\n--- ${host} ping statistics ---\n${count} packets transmitted, ${recv} received, ${Math.round((1-recv/count)*100)}% packet loss, time ${count*1000-100}ms\nrtt min/avg/max/mdev = ${min.toFixed(3)}/${avg.toFixed(3)}/${max.toFixed(3)}/0.412 ms\n`);
  return 0;
};

  'http://localhost/': () => state.services.nginx.active ? (readFile('/var/www/html/index.html').content || '') : null,
