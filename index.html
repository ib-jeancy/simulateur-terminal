<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulateur de terminal Linux</title>
<meta name="description" content="Un terminal Linux complet qui fonctionne entierement dans votre navigateur : aucune installation, aucune machine virtuelle, aucune donnee envoyee.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --fs: 14px;
  --bg: #101010;
  --bg-bar: #171716;
  --amber: #d9a441;
  --hi: #f2c46b;
  --dim: #8b8778;
  --err: #e0664a;
  --warn: #d9b74a;
  --rule: #2b2a20;
}
*{ box-sizing: border-box; }
html, body{ height: 100%; margin: 0; }
body{
  background: var(--bg);
  color: var(--amber);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: var(--fs);
  line-height: 1.45;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
#bar{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: .6rem; flex-wrap: nowrap;
  padding: .3rem .9rem;
  background: var(--bg-bar);
  border-bottom: 1px solid var(--rule);
}
#title{
  font-size: .88em; margin-right: auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.t-who{ color: var(--dim); }
.t-path{ color: var(--amber); }
.tools{ display: flex; gap: .1rem; flex-wrap: wrap; }
.tools button{
  font: inherit; font-size: .82em;
  background: transparent; color: var(--dim);
  border: 0; border-radius: 2px;
  padding: .15rem .5rem; cursor: pointer;
}
.tools button:hover{ color: var(--hi); background: #21201c; }
.tools button:focus-visible{ outline: 2px solid var(--hi); outline-offset: 2px; }

#screen{
  flex: 1 1 auto;
  overflow-y: auto; overflow-x: hidden;
  padding: .8rem .9rem 2rem;
  position: relative;
  scrollbar-color: var(--rule) transparent;
}
#out{ white-space: pre-wrap; overflow-wrap: anywhere; }
#line{ display: flex; flex-wrap: wrap; white-space: pre-wrap; overflow-wrap: anywhere; }
#prompt{ white-space: pre; }
#before, #after{ white-space: pre-wrap; }
#cursor{
  background: var(--amber); color: var(--bg);
  white-space: pre; animation: blink 1.05s step-end infinite;
}
#cursor.off{ background: transparent; color: var(--amber); outline: 1px solid var(--dim); animation: none; }
@keyframes blink{ 0%,100%{ opacity: 1 } 50%{ opacity: 0 } }
@media (prefers-reduced-motion: reduce){ #cursor{ animation: none } }

#kb{
  position: absolute; bottom: 0; left: 0;
  width: 1px; height: 1px; opacity: 0;
  border: 0; padding: 0; margin: 0; resize: none;
  background: transparent; color: transparent;
}

.err{ color: var(--err); }
.warn{ color: var(--warn); }
.dim{ color: var(--dim); }
.kw{ color: var(--hi); font-weight: 700; }
.ask{ color: var(--hi); }
.banner{ color: var(--hi); }
.echo-prompt{ color: var(--dim); }
.echo-cmd{ color: var(--hi); }
.p-user{ color: var(--hi); font-weight: 700; }
.p-sep{ color: var(--dim); }
.p-path{ color: var(--dim); }
.p-mark{ color: var(--amber); font-weight: 700; }

.power-btn{
  display: block; margin: 1rem 0;
  font: inherit; background: transparent; color: var(--amber);
  border: 1px solid var(--rule); border-radius: 2px;
  padding: .5rem 1rem; cursor: pointer;
}
.power-btn:hover{ border-color: var(--amber); color: var(--hi); }
.power-btn:focus-visible{ outline: 2px solid var(--hi); outline-offset: 2px; }

#overlay{ display: none; }
#overlay.on{
  display: flex; flex-direction: column;
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 40;
}
.ed-head{
  flex: 0 0 auto; padding: .35rem .8rem;
  background: var(--amber); color: #17110a;
  font-weight: 700; white-space: pre-wrap;
}
.ed-foot, .ov-foot{
  flex: 0 0 auto; padding: .35rem .8rem;
  background: #1d1508; color: var(--dim);
  white-space: pre-wrap; border-top: 1px solid var(--rule);
}
.ed-foot.ask{ background: var(--amber); color: #17110a; font-weight: 700; }
.ed-body{
  flex: 1 1 auto;
  font: inherit; color: var(--amber); background: var(--bg);
  border: 0; padding: .6rem .8rem; margin: 0;
  resize: none; outline: none;
  white-space: pre; overflow: auto;
}
.ov-body{
  flex: 1 1 auto; margin: 0; padding: .6rem .8rem;
  overflow: auto; white-space: pre; outline: none;
}
#overlay:focus-visible{ outline: none; }

@media (max-width: 620px){
  :root{ --fs: 12.5px; }
  #bar{ gap: .3rem; padding: .3rem .5rem; }
  #title{ font-size: .8em; }
  #screen{ padding: .6rem .6rem 2rem; }
}
</style>
</head>
<body>

<header id="bar">
  <div id="title"></div>
  <div class="tools">
    <button id="btn-aide" type="button">Aide</button>
    <button id="btn-reset" type="button">R&eacute;initialiser</button>
    <button id="btn-moins" type="button" aria-label="R&eacute;duire la taille du texte">A&minus;</button>
    <button id="btn-plus" type="button" aria-label="Augmenter la taille du texte">A+</button>
  </div>
</header>

<main id="screen" role="log" aria-live="polite" aria-label="Sortie du terminal" tabindex="-1">
  <div id="out"></div>
  <div id="line"><span id="prompt"></span><span id="before"></span><span id="cursor"> </span><span id="after"></span></div>
  <textarea id="kb" aria-label="Ligne de commande" rows="1"
            autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>
</main>

<div id="overlay" aria-hidden="true" tabindex="-1"></div>

<noscript>
  <p style="padding:1rem">Ce simulateur a besoin de JavaScript pour fonctionner. Activez-le, puis rechargez la page.</p>
</noscript>

<script>
/* =====================================================================
   SIMULATEUR DE TERMINAL LINUX — MOTEUR
   Partie 1 : VFS, utilisateurs, permissions, chemins
   ===================================================================== */

function now(){ return new Date(); }
function bytelen(s){
  let n=0;
  for(const ch of String(s)){
    const c=ch.codePointAt(0);
    n += c<0x80?1 : c<0x800?2 : c<0x10000?3 : 4;
  }
  return n;
}
function dnode(mode,owner,group){ return {type:'dir',children:{},mode:mode==null?0o755:mode,owner:owner||'root',group:group||'root',mtime:now()}; }
function fnode(content,mode,owner,group){ return {type:'file',content:content==null?'':content,mode:mode==null?0o644:mode,owner:owner||'root',group:group||'root',mtime:now()}; }
function lnode(target,owner){ return {type:'link',target:target,mode:0o777,owner:owner||'root',group:owner||'root',mtime:now()}; }

/* ---------- utilisateurs et groupes ---------- */
const USERS = {
  root: { uid:0, gid:0, home:'/root', shell:'/bin/bash', groups:['root'] },
  user: { uid:1000, gid:1000, home:'/home/user', shell:'/bin/bash', groups:['user','sudo','adm','cdrom','plugdev','lpadmin','lxd'] }
};
function groupsOf(u){ return (USERS[u] && USERS[u].groups) || [u]; }

/* ---------- état global du shell ---------- */
const state = {
  root: null,
  cwd: '/home/user',
  user: 'user',        // utilisateur effectif (devient root sous sudo)
  loginUser: 'user',
  host: 'simulateur-linux',
  env: {},
  vars: {},            // variables shell non exportées
  funcs: {},
  aliases: {},
  lastExit: 0,
  lastBgPid: 0,
  jobs: [],
  procs: [],
  nextPid: 400,
  bootTime: now(),
  history: [],
  packages: null,
  services: null,
  cron: [],
  gitRepos: {},
  docker: null,
  mounts: null,
  net: null,
  exited: false,
  rebootRequested: false,
  sudoUntil: 0,
  umask: 0o022,
  // Hooks fournis par l'interface (null en mode test Node)
  io: {
    write: null,       // (text, cls) => void  — écriture directe à l'écran
    ask: null,         // (question) => Promise<string>
    editor: null,      // (name, content, mode) => Promise<string|null>
    pager: null,       // (text) => Promise<void>
    clear: null,       // () => void
    sleep: (ms)=>new Promise(r=>setTimeout(r,ms))
  }
};

/* ---------- normalisation / résolution de chemins ---------- */
function normalize(p){
  const abs = p.startsWith('/');
  const out = [];
  for(const seg of p.split('/')){
    if(seg==='' || seg==='.') continue;
    if(seg==='..'){ if(out.length) out.pop(); continue; }
    out.push(seg);
  }
  return (abs?'/':'') + out.join('/');
}
function absPath(p){
  if(p==null || p==='') return state.cwd;
  let s = String(p);
  if(s === '~') s = USERS[state.user].home;
  else if(s.startsWith('~/')) s = USERS[state.user].home + s.slice(1);
  if(!s.startsWith('/')) s = state.cwd + '/' + s;
  const n = normalize(s);
  return n === '' ? '/' : n;
}
function dirnameOf(p){
  const a = absPath(p);
  if(a === '/') return '/';
  const i = a.lastIndexOf('/');
  return i === 0 ? '/' : a.slice(0,i);
}
function basenameOf(p){
  const a = absPath(p);
  if(a === '/') return '/';
  return a.slice(a.lastIndexOf('/')+1);
}
function displayPath(p){
  const home = USERS[state.user].home;
  if(p === home) return '~';
  if(p.startsWith(home + '/')) return '~' + p.slice(home.length);
  return p;
}

/* ---------- permissions ---------- */
function perms(node, user){
  user = user || state.user;
  if(user === 'root') return {r:true,w:true,x:true};
  let shift;
  if(node.owner === user) shift = 6;
  else if(groupsOf(user).includes(node.group)) shift = 3;
  else shift = 0;
  const b = (node.mode >> shift) & 7;
  return { r:!!(b&4), w:!!(b&2), x:!!(b&1) };
}
function canRead(n){ return perms(n).r; }
function canWrite(n){ return perms(n).w; }
function canExec(n){ return perms(n).x; }

/* ---------- recherche dans l'arborescence ----------
   lookup renvoie {node, parent, name, path} ou {err:'...'} */
function lookup(path, opt){
  opt = opt || {};
  const target = absPath(path);
  const segs = target.split('/').filter(Boolean);
  let node = state.root, parent = null, name = '/', cur = '';
  let hops = 0;

  for(let i=0;i<segs.length;i++){
    if(node.type === 'link'){
      if(++hops > 24) return {err:'trop de niveaux de liens symboliques'};
      const r = lookup(node.target, {noFollowLast:false});
      if(r.err) return r;
      node = r.node; cur = r.path;
    }
    if(node.type !== 'dir') return {err:`${target}: n'est pas un dossier`, code:'ENOTDIR'};
    if(!perms(node).x) return {err:`${cur||'/'}: Permission non accordée`, code:'EACCES'};
    const seg = segs[i];
    const child = node.children[seg];
    if(!child) return {err:`${target}: Aucun fichier ou dossier de ce type`, code:'ENOENT', parent:node, name:seg, path:target};
    parent = node; name = seg; node = child;
    cur = (cur==='/'?'':cur) + '/' + seg;
    const isLast = (i === segs.length-1);
    if(node.type === 'link' && !(isLast && opt.noFollowLast)){
      if(++hops > 24) return {err:'trop de niveaux de liens symboliques'};
      const tgt = node.target.startsWith('/') ? node.target : (cur.slice(0,cur.lastIndexOf('/'))||'/') + '/' + node.target;
      const r = lookup(tgt, {});
      if(r.err) return {err:`${target}: lien brisé`, code:'ENOENT'};
      node = r.node; parent = r.parent; cur = r.path;
    }
  }
  return { node, parent, name, path: cur === '' ? '/' : cur };
}
function exists(p){ const r = lookup(p); return !r.err; }
function isDir(p){ const r = lookup(p); return !r.err && r.node.type === 'dir'; }

/* lecture / écriture avec contrôle de droits */
function readFile(path){
  const r = lookup(path);
  if(r.err) return {err:r.err, code:r.code};
  if(r.node.type === 'dir') return {err:`${path}: est un dossier`, code:'EISDIR'};
  if(!canRead(r.node)) return {err:`${path}: Permission non accordée`, code:'EACCES'};
  return {content:r.node.content, node:r.node};
}
function writeFile(path, content, append){
  const r = lookup(path);
  if(!r.err){
    if(r.node.type === 'dir') return {err:`${path}: est un dossier`};
    if(!canWrite(r.node)) return {err:`${path}: Permission non accordée`};
    r.node.content = append ? (r.node.content + content) : content;
    r.node.mtime = now();
    return {ok:true, node:r.node};
  }
  if(r.code !== 'ENOENT') return {err:r.err};
  const dir = lookup(dirnameOf(path));
  if(dir.err) return {err:`${dirnameOf(path)}: Aucun fichier ou dossier de ce type`};
  if(dir.node.type !== 'dir') return {err:`${dirnameOf(path)}: n'est pas un dossier`};
  if(!canWrite(dir.node)) return {err:`${path}: Permission non accordée`};
  const n = fnode(content, 0o666 & ~(state.umask || 0), state.user, state.user);
  dir.node.children[basenameOf(path)] = n;
  dir.node.mtime = now();
  return {ok:true, node:n};
}

/* ---------- formatage ---------- */
function modeString(node){
  const t = node.type === 'dir' ? 'd' : node.type === 'link' ? 'l' : '-';
  const m = node.mode;
  let s = '';
  for(let sh=6; sh>=0; sh-=3){
    const b = (m>>sh)&7;
    s += (b&4?'r':'-') + (b&2?'w':'-') + (b&1?'x':'-');
  }
  return t + s;
}
function nodeSize(node){
  if(node.type === 'dir') return 4096;
  if(node.type === 'link') return bytelen(node.target);
  return bytelen(node.content);
}
const MONTHS = ['janv','févr','mars','avril','mai','juin','juil','août','sept','oct','nov','déc'];
function timeString(d){
  const mm = MONTHS[d.getMonth()];
  const day = String(d.getDate()).padStart(2,' ');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${mm.padEnd(5,' ')}${day} ${hh}:${mi}`;
}
function humanSize(n){
  if(n < 1024) return String(n);
  const units = ['K','M','G','T'];
  let v = n/1024, i = 0;
  while(v >= 1024 && i < units.length-1){ v/=1024; i++; }
  return (v < 10 ? v.toFixed(1) : Math.round(v)) + units[i];
}

/* =====================================================================
   Partie 2 : système de fichiers initial et état système simulé
   ===================================================================== */
function buildFS(){
  const r = dnode(0o755,'root','root');
  const put = (path, node) => {
    const segs = path.split('/').filter(Boolean);
    let cur = r;
    for(let i=0;i<segs.length-1;i++){
      if(!cur.children[segs[i]]) cur.children[segs[i]] = dnode(0o755,'root','root');
      cur = cur.children[segs[i]];
    }
    cur.children[segs[segs.length-1]] = node;
    return node;
  };
  const D = (p,mode,o,g) => put(p, dnode(mode,o||'root',g||'root'));
  const F = (p,c,mode,o,g) => put(p, fnode(c,mode,o||'root',g||'root'));

  ['/bin','/sbin','/boot','/dev','/etc','/home','/lib','/media','/mnt','/opt','/proc','/root','/run','/srv','/sys','/tmp','/usr','/var'].forEach(p=>D(p));
  D('/root',0o700,'root','root');
  D('/tmp',0o1777,'root','root');
  D('/usr/bin'); D('/usr/local'); D('/usr/local/bin'); D('/usr/share'); D('/usr/share/doc');
  D('/var/log'); D('/var/www'); D('/var/www/html'); D('/var/cache'); D('/var/lib');
  D('/etc/systemd'); D('/etc/systemd/system'); D('/etc/apt'); D('/etc/ssh'); D('/etc/cron.d');

  F('/etc/hostname','simulateur-linux\n');
  F('/etc/hosts','127.0.0.1\tlocalhost\n127.0.1.1\tsimulateur-linux\n::1\tlocalhost ip6-localhost\n');
  F('/etc/os-release',
`PRETTY_NAME="Ubuntu 26.04 LTS"
NAME="Ubuntu"
VERSION_ID="26.04"
VERSION="26.04 LTS (Resolute Raccoon)"
VERSION_CODENAME=resolute
ID=ubuntu
ID_LIKE=debian
HOME_URL="https://www.ubuntu.com/"
SUPPORT_URL="https://help.ubuntu.com/"
UBUNTU_CODENAME=resolute
LOGO=ubuntu-logo
`);
  F('/etc/lsb-release',
`DISTRIB_ID=Ubuntu
DISTRIB_RELEASE=26.04
DISTRIB_CODENAME=resolute
DISTRIB_DESCRIPTION="Ubuntu 26.04 LTS"
`);
  F('/etc/passwd',
`root:x:0:0:root:/root:/bin/bash
daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
bin:x:2:2:bin:/bin:/usr/sbin/nologin
www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin
nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin
user:x:1000:1000:Utilisateur,,,:/home/user:/bin/bash
`);
  F('/etc/group',
`root:x:0:
adm:x:4:user
sudo:x:27:user
www-data:x:33:
cdrom:x:24:user
plugdev:x:46:user
lpadmin:x:120:user
lxd:x:121:user
user:x:1000:
`);
  F('/etc/shadow','root:*:19000:0:99999:7:::\nuser:$6$xxxx:19000:0:99999:7:::\n',0o640,'root','shadow');
  F('/etc/fstab',
`# <système de fichiers> <point de montage> <type> <options> <dump> <pass>
UUID=8f3c1a2b-0001  /       ext4  errors=remount-ro  0  1
UUID=8f3c1a2b-0002  /home   ext4  defaults           0  2
UUID=8f3c1a2b-0003  none    swap  sw                 0  0
`);
  F('/etc/motd',
`Welcome to Ubuntu 26.04 LTS (GNU/Linux 7.0.0-8-generic x86_64)

 * Documentation :  https://help.ubuntu.com
 * Gestion :        https://landscape.canonical.com
 * Support :        https://ubuntu.com/pro

  Environnement pédagogique — tout se passe dans votre navigateur.

0 mise à jour peut être appliquée immédiatement.

`);
  F('/etc/resolv.conf','nameserver 192.168.1.1\nnameserver 1.1.1.1\n');
  F('/etc/apt/sources.list','# Les dépôts sont désormais décrits dans /etc/apt/sources.list.d/ubuntu.sources\n');
  F('/etc/apt/sources.list.d/ubuntu.sources',
`Types: deb
URIs: http://fr.archive.ubuntu.com/ubuntu/
Suites: resolute resolute-updates resolute-backports
Components: main restricted universe multiverse
Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

Types: deb
URIs: http://security.ubuntu.com/ubuntu/
Suites: resolute-security
Components: main restricted universe multiverse
Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
`);
  F('/etc/ssh/sshd_config','Port 22\nPermitRootLogin no\nPasswordAuthentication yes\n');
  F('/etc/crontab','# m h dom mon dow user\tcommand\n17 *\t* * *\troot\tcd / && run-parts --report /etc/cron.hourly\n');

  F('/var/log/syslog',
`Jul 21 08:00:01 simulateur-linux systemd[1]: Started Daily apt download activities.
Jul 21 08:12:03 simulateur-linux sshd[712]: Server listening on 0.0.0.0 port 22.
Jul 21 08:14:22 simulateur-linux kernel: [   12.884] EXT4-fs (sda1): mounted filesystem
Jul 21 09:02:11 simulateur-linux cron[688]: (root) CMD (cd / && run-parts /etc/cron.hourly)
Jul 21 09:45:00 simulateur-linux systemd[1]: Starting Cleanup of Temporary Directories...
Jul 21 10:00:00 simulateur-linux systemd[1]: Finished Cleanup of Temporary Directories.
`);
  F('/var/log/auth.log',
`Jul 21 08:12:03 simulateur-linux sshd[712]: Accepted password for user from 192.168.1.42 port 51234 ssh2
Jul 21 08:30:11 simulateur-linux sudo:     user : TTY=pts/0 ; PWD=/home/user ; USER=root ; COMMAND=/usr/bin/apt update
Jul 21 09:14:55 simulateur-linux sshd[801]: Failed password for invalid user admin from 203.0.113.9 port 40122 ssh2
Jul 21 09:14:58 simulateur-linux sshd[801]: Failed password for invalid user admin from 203.0.113.9 port 40122 ssh2
`);
  F('/var/www/html/index.html','<!doctype html>\n<html><body><h1>Ça marche !</h1></body></html>\n',0o644,'www-data','www-data');

  /* ---- /home/user ---- */
  D('/home/user',0o755,'user','user');
  const U = (p,c,mode) => F('/home/user/'+p, c, mode==null?0o644:mode, 'user','user');
  const UD = (p,mode) => D('/home/user/'+p, mode==null?0o755:mode, 'user','user');

  U('README.txt',
`Bienvenue dans le simulateur de terminal Linux.

Ce dossier accompagne le livre : chaque dossier d'exercices correspond
à un thème abordé dans les chapitres.

Pour démarrer :
  ls -la
  cd exercices
  cat 01-navigation/consignes.txt

Aide :
  help              liste des commandes disponibles
  man <commande>    manuel détaillé d'une commande
  <commande> --help aide courte
  reset             remet le système dans son état d'origine
`);
  U('.bashrc',
`# ~/.bashrc — exécuté par bash pour les shells interactifs
export PS1='\\u@\\h:\\w\\$ '
export EDITOR=nano
alias ll='ls -alF'
alias la='ls -A'
alias l='ls -CF'
alias grep='grep --color=auto'
`);
  U('.profile','# ~/.profile\nif [ -n "$BASH_VERSION" ]; then\n  if [ -f "$HOME/.bashrc" ]; then\n    . "$HOME/.bashrc"\n  fi\nfi\n');
  U('.bash_history','ls -la\ncd exercices\ngrep ERROR journal.log\n');

  UD('exercices');
  UD('exercices/01-navigation');
  U('exercices/01-navigation/consignes.txt',
`Objectif : se déplacer et observer l'arborescence.

1. Affichez le dossier courant avec pwd
2. Listez tout, y compris les fichiers cachés : ls -la
3. Descendez dans un dossier avec cd, remontez avec cd ..
4. Revenez directement à votre dossier personnel : cd ~
5. Trouvez le fichier caché de ce dossier et affichez-le.
`);
  U('exercices/01-navigation/.indice','Bravo : ls -a révèle les fichiers commençant par un point.\n');

/* =====================================================================
   Partie 3 : analyse lexicale et syntaxique (grammaire shell)
   ===================================================================== */
function Incomplete(want){ const e = new Error('saisie incomplète'); e.incomplete = true; e.want = want; return e; }
function SyntaxErr(msg){ const e = new Error(msg); e.syntax = true; return e; }

function matchParen(src, openIdx){
  let depth = 0, i = openIdx;
  while(i < src.length){
    const c = src[i];
    if(c === "'"){ const e = src.indexOf("'", i+1); if(e < 0) return -1; i = e+1; continue; }
    if(c === '"'){
      i++;
      while(i < src.length && src[i] !== '"'){ if(src[i] === '\\') i++; i++; }
      if(i >= src.length) return -1;
      i++; continue;
    }
    if(c === '(') depth++;
    else if(c === ')'){ depth--; if(depth === 0) return i; }
    i++;
  }
  return -1;
}

function tokenize(src){
  const toks = [];
  let i = 0;
  const n = src.length;
  const pendingHere = [];

  const readWord = () => {
    const parts = [];
    let cur = '';
    const flush = () => { if(cur !== ''){ parts.push({q:'u', s:cur}); cur = ''; } };
    while(i < n){
      const c = src[i];
      if(c === '\n' || c === ' ' || c === '\t') break;
      if('|&;()<>'.includes(c)) break;
      if(c === '\\'){
        if(src[i+1] === '\n'){ i += 2; continue; }
        if(i+1 >= n) throw Incomplete('\\');
        flush(); parts.push({q:'e', s:src[i+1]}); i += 2; continue;
      }
      if(c === "'"){
        flush(); i++;
        let s = '';
        while(i < n && src[i] !== "'") s += src[i++];
        if(i >= n) throw Incomplete("'");
        i++; parts.push({q:'s', s}); continue;
      }
      if(c === '"'){
        flush(); i++;
        let s = '';
        while(i < n && src[i] !== '"'){
          if(src[i] === '\\' && i+1 < n && '"\\$`\n'.includes(src[i+1])){
            if(src[i+1] === '\n'){ i += 2; continue; }
            s += '\\' + src[i+1]; i += 2; continue;
          }
          if(src[i] === '$' && src[i+1] === '('){
            const e = matchParen(src, i+1);
            if(e < 0) throw Incomplete(')');
            s += src.slice(i, e+1); i = e+1; continue;
          }
          if(src[i] === '`'){
            const e = src.indexOf('`', i+1);
            if(e < 0) throw Incomplete('`');
            s += src.slice(i, e+1); i = e+1; continue;
          }
          s += src[i++];
        }
        if(i >= n) throw Incomplete('"');
        i++; parts.push({q:'d', s}); continue;
      }
      if(c === '$' && src[i+1] === '('){
        const e = matchParen(src, i+1);
        if(e < 0) throw Incomplete(')');
        cur += src.slice(i, e+1); i = e+1; continue;
      }
      if(c === '`'){
        const e = src.indexOf('`', i+1);
        if(e < 0) throw Incomplete('`');
        cur += src.slice(i, e+1); i = e+1; continue;
      }
      cur += c; i++;
    }
    flush();
    return parts;
  };

  while(i < n){
    const c = src[i];
    if(c === '\\' && src[i+1] === '\n'){ i += 2; continue; }
    if(c === ' ' || c === '\t'){ i++; continue; }
    if(c === '\n'){
      i++;
      if(pendingHere.length){
        for(const h of pendingHere){
          const lines = [];
          let done = false;
          while(i < n){
            let e = src.indexOf('\n', i);
            if(e < 0) e = n;
            const line = src.slice(i, e);
            if(line.replace(/\s+$/,'') === h.delim){ i = e < n ? e+1 : n; done = true; break; }
            lines.push(line);
            i = e < n ? e+1 : n;
          }
          if(!done) throw Incomplete(h.delim);
          h.tok.here = lines.length ? lines.join('\n') + '\n' : '';
        }
        pendingHere.length = 0;
      }
      toks.push({type:'op', value:'\n'});
      continue;
    }
    if(c === '#'){
      while(i < n && src[i] !== '\n') i++;
      continue;
    }
    /* redirections avec descripteur explicite : 2> 2>> 2>&1 */
    const mfd = /^(\d+)(>>|>&|<&|>|<)/.exec(src.slice(i, i+6));
    if(mfd){
      i += mfd[0].length;
      const t = {type:'redir', fd:parseInt(mfd[1],10), op:mfd[2]};
      if(t.op === '>&' || t.op === '<&'){
        const m2 = /^(\d+|-)/.exec(src.slice(i));
        if(m2){ t.target = m2[1]; i += m2[1].length; }
      }
      toks.push(t); continue;
    }
    if(src.startsWith('&>>', i)){ i += 3; toks.push({type:'redir', fd:1, op:'>>', both:true}); continue; }
    if(src.startsWith('&>', i)){ i += 2; toks.push({type:'redir', fd:1, op:'>', both:true}); continue; }
    if(src.startsWith('<<<', i)){ i += 3; toks.push({type:'redir', fd:0, op:'<<<'}); continue; }
    if(src.startsWith('<<', i)){
      i += 2;
      if(src[i] === '-') i++;
      while(src[i] === ' ' || src[i] === '\t') i++;
      let delim = '', quoted = false;
      if(src[i] === "'" || src[i] === '"'){
        const q = src[i++]; quoted = true;
        while(i < n && src[i] !== q) delim += src[i++];
        i++;
      } else {
        while(i < n && !/[\s;|&<>()]/.test(src[i])) delim += src[i++];
      }
      const t = {type:'redir', fd:0, op:'<<', delim, quoted};
      toks.push(t); pendingHere.push({tok:t, delim});
      continue;
    }
    if(src.startsWith('((', i)){
      const end = matchParen(src, i);
      if(end > 0 && src[end-1] === ')'){
        toks.push({type:'arith', expr: src.slice(i+2, end-1)});
        i = end + 1;
        continue;
      }
    }
    if(src.startsWith('&&', i)){ i += 2; toks.push({type:'op', value:'&&'}); continue; }
    if(src.startsWith('||', i)){ i += 2; toks.push({type:'op', value:'||'}); continue; }
    if(src.startsWith('>>', i)){ i += 2; toks.push({type:'redir', fd:1, op:'>>'}); continue; }
    if(src.startsWith(';;', i)){ i += 2; toks.push({type:'op', value:';;'}); continue; }
    if(c === '>'){ i++; toks.push({type:'redir', fd:1, op:'>'}); continue; }
    if(c === '<'){ i++; toks.push({type:'redir', fd:0, op:'<'}); continue; }
    if(c === '|' || c === '&' || c === ';' || c === '(' || c === ')'){
      i++; toks.push({type:'op', value:c}); continue;
    }
    const parts = readWord();
    if(!parts.length){ i++; continue; }
    toks.push({type:'word', parts});
  }
  return toks;
}

function wordText(parts){ return parts.map(p=>p.s).join(''); }
function isPlainWord(tok, txt){
  return tok && tok.type === 'word' && tok.parts.every(p=>p.q === 'u') && wordText(tok.parts) === txt;
}

const RESERVED = ['if','then','elif','else','fi','for','while','until','do','done','case','esac','function','in','{','}','!'];

function parse(src){
  const toks = tokenize(src);
  let p = 0;
  const peek = () => toks[p];
  const at = (v) => { const t = toks[p]; return t && t.type === 'op' && t.value === v; };
  const atRedir = () => { const t = toks[p]; return t && t.type === 'redir'; };
  const peekWordText = () => {
    const t = toks[p];
    if(t && t.type === 'word' && t.parts.every(x=>x.q === 'u')) return wordText(t.parts);
    return null;
  };
  const skipNL = () => { while(at('\n') || at(';')) p++; };
  const eatWord = (w) => {
    skipNL();
    if(p >= toks.length) throw Incomplete(w);
    if(peekWordText() !== w) throw SyntaxErr(`erreur de syntaxe près de « ${peekWordText() || (toks[p].value||'')} » (attendu : ${w})`);
    p++;
  };

  function parseRedirs(list){
    while(atRedir()){
      const t = toks[p++];
      const r = {fd:t.fd, op:t.op, both:t.both};
      if(t.op === '<<'){ r.here = t.here == null ? '' : t.here; r.quoted = t.quoted; }
      else if((t.op === '>&' || t.op === '<&') && t.target != null){ r.dup = t.target; }
      else {
        if(p >= toks.length || toks[p].type !== 'word') throw Incomplete('fichier');
        r.target = toks[p++].parts;
      }
      list.push(r);
    }
  }

  function parseSimple(){
    const assigns = [], words = [], redirs = [];
    for(;;){
      if(atRedir()){ parseRedirs(redirs); continue; }
      const t = peek();
      if(!t || t.type !== 'word') break;
      const first = t.parts[0];
      if(!words.length && first && first.q === 'u' && /^[A-Za-z_][A-Za-z0-9_]*=/.test(first.s)){
        const eq = first.s.indexOf('=');
        const name = first.s.slice(0, eq);
        const rest = [{q:'u', s:first.s.slice(eq+1)}].concat(t.parts.slice(1));
        assigns.push({name, value:rest});
        p++; continue;
      }
      words.push(t.parts); p++;
    }
    if(!words.length && !assigns.length && !redirs.length) throw SyntaxErr('commande vide');
    return {type:'simple', assigns, words, redirs};
  }

  function parseGroupUntil(closer){
    const body = parseSeq([closer]);
    eatWord(closer);
    return body;
  }

  function parseIf(){
    eatWord('if');
    const clauses = [];
    let cond = parseSeq(['then']);
    eatWord('then');
    let body = parseSeq(['elif','else','fi']);
    clauses.push({cond, body});
    while(peekWordText() === 'elif'){
      eatWord('elif');
      const c = parseSeq(['then']); eatWord('then');
      const b = parseSeq(['elif','else','fi']);
      clauses.push({cond:c, body:b});
    }
    let elseBody = null;
    if(peekWordText() === 'else'){ eatWord('else'); elseBody = parseSeq(['fi']); }
    eatWord('fi');
    return {type:'if', clauses, elseBody, redirs:[]};
  }

  function parseFor(){
    eatWord('for');
    const cTok = peek();
    if(cTok && cTok.type === 'arith'){
      p++;
      const seg = cTok.expr.split(';');
      const init = seg[0] || '', cond = seg.length > 1 ? seg[1] : '1', step = seg[2] || '';
      while(at(';') || at('\n')) p++;
      eatWord('do');
      const body = parseSeq(['done']);
      eatWord('done');
      return {type:'cfor', init, cond, step, body, redirs:[]};
    }
    const nameTok = peek();
    if(!nameTok || nameTok.type !== 'word') throw Incomplete('variable');
    const name = wordText(nameTok.parts); p++;
    let items = null;
    if(peekWordText() === 'in'){
      p++; items = [];
      while(p < toks.length && toks[p].type === 'word' && peekWordText() !== 'do'){
        items.push(toks[p].parts); p++;
      }
    }
    while(at(';') || at('\n')) p++;
    eatWord('do');
    const body = parseSeq(['done']);
    eatWord('done');
    return {type:'for', name, items, body, redirs:[]};
  }

  function parseWhile(kind){
    eatWord(kind);
    const cond = parseSeq(['do']);
    eatWord('do');
    const body = parseSeq(['done']);
    eatWord('done');
    return {type:'while', until:kind === 'until', cond, body, redirs:[]};
  }

  function parseCommand(){
    skipNL();
    if(p >= toks.length) throw Incomplete('commande');
    let neg = false;
    if(peekWordText() === '!'){ p++; neg = true; skipNL(); }
    const tk0 = peek();
    if(tk0 && tk0.type === 'arith'){
      p++;
      let node0 = {type:'arithcmd', expr:tk0.expr, redirs:[]};
      parseRedirs(node0.redirs);
      return neg ? {type:'negate', child:node0} : node0;
    }
    const w = peekWordText();
    let node;
    if(w === 'if') node = parseIf();
    else if(w === 'for') node = parseFor();
    else if(w === 'while') node = parseWhile('while');
    else if(w === 'until') node = parseWhile('until');
    else if(w === '{'){ p++; const body = parseGroupUntil('}'); node = {type:'group', body, redirs:[]}; }
    else if(w === 'function'){
      p++;
      const nameTok = peek();
      if(!nameTok || nameTok.type !== 'word') throw Incomplete('nom');
      const name = wordText(nameTok.parts); p++;
      if(at('(')){ p++; if(at(')')) p++; }
      skipNL();
      if(peekWordText() !== '{') throw SyntaxErr('« { » attendu pour la définition de fonction');
      p++;
      const body = parseGroupUntil('}');
      node = {type:'func', name, body, redirs:[]};
    }
    else if(at('(')){
      p++;
      const body = parseSeq([')']);
      if(!at(')')) throw Incomplete(')');
      p++;
      node = {type:'subshell', body, redirs:[]};
    }
    else {
      /* définition de fonction « nom() { ... } » */
      const t = peek();
      if(t && t.type === 'word' && toks[p+1] && toks[p+1].type === 'op' && toks[p+1].value === '('
         && toks[p+2] && toks[p+2].type === 'op' && toks[p+2].value === ')'){
        const name = wordText(t.parts);
        p += 3; skipNL();
        if(peekWordText() !== '{') throw SyntaxErr('« { » attendu pour la définition de fonction');
        p++;
        const body = parseGroupUntil('}');
        node = {type:'func', name, body, redirs:[]};
      } else {
        node = parseSimple();
      }
    }
    if(node.type !== 'simple'){ node.redirs = node.redirs || []; parseRedirs(node.redirs); }
    if(neg) node = {type:'negate', child:node};
    return node;
  }

  function parsePipeline(){
    const cmds = [parseCommand()];
    while(at('|')){
      p++; skipNL();
      cmds.push(parseCommand());
    }
    return cmds.length === 1 ? cmds[0] : {type:'pipeline', cmds};
  }

  function parseAndOr(){
    let left = parsePipeline();
    while(at('&&') || at('||')){
      const op = toks[p].value; p++;
      while(at('\n')) p++;
      const right = parsePipeline();
      left = {type:'andor', op, left, right};
    }
    return left;
  }

  function parseSeq(stops){
    stops = stops || [];
    const parts = [];
    for(;;){
      while(at('\n') || at(';')) p++;
      if(p >= toks.length) break;
      const wt = peekWordText();
      if(wt !== null && stops.includes(wt)) break;
      if(stops.includes(')') && at(')')) break;
      const node = parseAndOr();
      let bg = false, sep = false;
      if(at('&')){ bg = true; sep = true; p++; }
      else if(at(';')){ sep = true; p++; }
      else if(at('\n')){ sep = true; }
      parts.push({node, bg});
      if(!sep) break;
    }
    return {type:'seq', parts};
  }

  const prog = parseSeq([]);
  if(p < toks.length){
    const t = toks[p];
    const near = t.type === 'word' ? wordText(t.parts) : (t.value || t.op || '');
    throw SyntaxErr(`erreur de syntaxe près du symbole inattendu « ${near} »`);
  }
  return prog;
}

/* =====================================================================
   Partie 4 : expansion (variables, substitution, jokers) et exécution
   ===================================================================== */
function Flow(kind, code, n){ const e = new Error('flow'); e.flow = kind; e.code = code; e.n = n; return e; }

let positional = [];
let funcDepth = 0;

function paramValue(spec){
  if(spec === '?') return String(state.lastExit);
  if(spec === '$') return '980';
  if(spec === '!') return String(state.lastBgPid);
  if(spec === '#') return String(positional.length);
  if(spec === '@' || spec === '*') return positional.join(' ');
  if(/^[0-9]+$/.test(spec)){
    const idx = parseInt(spec,10);
    if(idx === 0) return 'bash';
    return positional[idx-1] == null ? '' : positional[idx-1];
  }
  if(spec.startsWith('#')){
    const v = getVar(spec.slice(1));
    return String(bytelen(v));
  }
  let m = /^([A-Za-z_][A-Za-z0-9_]*):-(.*)$/.exec(spec);
  if(m){ const v = getVar(m[1]); return v !== '' ? v : m[2]; }
  m = /^([A-Za-z_][A-Za-z0-9_]*):=(.*)$/.exec(spec);
  if(m){ let v = getVar(m[1]); if(v === ''){ v = m[2]; setVar(m[1], v); } return v; }
  m = /^([A-Za-z_][A-Za-z0-9_]*):\+(.*)$/.exec(spec);
  if(m){ return getVar(m[1]) !== '' ? m[2] : ''; }
  m = /^([A-Za-z_][A-Za-z0-9_]*)$/.exec(spec);
  if(m) return getVar(m[1]);
  return '';
}
function getVar(n){
  if(Object.prototype.hasOwnProperty.call(state.vars, n)) return state.vars[n];
  if(Object.prototype.hasOwnProperty.call(state.env, n)) return state.env[n];
  return '';
}
function setVar(n, v){
  if(Object.prototype.hasOwnProperty.call(state.env, n)) state.env[n] = v;
  else state.vars[n] = v;
}

/* ---- arithmétique $(( )) ---- */
function arith(expr){
  let i = 0;
  const s = expr;
  const ws = () => { while(i < s.length && /\s/.test(s[i])) i++; };
  function prim(){
    ws();
    if(s[i] === '('){ i++; const v = orx(); ws(); if(s[i] === ')') i++; return v; }
    if(s[i] === '-'){ i++; return -prim(); }
    if(s[i] === '!'){ i++; return prim() ? 0 : 1; }
    const m = /^(\$?[A-Za-z_][A-Za-z0-9_]*|\d+)/.exec(s.slice(i));
    if(!m) return 0;
    i += m[0].length;
    const t = m[0];
    if(/^\d+$/.test(t)) return parseInt(t,10);
    const v = getVar(t.replace(/^\$/,''));
    return parseInt(v,10) || 0;
  }
  function mul(){ let v = prim(); for(;;){ ws(); const c = s[i];
    if(c === '*'){ i++; v = v * prim(); }
    else if(c === '/'){ i++; const d = prim(); v = d === 0 ? 0 : Math.trunc(v/d); }
    else if(c === '%'){ i++; const d = prim(); v = d === 0 ? 0 : v % d; }
    else return v; } }
  function add(){ let v = mul(); for(;;){ ws();
    if(s[i] === '+'){ i++; v += mul(); }
    else if(s[i] === '-'){ i++; v -= mul(); }
    else return v; } }
  function cmp(){ let v = add(); for(;;){ ws();
    if(s.startsWith('<=',i)){ i+=2; v = v <= add() ? 1:0; }
    else if(s.startsWith('>=',i)){ i+=2; v = v >= add() ? 1:0; }
    else if(s.startsWith('==',i)){ i+=2; v = v === add() ? 1:0; }
    else if(s.startsWith('!=',i)){ i+=2; v = v !== add() ? 1:0; }
    else if(s[i] === '<'){ i++; v = v < add() ? 1:0; }
    else if(s[i] === '>'){ i++; v = v > add() ? 1:0; }
    else return v; } }
  function andx(){ let v = cmp(); for(;;){ ws(); if(s.startsWith('&&',i)){ i+=2; const r = cmp(); v = (v && r) ? 1:0; } else return v; } }
  function orx(){ let v = andx(); for(;;){ ws(); if(s.startsWith('||',i)){ i+=2; const r = andx(); v = (v || r) ? 1:0; } else return v; } }
  const inc = /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*(\+\+|--)\s*$/.exec(s);
  if(inc){
    const before = parseInt(getVar(inc[1]), 10) || 0;
    setVar(inc[1], String(inc[2] === '++' ? before + 1 : before - 1));
    return before;                     /* post-incrémentation : renvoie l'ancienne valeur */
  }
  const pre = /^\s*(\+\+|--)\s*([A-Za-z_][A-Za-z0-9_]*)\s*$/.exec(s);
  if(pre){
    const after = (parseInt(getVar(pre[2]), 10) || 0) + (pre[1] === '++' ? 1 : -1);
    setVar(pre[2], String(after));
    return after;
  }
  const m = /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*([+\-*\/%]?)=([^=].*)$/.exec(s);
  if(m){
    const v = arith(m[3]);
    const cur = parseInt(getVar(m[1]), 10) || 0;
    let r;
    switch(m[2]){
      case '+': r = cur + v; break;
      case '-': r = cur - v; break;
      case '*': r = cur * v; break;
      case '/': r = v === 0 ? 0 : Math.trunc(cur / v); break;
      case '%': r = v === 0 ? 0 : cur % v; break;
      default:  r = v;
    }
    setVar(m[1], String(r));
    return r;
  }
  return orx();
}

/* ---- jokers ---- */
function hasGlob(chunks){
  return chunks.some(c => !c.quoted && /[*?\[]/.test(c.s));
}
function globToRegex(text, mask){
  let re = '^';
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(mask[i]){ re += c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); continue; }
    if(c === '*') re += '[^/]*';
    else if(c === '?') re += '[^/]';
    else if(c === '['){
      let j = i+1, neg = false, cls = '';
      if(text[j] === '!' || text[j] === '^'){ neg = true; j++; }
      while(j < text.length && text[j] !== ']'){ cls += text[j] === '\\' ? '\\\\' : text[j]; j++; }
      if(j >= text.length){ re += '\\['; continue; }
      re += '[' + (neg?'^':'') + cls + ']';
      i = j;
    }
    else re += c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  }
  return new RegExp(re + '$');
}
function globExpand(text, mask){
  if(!/[*?\[]/.test(text)) return [text];
  const absolute = text.startsWith('/');
  const segs = [];
  let cur = '', curMask = [];
  for(let i=0;i<text.length;i++){
    if(text[i] === '/' && !mask[i]){ segs.push({s:cur, m:curMask}); cur=''; curMask=[]; }
    else { cur += text[i]; curMask.push(mask[i]); }
  }
  segs.push({s:cur, m:curMask});
  let bases = [absolute ? '/' : ''];
  if(absolute) segs.shift();
  let results = bases;
  for(const seg of segs){
    if(seg.s === ''){ continue; }
    const next = [];
    const isGlob = seg.m.some((q,idx)=>!q && /[*?\[]/.test(seg.s[idx]));
    for(const base of results){
      if(!isGlob){
        const cand = base === '' ? seg.s : (base === '/' ? '/'+seg.s : base + '/' + seg.s);
        if(exists(cand) || segs.indexOf(seg) === segs.length-1) next.push(cand);
        continue;
      }
      const dirPath = base === '' ? state.cwd : base;
      const r = lookup(dirPath);
      if(r.err || r.node.type !== 'dir') continue;
      const re = globToRegex(seg.s, seg.m);
      const names = Object.keys(r.node.children).sort();
      for(const nm of names){
        if(nm.startsWith('.') && !seg.s.startsWith('.')) continue;
        if(!re.test(nm)) continue;
        next.push(base === '' ? nm : (base === '/' ? '/'+nm : base + '/' + nm));
      }
    }
    results = next;
    if(!results.length) break;
  }
  if(!results.length) return [text];
  return results.sort();
}

/* ---- expansion d'un mot ---- */
async function expandSegments(s, isDouble, ctx){
  const out = [];
  let lit = '';
  const pushLit = () => { if(lit !== ''){ out.push({s:lit, quoted:isDouble, exp:false}); lit = ''; } };
  let i = 0;
  while(i < s.length){
    const c = s[i];
    if(c === '\\' && isDouble && i+1 < s.length && '$`"\\'.includes(s[i+1])){ lit += s[i+1]; i += 2; continue; }
    if(c === '$' && s[i+1] === '(' && s[i+2] === '('){
      const end = s.indexOf('))', i+3);
      if(end >= 0){ pushLit(); out.push({s:String(arith(s.slice(i+3,end))), quoted:isDouble, exp:true}); i = end+2; continue; }
    }
    if(c === '$' && s[i+1] === '('){
      const e = matchParen(s, i+1);
      if(e > 0){ pushLit(); out.push({s: await runSubstitution(s.slice(i+2, e), ctx), quoted:isDouble, exp:true}); i = e+1; continue; }
    }
    if(c === '`'){
      const e = s.indexOf('`', i+1);
      if(e > 0){ pushLit(); out.push({s: await runSubstitution(s.slice(i+1, e), ctx), quoted:isDouble, exp:true}); i = e+1; continue; }
    }
    if(c === '$'){
      let m = /^\$\{([^}]*)\}/.exec(s.slice(i));
      if(m){ pushLit(); out.push({s: paramValue(m[1]), quoted:isDouble, exp:true}); i += m[0].length; continue; }
      m = /^\$([A-Za-z_][A-Za-z0-9_]*|\?|\$|!|#|@|\*|[0-9])/.exec(s.slice(i));
      if(m){ pushLit(); out.push({s: paramValue(m[1]), quoted:isDouble, exp:true}); i += m[0].length; continue; }
    }
    lit += c; i++;
  }
  pushLit();
  return out;
}

async function expandWord(parts, ctx, opts){
  opts = opts || {};
  let fields = [[]];
  const add = (chunk) => fields[fields.length-1].push(chunk);
  for(const part of parts){
    if(part.q === 's' || part.q === 'e'){ add({s:part.s, quoted:true}); continue; }
    const isDouble = part.q === 'd';
    const segs = await expandSegments(part.s, isDouble, ctx);
    for(const sg of segs){
      if(!isDouble && sg.exp){
        const pieces = sg.s.split(/[ \t\n]+/);
        for(let k=0;k<pieces.length;k++){
          if(k > 0) fields.push([]);
          if(pieces[k] !== '') add({s:pieces[k], quoted:false});
        }
      } else {
        add({s:sg.s, quoted: isDouble || sg.quoted});
      }
    }
  }
  const outWords = [];
  for(const f of fields){
    if(!f.length) continue;
    const text = f.map(c=>c.s).join('');
    const mask = [];
    for(const c of f) for(let k=0;k<c.s.length;k++) mask.push(!!c.quoted);
    if(opts.noGlob || !hasGlob(f)) outWords.push(text);
    else outWords.push(...globExpand(text, mask));
  }
  if(!outWords.length && parts.length && parts.every(p=>p.q === 's' || p.q === 'd' || p.q === 'e')) return [''];
  return outWords;
}

async function runSubstitution(src, ctx){
  let buf = '';
  const sub = { stdin:'', out:(t)=>{ buf += t; }, err: ctx ? ctx.err : ()=>{} , depth:(ctx?ctx.depth:0)+1 };
  try{
    const ast = parse(src);
    await execNode(ast, sub);
  }catch(e){
    if(e && e.flow) throw e;
    if(ctx) ctx.err((e && e.message ? e.message : String(e)) + '\n');
  }
  return buf.replace(/\n+$/,'');
}

/* ---- redirections ---- */
async function applyRedirs(redirs, ctx){
  if(!redirs || !redirs.length) return {ctx, finish: async()=>{}};
  let stdin = ctx.stdin;
  let outTarget = null, errTarget = null, errToOut = false, outToErr = false;
  const outBuf = [], errBuf = [];
  for(const r of redirs){
    if(r.op === '<'){
      const w = await expandWord(r.target, ctx);
      const f = readFile(w[0]);
      if(f.err) return {error:`bash: ${w[0]}: ${f.err.replace(/^.*?: /,'')}`};
      stdin = f.content;
      continue;
    }
    if(r.op === '<<'){
      let body = r.here || '';
      if(!r.quoted){
        const segs = await expandSegments(body, true, ctx);
        body = segs.map(s=>s.s).join('');
      }
      stdin = body; continue;
    }
    if(r.op === '<<<'){
      const w = await expandWord(r.target, ctx);
      stdin = w.join(' ') + '\n'; continue;
    }
    if(r.op === '>&' || r.op === '<&'){
      if(r.fd === 2 && r.dup === '1') errToOut = true;
      else if(r.fd === 1 && r.dup === '2') outToErr = true;
      continue;
    }
    if(r.op === '>' || r.op === '>>'){
      const w = await expandWord(r.target, ctx);
      const path = w[0];
      if(path === '/dev/null'){
        if(r.fd === 2) errTarget = {devnull:true};
        else { outTarget = {devnull:true}; if(r.both) errTarget = {devnull:true}; }
        continue;
      }
      const chk = writeFile(path, '', r.op === '>>');
      if(chk.err) return {error:`bash: ${path}: ${chk.err.replace(/^.*?: /,'')}`};
      const t = {path:path};
      if(r.fd === 2) errTarget = t;
      else { outTarget = t; if(r.both){ errTarget = t; errToOut = true; } }
      continue;
    }
  }
  const newCtx = {
    stdin,
    depth: ctx.depth,
    out: (t) => {
      if(outToErr) return newCtx.err(t);
      if(outTarget){ if(!outTarget.devnull) outBuf.push(t); return; }
      ctx.out(t);
    },
    err: (t) => {
      if(errToOut){
        if(outTarget){ if(!outTarget.devnull) outBuf.push(t); return; }
        return ctx.out(t);
      }
      if(errTarget){ if(!errTarget.devnull) errBuf.push(t); return; }
      ctx.err(t);
    }
  };
  const finish = async () => {
    if(outTarget && !outTarget.devnull) writeFile(outTarget.path, outBuf.join(''), true);
    if(errTarget && !errTarget.devnull && errTarget !== outTarget) writeFile(errTarget.path, errBuf.join(''), true);
  };
  return {ctx:newCtx, finish};
}

/* ---- exécution ---- */
async function execNode(node, ctx){
  if(state.exited) return state.lastExit;
  switch(node.type){
    case 'seq': {
      let code = 0;
      for(const part of node.parts){
        if(part.bg){ code = await runBackground(part.node, ctx); }
        else code = await execNode(part.node, ctx);
        state.lastExit = code;
        if(state.exited) break;
      }
      return code;
    }
    case 'andor': {
      const l = await execNode(node.left, ctx);
      state.lastExit = l;
      if(node.op === '&&' && l !== 0) return l;
      if(node.op === '||' && l === 0) return l;
      const r = await execNode(node.right, ctx);
      state.lastExit = r;
      return r;
    }
    case 'negate': {
      const c = await execNode(node.child, ctx);
      return c === 0 ? 1 : 0;
    }
    case 'pipeline': {
      let data = ctx.stdin || '';
      let code = 0;
      for(let i=0;i<node.cmds.length;i++){
        const last = i === node.cmds.length-1;
        let buf = '';
        const sub = {
          stdin: data,
          depth: ctx.depth,
          out: last ? ctx.out : (t)=>{ buf += t; },
          err: ctx.err
        };
        code = await execNode(node.cmds[i], sub);
        data = buf;
      }
      return code;
    }
    case 'subshell':
    case 'group': {
      const rd = await applyRedirs(node.redirs, ctx);
      if(rd.error){ ctx.err(rd.error + '\n'); return 1; }
      const saveVars = node.type === 'subshell' ? JSON.stringify(state.vars) : null;
      const saveCwd = node.type === 'subshell' ? state.cwd : null;
      let code;
      try { code = await execNode(node.body, rd.ctx); }
      finally {
        await rd.finish();
        if(saveVars !== null){ state.vars = JSON.parse(saveVars); state.cwd = saveCwd; }
      }
      return code;
    }
    case 'if': {
      const rd = await applyRedirs(node.redirs, ctx);
      if(rd.error){ ctx.err(rd.error + '\n'); return 1; }
      try{
        for(const cl of node.clauses){
          const c = await execNode(cl.cond, rd.ctx);
          if(c === 0) return await execNode(cl.body, rd.ctx);
        }
        if(node.elseBody) return await execNode(node.elseBody, rd.ctx);
        return 0;
      } finally { await rd.finish(); }
    }
    case 'arithcmd': {
      const v = arith(node.expr);
      return v === 0 ? 1 : 0;
    }
    case 'cfor': {
      const rd = await applyRedirs(node.redirs, ctx);
      if(rd.error){ ctx.err(rd.error + '\n'); return 1; }
      let code = 0, guard = 0;
      try{
        if(node.init.trim()) arith(node.init);
        for(;;){
          if(++guard > 20000){ ctx.err('bash : boucle interrompue (limite de sécurité du simulateur)\n'); return 1; }
          if(node.cond.trim() && arith(node.cond) === 0) break;
          try{ code = await execNode(node.body, rd.ctx); }
          catch(e){
            if(e && e.flow === 'break'){ if(e.n > 1){ e.n--; throw e; } break; }
            else if(e && e.flow === 'continue'){ if(e.n > 1){ e.n--; throw e; } }
            else throw e;
          }
          if(node.step.trim()) arith(node.step);
          if(state.exited) break;
        }
      } finally { await rd.finish(); }
      return code;
    }
    case 'for': {
      const rd = await applyRedirs(node.redirs, ctx);
      if(rd.error){ ctx.err(rd.error + '\n'); return 1; }
      let items = [];
      if(node.items === null) items = positional.slice();
      else for(const it of node.items) items.push(...await expandWord(it, ctx));
      let code = 0;
      try{
        for(const it of items){
          setVar(node.name, it);
          try{ code = await execNode(node.body, rd.ctx); }
          catch(e){
            if(e && e.flow === 'break'){ if(e.n > 1){ e.n--; throw e; } break; }
            if(e && e.flow === 'continue'){ if(e.n > 1){ e.n--; throw e; } continue; }
            throw e;
          }
          if(state.exited) break;
        }
      } finally { await rd.finish(); }
      return code;
    }
    case 'while': {
      const rd = await applyRedirs(node.redirs, ctx);
      if(rd.error){ ctx.err(rd.error + '\n'); return 1; }
      let code = 0, guard = 0;
      try{
        for(;;){
          if(++guard > 20000){ ctx.err('bash : boucle interrompue (limite de sécurité du simulateur)\n'); return 1; }
          const c = await execNode(node.cond, rd.ctx);
          const ok = node.until ? c !== 0 : c === 0;
          if(!ok) break;
          try{ code = await execNode(node.body, rd.ctx); }
          catch(e){
            if(e && e.flow === 'break'){ if(e.n > 1){ e.n--; throw e; } break; }
            if(e && e.flow === 'continue'){ if(e.n > 1){ e.n--; throw e; } continue; }
            throw e;
          }
          if(state.exited) break;
        }
      } finally { await rd.finish(); }
      return code;
    }
    case 'func': {
      state.funcs[node.name] = node.body;
      return 0;
    }
    case 'simple':
      return await execSimple(node, ctx);
  }
  return 0;
}

async function runBackground(node, ctx){
  const pid = state.nextPid++;
  const jobId = state.jobs.length + 1;
  const job = {id:jobId, pid, cmd:'commande en arrière-plan', status:'running', cancel:false};
  state.jobs.push(job);
  state.lastBgPid = pid;
  state.procs.push({pid, user:state.user, cmd:job.cmd, cpu:0.0, mem:0.1, stat:'S', tty:'pts/0', time:'00:00:00'});
  ctx.out(`[${jobId}] ${pid}\n`);
  const sub = {stdin:'', depth:ctx.depth, out:ctx.out, err:ctx.err, job};
  Promise.resolve().then(()=>execNode(node, sub)).then(()=>{
    job.status = 'done';
    state.procs = state.procs.filter(p=>p.pid !== pid);
    if(state.io.write) state.io.write(`[${jobId}]+  Terminé                 ${job.cmd}\n`, 'dim');
  }).catch(()=>{
    job.status = 'done';
    state.procs = state.procs.filter(p=>p.pid !== pid);
  });
  return 0;
}

async function execSimple(node, ctx){
  /* affectations seules */
  if(!node.words.length){
    for(const a of node.assigns){
      const v = (await expandWord(a.value, ctx, {noGlob:true})).join(' ');
      setVar(a.name, v);
    }
    const rd = await applyRedirs(node.redirs, ctx);
    if(rd.error){ ctx.err(rd.error + '\n'); return 1; }
    await rd.finish();
    return 0;
  }
  let argv = [];
  /* dans [[ ... ]] les jokers servent de motif de comparaison, pas de
     développement de noms de fichiers */
  const firstLiteral = node.words[0] ? node.words[0].map(p => p.s).join('') : '';
  const keepGlobs = (firstLiteral === '[[');
  for(const w of node.words) argv.push(...await expandWord(w, ctx, {noGlob:keepGlobs}));
  if(!argv.length) return 0;

  /* alias */
  if(state.aliases[argv[0]] && !node._noAlias){
    const expanded = state.aliases[argv[0]];
    try{
      const sub = parse(expanded + ' ' + argv.slice(1).map(shellQuote).join(' '));
      const first = sub.parts[0] && sub.parts[0].node;
      if(first && first.type === 'simple'){ first._noAlias = true; first.redirs = first.redirs.concat(node.redirs); }
      return await execNode(sub, ctx);
    }catch(e){ /* alias mal formé : on continue normalement */ }
  }

  const rd = await applyRedirs(node.redirs, ctx);
  if(rd.error){ ctx.err(rd.error + '\n'); return 1; }
  const cctx = rd.ctx;

  /* env temporaire */
  const saved = [];
  for(const a of node.assigns){
    const v = (await expandWord(a.value, cctx, {noGlob:true})).join(' ');
    saved.push([a.name, Object.prototype.hasOwnProperty.call(state.env,a.name) ? state.env[a.name] : undefined,
                        Object.prototype.hasOwnProperty.call(state.vars,a.name) ? state.vars[a.name] : undefined]);
    state.env[a.name] = v;
  }
  let code = 0;
  try{
    code = await dispatch(argv, cctx);
  } finally {
    for(const [n,ev,vv] of saved){
      if(ev === undefined) delete state.env[n]; else state.env[n] = ev;
      if(vv !== undefined) state.vars[n] = vv;
    }
    await rd.finish();
  }
  return code;
}

function shellQuote(s){
  if(/^[A-Za-z0-9_.\/:=@%+-]+$/.test(s)) return s;
  return "'" + s.replace(/'/g, `'\\''`) + "'";
}

async function dispatch(argv, ctx){
  const name = argv[0];
  const args = argv.slice(1);
  if(ctx.depth > 40){ ctx.err('bash : profondeur d\'imbrication maximale atteinte\n'); return 1; }

  /* fonction utilisateur */
  if(state.funcs[name]){
    const savedPos = positional;
    positional = args;
    funcDepth++;
    try{
      return await execNode(state.funcs[name], ctx);
    }catch(e){
      if(e && e.flow === 'return') return e.code;
      throw e;
    }finally{ positional = savedPos; funcDepth--; }
  }
  /* script ou binaire par chemin */
  if(name.includes('/')){
    return await runScriptFile(name, args, ctx);
  }
  const fn = CMDS[name];
  if(fn){
    const noHelp = ['echo','printf','test','[','[[','yes','true','false',':'];
    if(!noHelp.includes(name) && (args.includes('--help') || (args.includes('-h') && ['ssh','apt','systemctl','git','docker'].includes(name)))){
      ctx.out((HELP[name] || (name + ' : pas d\'aide détaillée disponible.')) + '\n');
      return 0;
    }
    return await fn(ctx, args);
  }
  ctx.err(`${name} : commande introuvable\n`);
  return 127;
}

async function runScriptFile(path, args, ctx){
  const r = lookup(path);
  if(r.err){ ctx.err(`bash: ${path}: Aucun fichier ou dossier de ce type\n`); return 127; }
  if(r.node.type === 'dir'){ ctx.err(`bash: ${path}: est un dossier\n`); return 126; }
  if(!canExec(r.node)){ ctx.err(`bash: ${path}: Permission non accordée\n`); return 126; }
  if(!canRead(r.node)){ ctx.err(`bash: ${path}: Permission non accordée\n`); return 126; }
  return await runScriptSource(r.node.content, args, ctx);
}

async function runScriptSource(src, args, ctx){
  const savedPos = positional;
  positional = args;
  funcDepth++;
  try{
    const ast = parse(src);
    const code = await execNode(ast, {stdin:ctx.stdin, out:ctx.out, err:ctx.err, depth:(ctx.depth||0)+1});
    return code;
  }catch(e){
    if(e && e.flow === 'exit'){ state.exited = false; return e.code; }
    if(e && e.flow === 'return') return e.code;
    ctx.err('bash : ' + (e && e.message ? e.message : String(e)) + '\n');
    return 2;
  }finally{ positional = savedPos; funcDepth--; }
}

/* =====================================================================
   Partie 5 : commandes — outils communs et gestion des fichiers
   ===================================================================== */
const CMDS = {};
const HELP = {};

function getopt(args, spec){
  spec = spec || {};
  const val = spec.value || '';
  const known = spec.known == null ? null : spec.known;
  const longs = spec.longs || [];
  const opts = {}, rest = [];
  /* en cas d'erreur on renvoie tout de même opts et rest vides :
     un appelant qui oublie de tester g.error ne provoque plus d'exception */
  const fail = (msg) => ({error:msg, opts:{}, rest:[]});
  let noMore = false;
  for(let i=0;i<args.length;i++){
    const a = args[i];
    if(noMore){ rest.push(a); continue; }
    if(a === '--'){ noMore = true; continue; }
    if(a.length > 2 && a.startsWith('--')){
      const eq = a.indexOf('=');
      const nm = eq < 0 ? a.slice(2) : a.slice(2, eq);
      if(!longs.includes(nm)) return fail(`option non reconnue « --${nm} »`);
      opts['--'+nm] = eq < 0 ? true : a.slice(eq+1);
      continue;
    }
    /* « -1 » est une option si le chiffre figure dans les options connues
       (ls -1), sinon c'est un opérande ou un nombre négatif */
    const numeric = /^-\d+$/.test(a);
    const digitsAreOptions = numeric && known !== null && a.slice(1).split('').every(c => known.includes(c));
    if(a.length > 1 && a[0] === '-' && (!numeric || digitsAreOptions)){
      for(let k=1;k<a.length;k++){
        const c = a[k];
        if(known && !known.includes(c)) return fail(`option non valide -- « ${c} »`);
        if(val.includes(c)){
          const v = a.slice(k+1) || args[++i];
          if(v === undefined) return fail(`l'option requiert un argument -- « ${c} »`);
          opts[c] = v; k = a.length; break;
        }
        opts[c] = true;
      }
      continue;
    }
    rest.push(a);
  }
  return {opts, rest};
}
function usageErr(ctx, cmd, msg){ ctx.err(`${cmd} : ${msg}\nSaisissez « ${cmd} --help » pour plus d'informations.\n`); return 2; }
function noEnt(ctx, cmd, p){ ctx.err(`${cmd}: impossible d'accéder à '${p}': Aucun fichier ou dossier de ce type\n`); return 1; }
function cloneNode(n){
  if(n.type === 'dir'){
    const c = dnode(n.mode, n.owner, n.group);
    for(const k of Object.keys(n.children)) c.children[k] = cloneNode(n.children[k]);
    return c;
  }
  if(n.type === 'link') return lnode(n.target, n.owner);
  const f = fnode(n.content, n.mode, n.owner, n.group);
  f.mtime = n.mtime;
  return f;
}
function lines(s){ return s === '' ? [] : s.replace(/\n$/,'').split('\n'); }

/* ---------------- pwd / cd ---------------- */
HELP.pwd = "pwd — affiche le chemin absolu du dossier courant.";
CMDS.pwd = async (ctx) => { ctx.out(state.cwd + '\n'); return 0; };

HELP.cd = "cd [dossier] — change de dossier.\n  cd        retourne au dossier personnel\n  cd -      revient au dossier précédent\n  cd ..     remonte d'un niveau";
CMDS.cd = async (ctx, args) => {
  let t = args[0];
  if(!t) t = USERS[state.user].home;
  else if(t === '-'){ t = state.env.OLDPWD || state.cwd; ctx.out(t + '\n'); }
  const r = lookup(t);
  if(r.err){
    if(r.code === 'EACCES') ctx.err(`bash: cd: ${args[0]}: Permission non accordée\n`);
    else ctx.err(`bash: cd: ${args[0]}: Aucun fichier ou dossier de ce type\n`);
    return 1;
  }
  if(r.node.type !== 'dir'){ ctx.err(`bash: cd: ${args[0]}: N'est pas un dossier\n`); return 1; }
  if(!perms(r.node).x){ ctx.err(`bash: cd: ${args[0]}: Permission non accordée\n`); return 1; }
  state.env.OLDPWD = state.cwd;
  state.cwd = r.path;
  state.env.PWD = state.cwd;
  return 0;
};

/* ---------------- ls ---------------- */
HELP.ls = `ls [OPTION]... [FICHIER]...
Liste le contenu des dossiers.
  -a  affiche aussi les entrées cachées (dont . et ..)
  -A  comme -a mais sans . ni ..
  -l  format long (droits, propriétaire, taille, date)
  -h  tailles lisibles (Ko, Mo) — à combiner avec -l
  -R  parcours récursif
  -t  trie par date de modification
  -S  trie par taille
  -r  inverse l'ordre du tri
  -1  une entrée par ligne
  -d  affiche le dossier lui-même, pas son contenu
  -F  ajoute un indicateur de type (/ @ *)
  -i  affiche le numéro d'inode`;
let inodeSeq = 1000;
function inodeOf(n){ if(!n._ino) n._ino = ++inodeSeq; return n._ino; }
CMDS.ls = async (ctx, args) => {
  const g = getopt(args, {known:'aAlhRtSr1dFiC', longs:['all','almost-all','color','human-readable','reverse','recursive','classify','inode','size','help']});
  if(g.error) return usageErr(ctx, 'ls', g.error);
  const o = g.opts;
  const targets = g.rest.length ? g.rest : ['.'];
  let code = 0;
  const blocks = [];

  const fmtName = (nm, node) => {
    if(!o.F) return nm;
    if(node.type === 'dir') return nm + '/';
    if(node.type === 'link') return nm + '@';
    if(perms(node).x) return nm + '*';
    return nm;
  };
  const render = (entries, showTotal) => {
    if(o.l){
      const out = [];
      if(entries.length && showTotal){
        const total = entries.reduce((a,e)=>a + Math.ceil(nodeSize(e.node)/1024)*4, 0);
        out.push('total ' + total);
      }
      const sz = entries.map(e => o.h ? humanSize(nodeSize(e.node)) : String(nodeSize(e.node)));
      const w = Math.max(0, ...sz.map(s=>s.length));
      const wo = Math.max(0, ...entries.map(e=>e.node.owner.length));
      const wg = Math.max(0, ...entries.map(e=>e.node.group.length));
      const linkCount = (n2) => n2.type === 'dir' ? 2 + Object.values(n2.children).filter(c=>c.type==='dir').length : 1;
      const wl = Math.max(1, ...entries.map(e=>String(linkCount(e.node)).length));
      entries.forEach((e,i)=>{
        const n = e.node;
        const links = linkCount(n);
        let nm = fmtName(e.name, n);
        if(n.type === 'link') nm = e.name + ' -> ' + n.target;
        out.push(
          (o.i ? String(inodeOf(n)).padStart(7,' ') + ' ' : '') +
          modeString(n) + ' ' + String(links).padStart(wl,' ') + ' ' +
          n.owner.padEnd(wo,' ') + ' ' + n.group.padEnd(wg,' ') + ' ' +
          sz[i].padStart(w,' ') + ' ' + timeString(n.mtime) + ' ' + nm
        );
      });
      return out.join('\n');
    }
    const names = entries.map(e => (o.i ? inodeOf(e.node) + ' ' : '') + fmtName(e.name, e.node));
    if(o['1'] || names.length === 0) return names.join('\n');
    const width = 80;
    const colw = Math.max(...names.map(s=>s.length)) + 2;
    const cols = Math.max(1, Math.floor(width / colw));
    if(cols <= 1) return names.join('\n');
    const rows = Math.ceil(names.length / cols);
    const out = [];
    for(let r=0;r<rows;r++){
      let line = '';
      for(let c=0;c<cols;c++){
        const idx = c*rows + r;
        if(idx < names.length) line += names[idx].padEnd(c === cols-1 ? 0 : colw, ' ');
      }
      out.push(line.replace(/\s+$/,''));
    }
    return out.join('\n');
  };
  const sortEntries = (arr) => {
    if(o.t) arr.sort((a,b)=> b.node.mtime - a.node.mtime);
    else if(o.S) arr.sort((a,b)=> nodeSize(b.node) - nodeSize(a.node));
    else arr.sort((a,b)=> a.name.localeCompare(b.name, 'en'));
    if(o.r) arr.reverse();
    return arr;
  };
  const listDir = (path, node, header) => {
    if(!canRead(node)){ ctx.err(`ls: impossible d'ouvrir le répertoire '${path}': Permission non accordée\n`); code = 2; return; }
    let entries = Object.keys(node.children).map(k => ({name:k, node:node.children[k]}));
    if(!o.a && !o.A) entries = entries.filter(e => !e.name.startsWith('.'));
    sortEntries(entries);
    if(o.a){
      const parent = lookup(dirnameOf(path));
      entries.unshift({name:'..', node: parent.err ? node : parent.node}, {name:'.', node});
    }
    blocks.push((header ? path + ':\n' : '') + render(entries, true));
    if(o.R){
      for(const e of entries){
        if(e.name === '.' || e.name === '..') continue;
        if(e.node.type === 'dir') listDir((path === '/' ? '' : path) + '/' + e.name, e.node, true);
      }
    }
  };

  const files = [], dirs = [];
  for(const t of targets){
    const r = lookup(t, {noFollowLast:true});
    if(r.err){ ctx.err(`ls: impossible d'accéder à '${t}': Aucun fichier ou dossier de ce type\n`); code = 2; continue; }
    if(r.node.type === 'dir' && !o.d) dirs.push({path:r.path, node:r.node, given:t});
    else files.push({name:t, node:r.node});
  }
  if(files.length) blocks.push(render(sortEntries(files), false));
  for(const d of dirs) listDir(d.path, d.node, targets.length > 1 || o.R);
  const text = blocks.filter(b=>b !== '').join('\n\n');
  if(text) ctx.out(text + '\n');
  return code;
};

/* ---------------- mkdir / rmdir ---------------- */
HELP.mkdir = "mkdir [-p] [-m MODE] DOSSIER...\n  -p  crée les dossiers parents au besoin, sans erreur s'ils existent\n  -v  affiche chaque création";
CMDS.mkdir = async (ctx, args) => {
  const g = getopt(args, {known:'pvm', value:'m', longs:['parents','verbose','help']});
  if(g.error) return usageErr(ctx, 'mkdir', g.error);
  const o = g.opts;
  if(!g.rest.length) return usageErr(ctx, 'mkdir', 'opérande manquant');
  const parents = o.p || o['--parents'];
  let code = 0;
  for(const t of g.rest){
    const target = absPath(t);
    if(parents){
      const segs = target.split('/').filter(Boolean);
      let cur = '', node = state.root;
      for(const s of segs){
        cur += '/' + s;
        if(node.children[s]){
          node = node.children[s];
          if(node.type !== 'dir'){ ctx.err(`mkdir: impossible de créer le répertoire « ${cur} »: Le fichier existe\n`); code = 1; break; }
          continue;
        }
        if(!canWrite(node)){ ctx.err(`mkdir: impossible de créer le répertoire « ${cur} »: Permission non accordée\n`); code = 1; break; }
        const nn = dnode(0o777 & ~(state.umask || 0), state.user, state.user);
        node.children[s] = nn; node = nn;
        if(o.v || o['--verbose']) ctx.out(`mkdir: création du répertoire '${cur}'\n`);
      }
      continue;
    }
    if(exists(target)){ ctx.err(`mkdir: impossible de créer le répertoire « ${t} »: Le fichier existe\n`); code = 1; continue; }
    const par = lookup(dirnameOf(target));
    if(par.err || par.node.type !== 'dir'){ ctx.err(`mkdir: impossible de créer le répertoire « ${t} »: Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    if(!canWrite(par.node)){ ctx.err(`mkdir: impossible de créer le répertoire « ${t} »: Permission non accordée\n`); code = 1; continue; }
    par.node.children[basenameOf(target)] = dnode(0o777 & ~(state.umask || 0), state.user, state.user);
    if(o.v || o['--verbose']) ctx.out(`mkdir: création du répertoire '${t}'\n`);
  }
  return code;
};

HELP.rmdir = "rmdir DOSSIER... — supprime des dossiers vides.\n  -p  supprime aussi les parents devenus vides";
CMDS.rmdir = async (ctx, args) => {
  const g = getopt(args, {known:'pv'});
  if(g.error) return usageErr(ctx, 'rmdir', g.error);
  if(!g.rest.length) return usageErr(ctx, 'rmdir', 'opérande manquant');
  let code = 0;
  for(const t of g.rest){
    const r = lookup(t);
    if(r.err){ ctx.err(`rmdir: impossible de supprimer '${t}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    if(r.node.type !== 'dir'){ ctx.err(`rmdir: impossible de supprimer '${t}': N'est pas un dossier\n`); code = 1; continue; }
    if(Object.keys(r.node.children).length){ ctx.err(`rmdir: impossible de supprimer '${t}': Le dossier n'est pas vide\n`); code = 1; continue; }
    if(!canWrite(r.parent)){ ctx.err(`rmdir: impossible de supprimer '${t}': Permission non accordée\n`); code = 1; continue; }
    delete r.parent.children[r.name];
  }
  return code;
};

/* ---------------- touch ---------------- */
HELP.touch = "touch FICHIER... — crée les fichiers absents, met à jour l'horodatage des existants.\n  -c  ne crée aucun fichier\n  -d  date à appliquer (ex. -d '2020-01-01')";
CMDS.touch = async (ctx, args) => {
  const g = getopt(args, {known:'cad', value:'d'});
  if(g.error) return usageErr(ctx, 'touch', g.error);
  if(!g.rest.length) return usageErr(ctx, 'touch', 'opérande fichier manquant');
  const when = g.opts.d ? new Date(g.opts.d) : now();
  let code = 0;
  for(const t of g.rest){
    const r = lookup(t);
    if(!r.err){
      if(!canWrite(r.node) && r.node.owner !== state.user && state.user !== 'root'){
        ctx.err(`touch: impossible de faire un touch sur '${t}': Permission non accordée\n`); code = 1; continue;
      }
      r.node.mtime = isNaN(when) ? now() : when;
      continue;
    }
    if(g.opts.c) continue;
    const par = lookup(dirnameOf(t));
    if(par.err || par.node.type !== 'dir'){ ctx.err(`touch: impossible de faire un touch sur '${t}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    if(!canWrite(par.node)){ ctx.err(`touch: impossible de faire un touch sur '${t}': Permission non accordée\n`); code = 1; continue; }
    const n = fnode('', 0o666 & ~(state.umask || 0), state.user, state.user);
    n.mtime = isNaN(when) ? now() : when;
    par.node.children[basenameOf(t)] = n;
  }
  return code;
};

/* ---------------- rm ---------------- */
HELP.rm = "rm [-r] [-f] [-i] FICHIER...\n  -r, -R  supprime récursivement les dossiers\n  -f      ignore les fichiers absents, ne demande jamais confirmation\n  -i      demande confirmation avant chaque suppression\n  -v      détaille les suppressions\n  -d      supprime les dossiers vides";
CMDS.rm = async (ctx, args) => {
  const g = getopt(args, {known:'rRfivd', longs:['recursive','force','verbose','help']});
  if(g.error) return usageErr(ctx, 'rm', g.error);
  const o = g.opts;
  const rec = o.r || o.R || o['--recursive'];
  const force = o.f || o['--force'];
  const verbose = o.v || o['--verbose'];
  if(!g.rest.length){ if(force) return 0; return usageErr(ctx, 'rm', 'opérande fichier manquant'); }
  let code = 0;
  for(const t of g.rest){
    const abs = absPath(t);
    if(abs === '/'){ ctx.err(`rm: il est dangereux d'opérer récursivement sur '/'\n`); code = 1; continue; }
    const r = lookup(t, {noFollowLast:true});
    if(r.err){
      if(!force){ ctx.err(`rm: impossible de supprimer '${t}': Aucun fichier ou dossier de ce type\n`); code = 1; }
      continue;
    }
    if(r.node.type === 'dir' && !rec && !o.d){ ctx.err(`rm: impossible de supprimer '${t}': est un dossier\n`); code = 1; continue; }
    if(r.node.type === 'dir' && o.d && !rec && Object.keys(r.node.children).length){
      ctx.err(`rm: impossible de supprimer '${t}': Le dossier n'est pas vide\n`); code = 1; continue;
    }
    if(!canWrite(r.parent)){ ctx.err(`rm: impossible de supprimer '${t}': Permission non accordée\n`); code = 1; continue; }
    if(o.i && !force && state.io.ask){
      const kind = r.node.type === 'dir' ? 'répertoire' : 'fichier';
      const ans = await state.io.ask(`rm : supprimer le ${kind} '${t}' ? `);
      if(!/^(o|y)/i.test((ans||'').trim())) continue;
    }
    delete r.parent.children[r.name];
    if(verbose) ctx.out(`supprimé '${t}'\n`);
  }
  return code;
};

/* ---------------- cp / mv / ln ---------------- */
HELP.cp = "cp [-r] [-i] [-v] SOURCE... DESTINATION\n  -r, -R  copie les dossiers récursivement (obligatoire pour un dossier)\n  -i      demande confirmation avant d'écraser\n  -n      n'écrase jamais\n  -p      conserve l'horodatage\n  -v      détaille les copies";
CMDS.cp = async (ctx, args) => {
  const g = getopt(args, {known:'rRivnpaf', longs:['recursive','verbose','help']});
  if(g.error) return usageErr(ctx, 'cp', g.error);
  const o = g.opts;
  const rec = o.r || o.R || o.a || o['--recursive'];
  if(g.rest.length < 2) return usageErr(ctx, 'cp', 'opérande de fichier manquant');
  const destRaw = g.rest[g.rest.length-1];
  const sources = g.rest.slice(0, -1);
  const destLook = lookup(destRaw);
  const destIsDir = !destLook.err && destLook.node.type === 'dir';
  if(sources.length > 1 && !destIsDir){ ctx.err(`cp: la cible '${destRaw}' n'est pas un dossier\n`); return 1; }
  let code = 0;
  for(const s of sources){
    const r = lookup(s);
    if(r.err){ ctx.err(`cp: impossible d'évaluer '${s}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    if(r.node.type === 'dir' && !rec){ ctx.err(`cp: -r non spécifié ; omission du dossier '${s}'\n`); code = 1; continue; }
    if(!canRead(r.node)){ ctx.err(`cp: impossible d'ouvrir '${s}' en lecture: Permission non accordée\n`); code = 1; continue; }
    const name = destIsDir ? basenameOf(s) : basenameOf(destRaw);
    const parentPath = destIsDir ? destLook.path : dirnameOf(destRaw);
    const par = lookup(parentPath);
    if(par.err || par.node.type !== 'dir'){ ctx.err(`cp: impossible de créer '${destRaw}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    if(!canWrite(par.node)){ ctx.err(`cp: impossible de créer '${destRaw}': Permission non accordée\n`); code = 1; continue; }
    if(par.node.children[name]){
      if(o.n) continue;
      if(o.i && state.io.ask){
        const ans = await state.io.ask(`cp : voulez-vous écraser '${(destIsDir?destRaw+'/':'')+name}' ? `);
        if(!/^(o|y)/i.test((ans||'').trim())) continue;
      }
    }
    const copy = cloneNode(r.node);
    copy.owner = state.user; copy.group = state.user;
    if(!o.p && !o.a) copy.mtime = now();
    par.node.children[name] = copy;
    if(o.v || o['--verbose']) ctx.out(`'${s}' -> '${destIsDir ? destRaw + '/' + name : destRaw}'\n`);
  }
  return code;
};

HELP.mv = "mv [-i] [-n] [-v] SOURCE... DESTINATION — déplace ou renomme.";
CMDS.mv = async (ctx, args) => {
  const g = getopt(args, {known:'ivnf', longs:['verbose','help']});
  if(g.error) return usageErr(ctx, 'mv', g.error);
  const o = g.opts;
  if(g.rest.length < 2) return usageErr(ctx, 'mv', 'opérande de fichier manquant');
  const destRaw = g.rest[g.rest.length-1];
  const sources = g.rest.slice(0, -1);
  const destLook = lookup(destRaw);
  const destIsDir = !destLook.err && destLook.node.type === 'dir';
  if(sources.length > 1 && !destIsDir){ ctx.err(`mv: la cible '${destRaw}' n'est pas un dossier\n`); return 1; }
  let code = 0;
  for(const s of sources){
    const r = lookup(s, {noFollowLast:true});
    if(r.err){ ctx.err(`mv: impossible d'évaluer '${s}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    if(!r.parent){ ctx.err(`mv: impossible de déplacer '${s}'\n`); code = 1; continue; }
    const name = destIsDir ? r.name : basenameOf(destRaw);
    const parentPath = destIsDir ? destLook.path : dirnameOf(destRaw);
    const par = lookup(parentPath);
    if(par.err || par.node.type !== 'dir'){ ctx.err(`mv: impossible de déplacer '${s}' vers '${destRaw}': Aucun fichier ou dossier de ce type\n`); code = 1; continue; }
    if(!canWrite(par.node) || !canWrite(r.parent)){ ctx.err(`mv: impossible de déplacer '${s}': Permission non accordée\n`); code = 1; continue; }
    if(r.node.type === 'dir' && (par.path === r.path || par.path.startsWith(r.path + '/'))){
      ctx.err(`mv: impossible de déplacer '${s}' vers un sous-dossier de lui-même\n`); code = 1; continue;
    }
    if(par.node.children[name] && o.n) continue;
    if(par.node.children[name] && o.i && state.io.ask){
      const ans = await state.io.ask(`mv : voulez-vous écraser '${name}' ? `);
      if(!/^(o|y)/i.test((ans||'').trim())) continue;
    }
    const node = r.node;
    delete r.parent.children[r.name];
    par.node.children[name] = node;
    if(o.v || o['--verbose']) ctx.out(`renommé '${s}' -> '${destIsDir ? destRaw + '/' + name : destRaw}'\n`);
  }
  return code;
};

HELP.ln = "ln [-s] CIBLE NOM — crée un lien.\n  -s  crée un lien symbolique (sinon lien physique simulé)";
CMDS.ln = async (ctx, args) => {
